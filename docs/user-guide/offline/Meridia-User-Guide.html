 📷 Screenshot 4: Map with legend, port boundary and vessel markers Select the map style button (tooltip Toggle Map Styles ) at top right. In Map Style , choose Simple , Satellite or C-MAP , and switch Grid / Graticules on or off. Use the zoom controls at bottom right. The map also shows cursor coordinates. Scroll down to the charts Arrivals and Departures ( Last 24 Hours ) and Arrivals by Vessel Type ( Last 24 Hours ). 📷 Screenshot 5: Arrivals and Departures charts Expected result You see current vessel counts, a map of vessels in and heading to the port, and charts for the last 24 hours. Good to know The legend only lists a group ( In Port , Inbound ) when that group has vessels, and is hidden when there are none. \"Commercial vessels only\" appears beside the charts. Its tooltip says all data uses commercial vessel data only and excludes passenger, fishing and tug vessels. Empty states: \"No vessels currently in port\", \"No mappable vessels currently in port\" and \"No inbound vessels\". The Inbound time frame you pick is remembered on your device. [CONFIRM] how \"in port\" and \"inbound\" are defined, and the data sources and freshness of ATA and ETA. [CONFIRM] how the Performance figures and the arrival and departure counts are calculated. [CONFIRM] map marker interactions (hover or click) as they depend on shared map code. Troubleshooting Problem What to do Charts or Performance show \"No data available\" Select Refresh , or reload the page. The message suggests adjusting filters or refreshing. The map is blank or shows a missing-token notice Contact support. [CONFIRM] wording and cause. The vessel count differs from the markers on the map The \"No mappable vessels\" message means some vessels have no usable position. [CONFIRM] Data looks old Check the \"Updated ... ago\" time, then select Refresh . "}, "05-Ports/03-how-to-read-port-congestion-and-utilisation": {"t": "How to read port congestion and utilisation", "j": "05-Ports", "h": "<p>Use the <strong>Congestion and Utilisation<\/strong> tab on a port page to see how many vessels arrive and depart, how long they stay at berth, and which vessels visit most often.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a port page (<code>/analytics/port/:id<\/code>).<\/li><li>Everything on this tab uses commercial vessel data only. A note at the top right says <strong>Commercial vessels only<\/strong>; hover over the info icon beside it to read that passenger, fishing and tug vessels are excluded.<\/li><li>The tab is only shown to accounts that have the Meridia feature. Locked sections lead to <strong>Contact us<\/strong> details. <strong><mark class=\"confirm\">[CONFIRM: exact entitlement behaviour for this tab]<\/mark><\/strong><\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open a port and select the <strong>Congestion and Utilisation<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Congestion and Utilisation tab with filters and Key Metrics<\/div><\/li><li>Select the date button at the top left (it shows, for example, <strong>Previous 30 Days<\/strong>) to change the period.<\/li><li>Choose <strong>Previous 7 Days<\/strong>, <strong>Previous 30 Days<\/strong>, <strong>Previous 90 Days<\/strong> or <strong>Previous 12 Months<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Date range menu with presets and Custom<\/div><\/li><li>For your own dates, choose <strong>Custom<\/strong>, pick a <strong>Start date<\/strong> and an <strong>End date<\/strong>, then select <strong>Apply<\/strong>.<\/li><li>Use <strong>Vessel Flag<\/strong> to choose which flags to include. Search with <strong>Search Flags<\/strong>, or use <strong>Select All<\/strong>.<\/li><li>Use <strong>Vessel Type<\/strong> to choose vessel types (for example <strong>Bulk Carrier<\/strong>, <strong>Container (FC)<\/strong>, <strong>Oil Tanker<\/strong>).<\/li><li>Use <strong>Vessel Class<\/strong> to narrow within the chosen types, for example by size band. Each class shows its gross tonnage range.<div class=\"shot\"><b>Screenshot 3<\/b> – Vessel Class menu grouped by vessel type<\/div><\/li><li>Read <strong>Key Metrics<\/strong>: <strong>Arrivals<\/strong>, <strong>Departures<\/strong>, <strong>Unique Arrivals per Day (avg)<\/strong>, <strong>Unique Arrivals per Day (max)<\/strong>, <strong>Dwell time at berth (avg)<\/strong> and <strong>Dwell time at berth (median)<\/strong>. Dwell times are shown in hours.<\/li><li>Read <strong>Arrivals and Departures<\/strong> (totals per day, week, month or quarter). The legend shows <strong>Arrivals<\/strong> and <strong>Departures<\/strong>.<\/li><li>To change the grouping on <strong>Arrivals and Departures<\/strong>, the per-period <strong>Arrivals<\/strong> chart or <strong>Dwell time at berth<\/strong>, select the grouping button (for example <strong>Daily<\/strong>), then choose <strong>Day<\/strong>, <strong>Week<\/strong>, <strong>Month<\/strong> or <strong>Quarter<\/strong> under <strong>Group By<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Group By menu with some options greyed out<\/div><\/li><li>Read the <strong>Arrivals<\/strong> donut (<strong>By Vessel Type, Totals<\/strong>). Hover over a segment to see the vessel type, count and percentage. Use the legend at the bottom to identify types.<\/li><li>Read the second <strong>Arrivals<\/strong> chart (<strong>By Vessel Type, Per<\/strong> day, week, month or quarter), a stacked bar chart with one colour per vessel type.<\/li><li>Read <strong>Dwell time at berth<\/strong>. A solid line shows the average and a dashed line shows the median. Use <strong>Berth Type<\/strong> to filter berths.<\/li><li>Scroll to <strong>Top Visiting Vessels<\/strong> and <strong>Berth Summary<\/strong> for tables (see Good to know).<\/li><li>To download a chart, select the menu icon on the chart, then <strong>Export Data (CSV)<\/strong> or <strong>Export Image (PNG)<\/strong>.<div class=\"shot\"><b>Screenshot 5<\/b> – Chart download menu<\/div><\/li><li>To reload everything, select <strong>Refresh<\/strong> at the top right.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>All charts and tables update to the chosen period and filters. Charts with no matching data show <strong>No data available<\/strong>.<\/p>\n<h2>Good to know<\/h2>\n<ul><li><strong>Group By<\/strong> options depend on the period: up to 7 days allows <strong>Day<\/strong> only; 8 to 60 days adds <strong>Week<\/strong>; 61 to 90 days adds <strong>Month<\/strong>; longer periods add <strong>Quarter<\/strong>. Unavailable options are greyed out. If you shorten the period, the grouping resets to a valid choice.<\/li><li>Custom ranges cannot start before two years ago or end after today. If the range is longer than two years, the message <strong>Date range cannot exceed two years from current date.<\/strong> appears and <strong>Apply<\/strong> stays disabled.<\/li><li>Preset periods end yesterday (UTC). <strong><mark class=\"confirm\">[CONFIRM: the time basis of the charts]<\/mark><\/strong><\/li><li><strong>Vessel Class<\/strong> is greyed out until at least one <strong>Vessel Type<\/strong> is selected, and only lists classes for the selected types. A number badge on a filter shows how many items are selected.<\/li><li><strong>Top Visiting Vessels<\/strong> lists vessels with these columns: <strong>Vessel<\/strong>, <strong>IMO<\/strong>, <strong>Flag<\/strong>, <strong>Type<\/strong>, <strong>Class<\/strong> and <strong>Visits<\/strong>. The info icon says: \"Showing repeat visiting vessels only. Single visit vessels are excluded.\" Select a row to open that vessel's page. The title shows the number of vessels.<\/li><li><strong>Berth Summary<\/strong> (\"All berths — click any row for full detail\") has the columns <strong>Berth<\/strong>, <strong>Operator<\/strong>, <strong>Type<\/strong>, <strong>Avg Dwell<\/strong> and <strong>Median Dwell<\/strong>. Select a row to open that berth's details on the <strong>Berths<\/strong> tab.<\/li><li><strong>Key Metrics<\/strong> and <strong>Top Visiting Vessels<\/strong> offer <strong>Export Data (CSV)<\/strong> only. The other charts offer CSV and PNG. The download menu is disabled when a chart has no data.<\/li><li>Your date range, flags, vessel types, classes and grouping choices are remembered in your browser.<\/li><li>How arrivals, unique arrivals, dwell time and congestion are calculated is not described in the app. <strong><mark class=\"confirm\">[CONFIRM: definitions of Arrivals, Unique Arrivals per Day and Dwell time at berth]<\/mark><\/strong><\/li><li>The same four figures (without <strong>Arrivals<\/strong>/<strong>Departures<\/strong>) appear on the port <strong>Overview<\/strong> tab under <strong>Performance (Previous 30 days)<\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A chart says <strong>No data available<\/strong><\/td><td>Widen the date range or loosen the flag, type or class filters, or select <strong>Refresh<\/strong>.<\/td><\/tr><tr><td><strong>Vessel Class<\/strong> is greyed out<\/td><td>Select at least one <strong>Vessel Type<\/strong> first.<\/td><\/tr><tr><td><strong>Week<\/strong>, <strong>Month<\/strong> or <strong>Quarter<\/strong> is greyed out<\/td><td>Choose a longer date range.<\/td><\/tr><tr><td><strong>Berth Type<\/strong> is greyed out<\/td><td>No berth types are available for this port and period.<\/td><\/tr><tr><td><strong>Apply<\/strong> is disabled for a custom range<\/td><td>Check both dates are set, the end is not before the start, and the range is under two years.<\/td><\/tr><tr><td><strong>Top Visiting Vessels<\/strong> says <strong>No recurring vessels found for the selected period<\/strong><\/td><td>Only vessels with repeat visits are shown. Try a longer period.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Congestion and Utilisation tab on a port page to see how many vessels arrive and depart, how long they stay at berth, and which vessels visit most often. Before you begin Open a port page ( /analytics/port/:id ). Everything on this tab uses commercial vessel data only. A note at the top right says Commercial vessels only ; hover over the info icon beside it to read that passenger, fishing and tug vessels are excluded. The tab is only shown to accounts that have the Meridia feature. Locked sections lead to Contact us details. [CONFIRM: exact entitlement behaviour for this tab] Steps Open a port and select the Congestion and Utilisation tab. 📷 Screenshot 1: Congestion and Utilisation tab with filters and Key Metrics Select the date button at the top left (it shows, for example, Previous 30 Days ) to change the period. Choose Previous 7 Days , Previous 30 Days , Previous 90 Days or Previous 12 Months . 📷 Screenshot 2: Date range menu with presets and Custom For your own dates, choose Custom , pick a Start date and an End date , then select Apply . Use Vessel Flag to choose which flags to include. Search with Search Flags , or use Select All . Use Vessel Type to choose vessel types (for example Bulk Carrier , Container (FC) , Oil Tanker ). Use Vessel Class to narrow within the chosen types, for example by size band. Each class shows its gross tonnage range. 📷 Screenshot 3: Vessel Class menu grouped by vessel type Read Key Metrics : Arrivals , Departures , Unique Arrivals per Day (avg) , Unique Arrivals per Day (max) , Dwell time at berth (avg) and Dwell time at berth (median) . Dwell times are shown in hours. Read Arrivals and Departures (totals per day, week, month or quarter). The legend shows Arrivals and Departures . To change the grouping on Arrivals and Departures , the per-period Arrivals chart or Dwell time at berth , select the grouping button (for example Daily ), then choose Day , Week , Month or Quarter under Group By . 📷 Screenshot 4: Group By menu with some options greyed out Read the Arrivals donut ( By Vessel Type, Totals ). Hover over a segment to see the vessel type, count and percentage. Use the legend at the bottom to identify types. Read the second Arrivals chart ( By Vessel Type, Per day, week, month or quarter), a stacked bar chart with one colour per vessel type. Read Dwell time at berth . A solid line shows the average and a dashed line shows the median. Use Berth Type to filter berths. Scroll to Top Visiting Vessels and Berth Summary for tables (see Good to know). To download a chart, select the menu icon on the chart, then Export Data (CSV) or Export Image (PNG) . 📷 Screenshot 5: Chart download menu To reload everything, select Refresh at the top right. Expected result All charts and tables update to the chosen period and filters. Charts with no matching data show No data available . Good to know Group By options depend on the period: up to 7 days allows Day only; 8 to 60 days adds Week ; 61 to 90 days adds Month ; longer periods add Quarter . Unavailable options are greyed out. If you shorten the period, the grouping resets to a valid choice. Custom ranges cannot start before two years ago or end after today. If the range is longer than two years, the message Date range cannot exceed two years from current date. appears and Apply stays disabled. Preset periods end yesterday (UTC). [CONFIRM: the time basis of the charts] Vessel Class is greyed out until at least one Vessel Type is selected, and only lists classes for the selected types. A number badge on a filter shows how many items are selected. Top Visiting Vessels lists vessels with these columns: Vessel , IMO , Flag , Type , Class and Visits . The info icon says: \"Showing repeat visiting vessels only. Single visit vessels are excluded.\" Select a row to open that vessel's page. The title shows the number of vessels. Berth Summary (\"All berths — click any row for full detail\") has the columns Berth , Operator , Type , Avg Dwell and Median Dwell . Select a row to open that berth's details on the Berths tab. Key Metrics and Top Visiting Vessels offer Export Data (CSV) only. The other charts offer CSV and PNG. The download menu is disabled when a chart has no data. Your date range, flags, vessel types, classes and grouping choices are remembered in your browser. How arrivals, unique arrivals, dwell time and congestion are calculated is not described in the app. [CONFIRM: definitions of Arrivals, Unique Arrivals per Day and Dwell time at berth] The same four figures (without Arrivals / Departures ) appear on the port Overview tab under Performance (Previous 30 days) . Troubleshooting Problem What to do A chart says No data available Widen the date range or loosen the flag, type or class filters, or select Refresh . Vessel Class is greyed out Select at least one Vessel Type first. Week , Month or Quarter is greyed out Choose a longer date range. Berth Type is greyed out No berth types are available for this port and period. Apply is disabled for a custom range Check both dates are set, the end is not before the start, and the range is under two years. Top Visiting Vessels says No recurring vessels found for the selected period Only vessels with repeat visits are shown. Try a longer period. "}, "05-Ports/04-how-to-view-inbound-vessels": {"t": "How to view inbound vessels", "j": "05-Ports", "h": "<p>See which vessels are heading to a port, with their reported arrival time, using the port <strong>Overview<\/strong> and <strong>Events<\/strong> tabs.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a port page (<code>/analytics/port/:id<\/code>).<\/li><li>Inbound vessels are based on the destination vessels report. Only vessels whose destination was updated in the last 60 days and that have not yet arrived are included. <strong><mark class=\"confirm\">[CONFIRM: how a vessel is matched to the port and the meaning of \"reported\"]<\/mark><\/strong><\/li><li>Access depends on your account's features. Locked content leads to <strong>Contact us<\/strong> details. <strong><mark class=\"confirm\">[CONFIRM: whether inbound vessels is a premium feature]<\/mark><\/strong><\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>On the <strong>Overview<\/strong> tab, find the <strong>Vessels Inbound<\/strong> card (shown with the time frame, for example <strong>Vessels Inbound (next 24h)<\/strong>) and select it to expand it.<div class=\"shot\"><b>Screenshot 1<\/b> – Vessels Inbound card on the port Overview<\/div><\/li><li>Under <strong>Within next<\/strong>, choose <strong>24h<\/strong>, <strong>7d<\/strong>, <strong>30d<\/strong> or <strong>All<\/strong>. Your choice is remembered.<\/li><li>Read the list. Each vessel shows its name, vessel type, IMO and <strong>ETA<\/strong> in UTC. The header shows the number of vessels, for example \"12 Vessels\".<\/li><li>Select a vessel in the list to open its vessel page.<\/li><li>To see all columns, select <strong>View all Events<\/strong>. This opens the <strong>Events<\/strong> tab on <strong>Inbound Vessels<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Events tab, Inbound Vessels selected<\/div><\/li><li>Under <strong>Within next<\/strong>, choose <strong>24h<\/strong>, <strong>7d<\/strong>, <strong>30d<\/strong> or <strong>All<\/strong>.<\/li><li>Type in <strong>Search...<\/strong> to narrow the rows.<\/li><li>Select a column heading to sort. Open the side panel to show or hide columns. <strong><mark class=\"confirm\">[CONFIRM: side panel label]<\/mark><\/strong><\/li><li>Select a row to open the vessel's page.<\/li><li>On the <strong>Overview<\/strong> map, select an inbound vessel marker to see a popup, then click the vessel for more details.<div class=\"shot\"><b>Screenshot 3<\/b> – Inbound vessel popup on the map<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists inbound vessels, with the number of rows shown above the table, for example \"Showing most recent 25 events\". Each row has an <strong>Inbound<\/strong> badge in the <strong>Event<\/strong> column.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Default columns:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><strong>Event<\/strong><\/td><td>Always <strong>Inbound<\/strong> for this view.<\/td><\/tr><tr><td><strong>ETA (UTC)<\/strong> or <strong>ETA (System)<\/strong><\/td><td>The arrival time the vessel reports. Follows your time-zone setting. A dash (-) means none reported.<\/td><\/tr><tr><td><strong>Vessel<\/strong><\/td><td>Vessel name with its flag.<\/td><\/tr><tr><td><strong>IMO<\/strong><\/td><td>Vessel IMO number.<\/td><\/tr><tr><td><strong>Type<\/strong><\/td><td>Vessel type.<\/td><\/tr><tr><td><strong>Flag<\/strong><\/td><td>Flag country.<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Optional columns: <strong>Reported Destination<\/strong>, <strong>MMSI<\/strong>, <strong>Call Sign<\/strong>, <strong>Latitude<\/strong>, <strong>Longitude<\/strong>, <strong>Course (°)<\/strong>, <strong>Speed (kts)<\/strong>, <strong>Heading (°)<\/strong>, <strong>Draught (m)<\/strong>, <strong>Navigational Status (status)<\/strong>, and <strong>Last Updated (UTC)<\/strong> or <strong>Last Updated (System)<\/strong>. Position values come from the vessel's latest position report.<\/li><li>The table shows at most 500 vessels. Use <strong>Export<\/strong> for the rest.<\/li><li>In the map popup the labels are <strong>Name<\/strong>, <strong>IMO<\/strong>, <strong>Vessel Type<\/strong>, <strong>Flag<\/strong>, <strong>Reported Dest<\/strong>, <strong>Reported ETA<\/strong>, <strong>Timestamp<\/strong> and <strong>Speed/Course<\/strong>.<\/li><li><strong>Export<\/strong> on this view offers <strong>24h<\/strong>, <strong>7d<\/strong>, <strong>30d<\/strong> or <strong>All<\/strong> (no custom range). The file appears under <strong>Notifications<\/strong> then <strong>Downloads<\/strong>; export times are in UTC. <strong><mark class=\"confirm\">[CONFIRM: file format and whether time frame windows match the table]<\/mark><\/strong><\/li><li><strong>Navigational Status (status)<\/strong> may show a number rather than a text description. <strong><mark class=\"confirm\">[CONFIRM: status code meanings]<\/mark><\/strong><\/li><li>Data refreshes every 5 minutes. <strong>Updated ... ago<\/strong> shows its age; select <strong>Refresh<\/strong> to reload.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>No inbound vessels<\/strong> or <strong>No data available<\/strong><\/td><td>Choose a longer <strong>Within next<\/strong> period such as <strong>All<\/strong>, or clear <strong>Search...<\/strong>.<\/td><\/tr><tr><td><strong>ETA<\/strong> is a dash<\/td><td>The vessel has not reported an arrival time.<\/td><\/tr><tr><td>A vessel is missing<\/td><td>Its destination may be older than 60 days or already marked arrived. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>The list will not load<\/td><td>Select <strong>Refresh<\/strong> or try again later.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " See which vessels are heading to a port, with their reported arrival time, using the port Overview and Events tabs. Before you begin Open a port page ( /analytics/port/:id ). Inbound vessels are based on the destination vessels report. Only vessels whose destination was updated in the last 60 days and that have not yet arrived are included. [CONFIRM: how a vessel is matched to the port and the meaning of \"reported\"] Access depends on your account's features. Locked content leads to Contact us details. [CONFIRM: whether inbound vessels is a premium feature] Steps On the Overview tab, find the Vessels Inbound card (shown with the time frame, for example Vessels Inbound (next 24h) ) and select it to expand it. 📷 Screenshot 1: Vessels Inbound card on the port Overview Under Within next , choose 24h , 7d , 30d or All . Your choice is remembered. Read the list. Each vessel shows its name, vessel type, IMO and ETA in UTC. The header shows the number of vessels, for example \"12 Vessels\". Select a vessel in the list to open its vessel page. To see all columns, select View all Events . This opens the Events tab on Inbound Vessels . 📷 Screenshot 2: Events tab, Inbound Vessels selected Under Within next , choose 24h , 7d , 30d or All . Type in Search... to narrow the rows. Select a column heading to sort. Open the side panel to show or hide columns. [CONFIRM: side panel label] Select a row to open the vessel's page. On the Overview map, select an inbound vessel marker to see a popup, then click the vessel for more details. 📷 Screenshot 3: Inbound vessel popup on the map Expected result The table lists inbound vessels, with the number of rows shown above the table, for example \"Showing most recent 25 events\". Each row has an Inbound badge in the Event column. Good to know Default columns: Column Meaning Event Always Inbound for this view. ETA (UTC) or ETA (System) The arrival time the vessel reports. Follows your time-zone setting. A dash (-) means none reported. Vessel Vessel name with its flag. IMO Vessel IMO number. Type Vessel type. Flag Flag country. Optional columns: Reported Destination , MMSI , Call Sign , Latitude , Longitude , Course (°) , Speed (kts) , Heading (°) , Draught (m) , Navigational Status (status) , and Last Updated (UTC) or Last Updated (System) . Position values come from the vessel's latest position report. The table shows at most 500 vessels. Use Export for the rest. In the map popup the labels are Name , IMO , Vessel Type , Flag , Reported Dest , Reported ETA , Timestamp and Speed/Course . Export on this view offers 24h , 7d , 30d or All (no custom range). The file appears under Notifications then Downloads ; export times are in UTC. [CONFIRM: file format and whether time frame windows match the table] Navigational Status (status) may show a number rather than a text description. [CONFIRM: status code meanings] Data refreshes every 5 minutes. Updated ... ago shows its age; select Refresh to reload. Troubleshooting Problem What to do No inbound vessels or No data available Choose a longer Within next period such as All , or clear Search... . ETA is a dash The vessel has not reported an arrival time. A vessel is missing Its destination may be older than 60 days or already marked arrived. [CONFIRM] The list will not load Select Refresh or try again later. "}, "05-Ports/05-how-to-read-the-port-events-table": {"t": "How to read the port events table", "j": "05-Ports", "h": "<p>Use the <strong>Events<\/strong> tab on a port page to see recent arrivals, departures and berth events at that port, and to filter, search and export them.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a port page (<code>/analytics/port/:id<\/code>).<\/li><li>The <strong>Historic<\/strong> view covers the last 90 days. There is no date picker. Use <strong>Export<\/strong> for other periods.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Events<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Events tab on a port page with Historic selected<\/div><\/li><li>Make sure <strong>Historic<\/strong> is selected (the other choice is <strong>Inbound Vessels<\/strong>).<\/li><li>Wait for the spinner to finish.<\/li><li>Select <strong>Event Type<\/strong> to open the list of types.<\/li><li>Tick or untick <strong>Area Arrivals<\/strong>, <strong>Arrivals<\/strong>, <strong>Berth Arrivals<\/strong>, <strong>Berth Departures<\/strong>, <strong>Departures<\/strong> and <strong>Area Departures<\/strong>. Use <strong>Select All<\/strong> to tick all at once.<div class=\"shot\"><b>Screenshot 2<\/b> – Event Type dropdown<\/div><\/li><li>Type in <strong>Search...<\/strong> to narrow the rows. It matches any value in the row, including dates as shown.<\/li><li>Select a column heading to sort. Select it again to reverse the order.<\/li><li>To show more columns, use the side panel of the table and tick the columns you want. <strong><mark class=\"confirm\">[CONFIRM: side panel label]<\/mark><\/strong><div class=\"shot\"><b>Screenshot 3<\/b> – Optional columns<\/div><\/li><li>Select a row to open that vessel's page.<\/li><li>Select <strong>Export<\/strong> to request a file (see Good to know).<div class=\"shot\"><b>Screenshot 4<\/b> – Export panel<\/div><\/li><li>Select <strong>Refresh<\/strong> at the top right to reload.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists events, newest first. Text beside the search box says, for example, \"Showing most recent 120 events\".<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Default columns:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><strong>TimeStamp (UTC)<\/strong> or <strong>TimeStamp (System)<\/strong><\/td><td>When the event happened. Follows your time-zone setting.<\/td><\/tr><tr><td><strong>Event<\/strong><\/td><td>The event type, shown as a coloured badge.<\/td><\/tr><tr><td><strong>Vessel<\/strong><\/td><td>Vessel name with flag icon.<\/td><\/tr><tr><td><strong>IMO<\/strong><\/td><td>Vessel IMO number.<\/td><\/tr><tr><td><strong>Type<\/strong><\/td><td>Vessel type.<\/td><\/tr><tr><td><strong>Flag<\/strong><\/td><td>Flag country.<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Optional columns: <strong>Berth<\/strong>, <strong>Call Sign<\/strong>, <strong>Course<\/strong>, <strong>MMSI<\/strong>, <strong>Draught<\/strong>, <strong>Heading<\/strong>, <strong>Latitude<\/strong>, <strong>Longitude<\/strong>, <strong>Navigational Status (status)<\/strong>, <strong>Navigational Status (code)<\/strong>, <strong>Reported Destination<\/strong>, <strong>Reported ETA (UTC)<\/strong> or <strong>Reported ETA (System)<\/strong>, and <strong>Speed<\/strong>. A dash (-) means no value. <strong>Berth<\/strong> is filled only for berth events.<\/li><li>Event types: <strong>Area Arrival<\/strong> and <strong>Area Departure<\/strong> relate to the port area, <strong>Arrival<\/strong> and <strong>Departure<\/strong> to the port, and <strong>Berth Arrival<\/strong> and <strong>Berth Departure<\/strong> to a berth. <strong><mark class=\"confirm\">[CONFIRM: exact definitions and how area differs from port]<\/mark><\/strong><\/li><li>The table shows at most 500 recent events. Use <strong>Export<\/strong> for the full dataset. Export timestamps are in UTC.<\/li><li>In <strong>Export<\/strong> you choose <strong>Event type<\/strong> and <strong>Date range<\/strong> (<strong>Today<\/strong>, <strong>Yesterday<\/strong>, <strong>Last 7 Days<\/strong>, <strong>Last 30 Days<\/strong>, <strong>Last 90 Days<\/strong> or <strong>Custom<\/strong>), then select <strong>Request export<\/strong>. When ready it appears under <strong>Notifications<\/strong> then <strong>Downloads<\/strong>. A note says berth events are not included, so export those separately. <strong><mark class=\"confirm\">[CONFIRM: berth export route and file format]<\/mark><\/strong><\/li><li>The page reloads every 5 minutes. <strong>Updated ... ago<\/strong> shows the age of the data.<\/li><li>Hover over a cell to see its full value. All times use your time-zone setting.<\/li><li>The <strong>Inbound Vessels<\/strong> view has its own filters. See \"How to view inbound vessels\".<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>No data available<\/strong><\/td><td>Tick more event types and clear <strong>Search...<\/strong>.<\/td><\/tr><tr><td>Some events are missing<\/td><td>Berth and port events load separately. Select <strong>Refresh<\/strong> if one set is missing. <strong><mark class=\"confirm\">[CONFIRM: no error message is shown]<\/mark><\/strong><\/td><\/tr><tr><td>I need data older than 90 days<\/td><td>Use <strong>Export<\/strong> with a longer <strong>Date range<\/strong>.<\/td><\/tr><tr><td><strong>Refresh<\/strong> is greyed out<\/td><td>A refresh is already running.<\/td><\/tr><tr><td><strong>Request export<\/strong> is greyed out<\/td><td>Choose at least one event type and a valid date range.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Events tab on a port page to see recent arrivals, departures and berth events at that port, and to filter, search and export them. Before you begin Open a port page ( /analytics/port/:id ). The Historic view covers the last 90 days. There is no date picker. Use Export for other periods. Steps Select the Events tab. 📷 Screenshot 1: Events tab on a port page with Historic selected Make sure Historic is selected (the other choice is Inbound Vessels ). Wait for the spinner to finish. Select Event Type to open the list of types. Tick or untick Area Arrivals , Arrivals , Berth Arrivals , Berth Departures , Departures and Area Departures . Use Select All to tick all at once. 📷 Screenshot 2: Event Type dropdown Type in Search... to narrow the rows. It matches any value in the row, including dates as shown. Select a column heading to sort. Select it again to reverse the order. To show more columns, use the side panel of the table and tick the columns you want. [CONFIRM: side panel label] 📷 Screenshot 3: Optional columns Select a row to open that vessel's page. Select Export to request a file (see Good to know). 📷 Screenshot 4: Export panel Select Refresh at the top right to reload. Expected result The table lists events, newest first. Text beside the search box says, for example, \"Showing most recent 120 events\". Good to know Default columns: Column Meaning TimeStamp (UTC) or TimeStamp (System) When the event happened. Follows your time-zone setting. Event The event type, shown as a coloured badge. Vessel Vessel name with flag icon. IMO Vessel IMO number. Type Vessel type. Flag Flag country. Optional columns: Berth , Call Sign , Course , MMSI , Draught , Heading , Latitude , Longitude , Navigational Status (status) , Navigational Status (code) , Reported Destination , Reported ETA (UTC) or Reported ETA (System) , and Speed . A dash (-) means no value. Berth is filled only for berth events. Event types: Area Arrival and Area Departure relate to the port area, Arrival and Departure to the port, and Berth Arrival and Berth Departure to a berth. [CONFIRM: exact definitions and how area differs from port] The table shows at most 500 recent events. Use Export for the full dataset. Export timestamps are in UTC. In Export you choose Event type and Date range ( Today , Yesterday , Last 7 Days , Last 30 Days , Last 90 Days or Custom ), then select Request export . When ready it appears under Notifications then Downloads . A note says berth events are not included, so export those separately. [CONFIRM: berth export route and file format] The page reloads every 5 minutes. Updated ... ago shows the age of the data. Hover over a cell to see its full value. All times use your time-zone setting. The Inbound Vessels view has its own filters. See \"How to view inbound vessels\". Troubleshooting Problem What to do No data available Tick more event types and clear Search... . Some events are missing Berth and port events load separately. Select Refresh if one set is missing. [CONFIRM: no error message is shown] I need data older than 90 days Use Export with a longer Date range . Refresh is greyed out A refresh is already running. Request export is greyed out Choose at least one event type and a valid date range. "}, "05-Ports/06-how-to-view-berths-in-a-port": {"t": "How to view berths in a port", "j": "05-Ports", "h": "<p>Use the <strong>Berths<\/strong> tab on a port page to see the port's berths grouped by terminal, filter them, and export the list.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a port page (<code>/analytics/port/:id<\/code>).<\/li><li>Berth information is part of a premium section. It is visible only to entitled accounts. If you do not see the <strong>Berths<\/strong> tab, contact your Meridia administrator or use <strong>Contact us<\/strong>. <strong><mark class=\"confirm\">[CONFIRM: exact entitlement and what non-entitled users see]<\/mark><\/strong><\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Berths<\/strong> tab, next to <strong>Congestion and Utilisation<\/strong> and <strong>Events<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Berths tab selected on a port page<\/div><\/li><li>Wait for the cards and table to load. A loading indicator shows while data is being fetched.<\/li><li>Select the date button at the top left (it shows <strong>Previous 7 Days<\/strong> by default) and choose <strong>Previous 7 Days<\/strong>, <strong>Previous 30 Days<\/strong>, <strong>Previous 90 Days<\/strong>, <strong>Previous 12 Months<\/strong> or <strong>Custom<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Date range menu with preset options<\/div><\/li><li>For <strong>Custom<\/strong>, enter a <strong>Start date<\/strong> and an <strong>End date<\/strong>, then select <strong>Apply<\/strong>.<\/li><li>Select <strong>Berth Type<\/strong> and tick or untick the types you want. Use <strong>Select All<\/strong> to tick or untick everything.<div class=\"shot\"><b>Screenshot 3<\/b> – Berth Type dropdown<\/div><\/li><li>Select <strong>Terminal Name<\/strong> and tick or untick the terminals you want.<\/li><li>Check the four cards above the table: <strong>Total Berths<\/strong>, <strong>Min Dwell Time<\/strong>, <strong>Max Dwell Time<\/strong> and <strong>Terminal Operators<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – KPI cards above the berth table<\/div><\/li><li>In the table, select a terminal row to open it and see its berths. Select <strong>Expand All<\/strong> to open every terminal, or <strong>Collapse All<\/strong> to close them.<div class=\"shot\"><b>Screenshot 5<\/b> – Berth table grouped by terminal<\/div><\/li><li>Select a berth row to open its details (see \"How to view berth details and dwell time\").<\/li><li>To clear your filters, select <strong>Reset Filters<\/strong>. It is greyed out when no filter is applied. <strong><mark class=\"confirm\">[CONFIRM: whether Reset Filters restores all options or clears them]<\/mark><\/strong><\/li><li>To download the list, select <strong>Export<\/strong> (see Good to know).<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists terminals, and each terminal opens to show its berths. The cards update to match your date range and filters.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The berth table columns are:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><strong>Berth<\/strong><\/td><td>Berth name.<\/td><\/tr><tr><td><strong>Type<\/strong><\/td><td>Berth type.<\/td><\/tr><tr><td><strong>Vessel types<\/strong><\/td><td>A coloured bar showing the mix of vessel types. Hover over it to see each type and its percentage.<\/td><\/tr><tr><td><strong>Handling<\/strong><\/td><td>Berth handling facility.<\/td><\/tr><tr><td><strong>Length<\/strong><\/td><td>Berth length. <strong><mark class=\"confirm\">[CONFIRM: unit, shown as metres in the data]<\/mark><\/strong><\/td><\/tr><tr><td><strong>Max LOA<\/strong><\/td><td>Maximum vessel length overall the berth takes. <strong><mark class=\"confirm\">[CONFIRM: unit]<\/mark><\/strong><\/td><\/tr><tr><td><strong>Max DWT<\/strong><\/td><td>Maximum deadweight the berth takes. <strong><mark class=\"confirm\">[CONFIRM: unit]<\/mark><\/strong><\/td><\/tr><tr><td><strong>Depth (LW)<\/strong><\/td><td>Depth at low water. <strong><mark class=\"confirm\">[CONFIRM: unit]<\/mark><\/strong><\/td><\/tr><tr><td><strong>Min dwell<\/strong>, <strong>Avg dwell<\/strong>, <strong>Median dwell<\/strong>, <strong>Max dwell<\/strong><\/td><td>Minimum, average, median and maximum dwell time for the selected period. <strong><mark class=\"confirm\">[CONFIRM: unit (hours?) and how dwell time is calculated]<\/mark><\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>A dash (-) means no value is available.<\/li><li>A legend above the table names the vessel types present in the current results, with their colours.<\/li><li>Your date range choice is remembered in your browser and is shared with the berth details page.<\/li><li>Berth Type and Terminal Name options update each other, so you only see choices that still apply. The table refreshes shortly after you stop changing filters.<\/li><li><strong>Export<\/strong> downloads a file named berths-export.csv for the selected date range and filters. See \"How to view vessel occupancy at a berth\" for the export steps. <strong>Export<\/strong> is greyed out when there are no rows or an export is already running.<\/li><li>There is no map of berths on this tab.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>The <strong>Berths<\/strong> tab is missing<\/td><td>The section is premium. Contact your administrator or use <strong>Contact us<\/strong>.<\/td><\/tr><tr><td><strong>No data available<\/strong> appears<\/td><td>Adjust the date range or filters, or refresh the page.<\/td><\/tr><tr><td>The table is empty after filtering<\/td><td>Tick more options in <strong>Berth Type<\/strong> and <strong>Terminal Name<\/strong>, or select <strong>Reset Filters<\/strong>.<\/td><\/tr><tr><td><strong>Expand All<\/strong> is greyed out<\/td><td>It is disabled when no filter is applied. <strong><mark class=\"confirm\">[CONFIRM: this looks like unintended behaviour]<\/mark><\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Berths tab on a port page to see the port's berths grouped by terminal, filter them, and export the list. Before you begin Open a port page ( /analytics/port/:id ). Berth information is part of a premium section. It is visible only to entitled accounts. If you do not see the Berths tab, contact your Meridia administrator or use Contact us . [CONFIRM: exact entitlement and what non-entitled users see] Steps Select the Berths tab, next to Congestion and Utilisation and Events . 📷 Screenshot 1: Berths tab selected on a port page Wait for the cards and table to load. A loading indicator shows while data is being fetched. Select the date button at the top left (it shows Previous 7 Days by default) and choose Previous 7 Days , Previous 30 Days , Previous 90 Days , Previous 12 Months or Custom . 📷 Screenshot 2: Date range menu with preset options For Custom , enter a Start date and an End date , then select Apply . Select Berth Type and tick or untick the types you want. Use Select All to tick or untick everything. 📷 Screenshot 3: Berth Type dropdown Select Terminal Name and tick or untick the terminals you want. Check the four cards above the table: Total Berths , Min Dwell Time , Max Dwell Time and Terminal Operators . 📷 Screenshot 4: KPI cards above the berth table In the table, select a terminal row to open it and see its berths. Select Expand All to open every terminal, or Collapse All to close them. 📷 Screenshot 5: Berth table grouped by terminal Select a berth row to open its details (see \"How to view berth details and dwell time\"). To clear your filters, select Reset Filters . It is greyed out when no filter is applied. [CONFIRM: whether Reset Filters restores all options or clears them] To download the list, select Export (see Good to know). Expected result The table lists terminals, and each terminal opens to show its berths. The cards update to match your date range and filters. Good to know The berth table columns are: Column Meaning Berth Berth name. Type Berth type. Vessel types A coloured bar showing the mix of vessel types. Hover over it to see each type and its percentage. Handling Berth handling facility. Length Berth length. [CONFIRM: unit, shown as metres in the data] Max LOA Maximum vessel length overall the berth takes. [CONFIRM: unit] Max DWT Maximum deadweight the berth takes. [CONFIRM: unit] Depth (LW) Depth at low water. [CONFIRM: unit] Min dwell , Avg dwell , Median dwell , Max dwell Minimum, average, median and maximum dwell time for the selected period. [CONFIRM: unit (hours?) and how dwell time is calculated] A dash (-) means no value is available. A legend above the table names the vessel types present in the current results, with their colours. Your date range choice is remembered in your browser and is shared with the berth details page. Berth Type and Terminal Name options update each other, so you only see choices that still apply. The table refreshes shortly after you stop changing filters. Export downloads a file named berths-export.csv for the selected date range and filters. See \"How to view vessel occupancy at a berth\" for the export steps. Export is greyed out when there are no rows or an export is already running. There is no map of berths on this tab. Troubleshooting Problem What to do The Berths tab is missing The section is premium. Contact your administrator or use Contact us . No data available appears Adjust the date range or filters, or refresh the page. The table is empty after filtering Tick more options in Berth Type and Terminal Name , or select Reset Filters . Expand All is greyed out It is disabled when no filter is applied. [CONFIRM: this looks like unintended behaviour] "}, "05-Ports/07-how-to-view-berth-details-and-dwell-time": {"t": "How to view berth details and dwell time", "j": "05-Ports", "h": "<p>Open a single berth from the <strong>Berths<\/strong> tab to see its key facts, a dwell-time chart, and what vessels used it.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a port page and select the <strong>Berths<\/strong> tab.<\/li><li>This section is premium and visible only to entitled accounts. <strong><mark class=\"confirm\">[CONFIRM: entitlement behaviour]<\/mark><\/strong><\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the <strong>Berths<\/strong> tab, open a terminal and select a berth row.<div class=\"shot\"><b>Screenshot 1<\/b> – Berth row being selected<\/div><\/li><li>Wait while the page loads. The berth name shows at the top, next to <strong>Back<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Berth details page header with Back, date range and Vessel Flag<\/div><\/li><li>Read the <strong>Berth Details<\/strong> box on the left. It lists <strong>Operator<\/strong>, <strong>Type<\/strong>, <strong>Handling<\/strong>, <strong>Length<\/strong>, <strong>Max LOA<\/strong>, <strong>Max DWT<\/strong>, <strong>Depth (LW)<\/strong>, <strong>Dwell time at berth (avg)<\/strong> and <strong>Dwell time at berth (median)<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Berth Details box<\/div><\/li><li>Read the <strong>Dwell time at berth<\/strong> chart on the right. Its subtitle says, for example, \"Daily avg and median dwell time\". <strong><mark class=\"confirm\">[CONFIRM: Daily or Weekly is chosen by the system, not by you]<\/mark><\/strong><div class=\"shot\"><b>Screenshot 4<\/b> – Dwell time at berth line chart with legend<\/div><\/li><li>Hover over the lines to see the date for each point.<\/li><li>To change the period, select the date button (it shows <strong>Previous 7 Days<\/strong> by default) and choose a preset or <strong>Custom<\/strong>, then select <strong>Apply<\/strong>.<\/li><li>To narrow by flag, select <strong>Vessel Flag<\/strong> and tick or untick flags. Use <strong>Select All<\/strong> to tick or untick all.<\/li><li>To save the chart, select the menu icon at the top right of the chart, then <strong>Export Data (CSV)<\/strong> or <strong>Export Image (PNG)<\/strong>.<div class=\"shot\"><b>Screenshot 5<\/b> – Chart menu with export options<\/div><\/li><li>Select <strong>Back<\/strong> to return to the berth list.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The page shows the berth facts, a line chart with two lines (average and median), and below it either the vessel occupancy timeline or a <strong>Top vessels by dwell time<\/strong> table.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The chart has two lines: <strong>Dwell time at berth (avg)<\/strong> (solid) and <strong>Dwell time at berth (median)<\/strong> (dashed). The vertical axis is in hours (\"hrs\").<\/li><li>If there is only one data point, it is shown as a dot.<\/li><li><strong>Vessel Flag<\/strong> is greyed out when no flags are available for the berth and period.<\/li><li>The date range is shared with the <strong>Berths<\/strong> tab list.<\/li><li>The CSV has the columns <strong>Berth Name<\/strong>, <strong>Terminal type<\/strong>, <strong>Terminal Operator<\/strong>, <strong>Date<\/strong>, <strong>Dwell Time at berth (avg)<\/strong> and <strong>Dwell Time at berth (median)<\/strong>. The file name uses the berth name and the dates. Image export is PNG.<\/li><li>The <strong>Top vessels by dwell time<\/strong> table has the columns <strong>Vessel<\/strong>, <strong>Type<\/strong>, <strong>Visits<\/strong>, <strong>Total Dwell<\/strong> and <strong>Avg Dwell<\/strong>, with the note \"ranked by total time at berth\". Select a row to open that vessel's page. <strong><mark class=\"confirm\">[CONFIRM: when this table appears instead of the occupancy timeline; the choice comes from the data, not from a control]<\/mark><\/strong><\/li><li>How dwell time is calculated and its unit in the box and table are <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>No data available<\/strong> in the box or chart<\/td><td>Adjust the date range or flags, or refresh the page.<\/td><\/tr><tr><td>The berth name reads \"Unkown Berth\"<\/td><td>The name could not be loaded. Go <strong>Back<\/strong> and reopen the berth. <strong><mark class=\"confirm\">[CONFIRM: spelling in the product is \"Unkown\"]<\/mark><\/strong><\/td><\/tr><tr><td>The chart menu is greyed out<\/td><td>There is no chart data for the period.<\/td><\/tr><tr><td><strong>Vessel Flag<\/strong> is greyed out<\/td><td>No flags are available for this berth and period.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Open a single berth from the Berths tab to see its key facts, a dwell-time chart, and what vessels used it. Before you begin Open a port page and select the Berths tab. This section is premium and visible only to entitled accounts. [CONFIRM: entitlement behaviour] Steps In the Berths tab, open a terminal and select a berth row. 📷 Screenshot 1: Berth row being selected Wait while the page loads. The berth name shows at the top, next to Back . 📷 Screenshot 2: Berth details page header with Back, date range and Vessel Flag Read the Berth Details box on the left. It lists Operator , Type , Handling , Length , Max LOA , Max DWT , Depth (LW) , Dwell time at berth (avg) and Dwell time at berth (median) . 📷 Screenshot 3: Berth Details box Read the Dwell time at berth chart on the right. Its subtitle says, for example, \"Daily avg and median dwell time\". [CONFIRM: Daily or Weekly is chosen by the system, not by you] 📷 Screenshot 4: Dwell time at berth line chart with legend Hover over the lines to see the date for each point. To change the period, select the date button (it shows Previous 7 Days by default) and choose a preset or Custom , then select Apply . To narrow by flag, select Vessel Flag and tick or untick flags. Use Select All to tick or untick all. To save the chart, select the menu icon at the top right of the chart, then Export Data (CSV) or Export Image (PNG) . 📷 Screenshot 5: Chart menu with export options Select Back to return to the berth list. Expected result The page shows the berth facts, a line chart with two lines (average and median), and below it either the vessel occupancy timeline or a Top vessels by dwell time table. Good to know The chart has two lines: Dwell time at berth (avg) (solid) and Dwell time at berth (median) (dashed). The vertical axis is in hours (\"hrs\"). If there is only one data point, it is shown as a dot. Vessel Flag is greyed out when no flags are available for the berth and period. The date range is shared with the Berths tab list. The CSV has the columns Berth Name , Terminal type , Terminal Operator , Date , Dwell Time at berth (avg) and Dwell Time at berth (median) . The file name uses the berth name and the dates. Image export is PNG. The Top vessels by dwell time table has the columns Vessel , Type , Visits , Total Dwell and Avg Dwell , with the note \"ranked by total time at berth\". Select a row to open that vessel's page. [CONFIRM: when this table appears instead of the occupancy timeline; the choice comes from the data, not from a control] How dwell time is calculated and its unit in the box and table are [CONFIRM] . Troubleshooting Problem What to do No data available in the box or chart Adjust the date range or flags, or refresh the page. The berth name reads \"Unkown Berth\" The name could not be loaded. Go Back and reopen the berth. [CONFIRM: spelling in the product is \"Unkown\"] The chart menu is greyed out There is no chart data for the period. Vessel Flag is greyed out No flags are available for this berth and period. "}, "05-Ports/08-how-to-view-vessel-occupancy-at-a-berth": {"t": "How to view vessel occupancy at a berth", "j": "05-Ports", "h": "<p>Use the <strong>Vessel occupancy<\/strong> timeline on a berth's details page to see when vessels were at the berth and when it was free.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a berth from the <strong>Berths<\/strong> tab (see \"How to view berth details and dwell time\").<\/li><li>This is part of a premium section visible only to entitled accounts. <strong><mark class=\"confirm\">[CONFIRM: entitlement behaviour]<\/mark><\/strong><\/li><li>Whether you see the timeline or the <strong>Top vessels by dwell time<\/strong> table depends on the data returned for the berth and period. There is no switch. <strong><mark class=\"confirm\">[CONFIRM: rule]<\/mark><\/strong><\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>On the berth details page, scroll below the <strong>Berth Details<\/strong> box and the <strong>Dwell time at berth<\/strong> chart.<\/li><li>Find the <strong>Vessel occupancy<\/strong> heading. The dates beneath it show the period covered.<div class=\"shot\"><b>Screenshot 1<\/b> – Vessel occupancy header with period and gap totals<\/div><\/li><li>Read <strong>Gap time (total)<\/strong> and <strong>Gap time (avg)<\/strong>, both in hours.<\/li><li>In the <strong>Occupied<\/strong> row, each block is a vessel at the berth. Hover over a block to see <strong>Vessel<\/strong>, <strong>IMO<\/strong>, <strong>Flag<\/strong>, <strong>Type<\/strong>, <strong>From<\/strong>, <strong>To<\/strong> and <strong>Duration<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Tooltip over an occupied block<\/div><\/li><li>Select a block to open that vessel's page. The tooltip says \"Click for more vessel details\".<\/li><li>In the <strong>Gap<\/strong> row, each block is a period with no vessel. Hover over it to see <strong>From<\/strong>, <strong>To<\/strong> and <strong>Duration<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Gap row with tooltip<\/div><\/li><li>Select <strong>Next →<\/strong> to move the window forward and <strong>← Prev<\/strong> to move it back.<\/li><li>To change what is shown, change the date range or <strong>Vessel Flag<\/strong> at the top of the page.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>A timeline shows up to 15 days at a time, with date labels along the top. <strong>Prev<\/strong> and <strong>Next<\/strong> move by 7 days. Each button is greyed out at the start or end of the period.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The timeline shows 15 days at a time. For longer periods, use <strong>Prev<\/strong> and <strong>Next<\/strong>.<\/li><li>Names are shortened on narrow blocks. Hover over a block to see full details.<\/li><li>Times in tooltips are shown in UTC. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li>Gaps are shown in orange and vessels in red-orange. <strong><mark class=\"confirm\">[CONFIRM: how gaps are defined, and that the timeline fills uncovered time as gaps]<\/mark><\/strong><\/li><li><strong>Duration<\/strong> in the vessel tooltip is shown as a plain number. <strong><mark class=\"confirm\">[CONFIRM: unit, likely hours]<\/mark><\/strong><\/li><\/ul>\n<h3>Exporting the berth list<\/h3>\n<ol><li>Open the <strong>Berths<\/strong> tab and set the date range and filters.<\/li><li>Select <strong>Export<\/strong>. A message says \"Exporting CSV...\".<\/li><li>Wait. The file downloads automatically as berths-export.csv and a message says \"CSV Exported!\".<div class=\"shot\"><b>Screenshot 4<\/b> – Export button and success message<\/div><\/li><\/ol>\n<ul><li>While an export runs, <strong>Export<\/strong> is greyed out. It is also unavailable when the table is empty.<\/li><li>The file is a CSV with one row per berth. Its columns are <strong>Terminal Name<\/strong>, <strong>Berth<\/strong>, <strong>Type<\/strong>, <strong>Vessel types<\/strong>, <strong>Handling<\/strong>, <strong>Length<\/strong>, <strong>Max LOA<\/strong>, <strong>Max DWT<\/strong>, <strong>Depth (LW)<\/strong>, <strong>Min dwell<\/strong>, <strong>Avg dwell<\/strong>, <strong>Median dwell<\/strong> and <strong>Max dwell<\/strong>. <strong><mark class=\"confirm\">[CONFIRM: the file is built by the server, so its columns may differ from the on-screen table]<\/mark><\/strong><\/li><li>To download the dwell-time data for one berth instead, use the chart menu (see \"How to view berth details and dwell time\").<\/li><\/ul>\n<h3>Berth events<\/h3>\n<ul><li>Berth arrival and departure events appear in the port's <strong>Events<\/strong> tab as <strong>Berth Arrivals<\/strong> and <strong>Berth Departures<\/strong>. <strong>[CONFIRM: columns shown there; the berth-specific column set (<\/strong>TimeStamp<strong>, <\/strong>Berth Name<strong>, <\/strong>Event<strong>, <\/strong>Vessel<strong>, <\/strong>IMO<strong>, <\/strong>Type<strong>, <\/strong>Flag<strong>, optional <\/strong>Call Sign<strong>, <\/strong>Course<strong>, <\/strong>MMSI<strong>, <\/strong>Draught<strong>, <\/strong>Heading<strong>, <\/strong>Latitude<strong>, <\/strong>Longitude<strong>, <\/strong>Reported Destination<strong>, <\/strong>Reported ETA<strong>, <\/strong>Speed<strong>) was not found in use on any screen]<\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>No data available<\/strong> in place of the timeline<\/td><td>Adjust the date range or <strong>Vessel Flag<\/strong>, or refresh the page.<\/td><\/tr><tr><td>I see a table instead of a timeline<\/td><td>The page shows <strong>Top vessels by dwell time<\/strong> for this berth and period. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td><strong>Prev<\/strong> or <strong>Next<\/strong> is greyed out<\/td><td>You are at the start or end of the period.<\/td><\/tr><tr><td><strong>Export<\/strong> does not start<\/td><td>Wait for any running export to finish, and check the table has rows.<\/td><\/tr><tr><td>The export does not download<\/td><td>Allow downloads in your browser and try again.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Vessel occupancy timeline on a berth's details page to see when vessels were at the berth and when it was free. Before you begin Open a berth from the Berths tab (see \"How to view berth details and dwell time\"). This is part of a premium section visible only to entitled accounts. [CONFIRM: entitlement behaviour] Whether you see the timeline or the Top vessels by dwell time table depends on the data returned for the berth and period. There is no switch. [CONFIRM: rule] Steps On the berth details page, scroll below the Berth Details box and the Dwell time at berth chart. Find the Vessel occupancy heading. The dates beneath it show the period covered. 📷 Screenshot 1: Vessel occupancy header with period and gap totals Read Gap time (total) and Gap time (avg) , both in hours. In the Occupied row, each block is a vessel at the berth. Hover over a block to see Vessel , IMO , Flag , Type , From , To and Duration . 📷 Screenshot 2: Tooltip over an occupied block Select a block to open that vessel's page. The tooltip says \"Click for more vessel details\". In the Gap row, each block is a period with no vessel. Hover over it to see From , To and Duration . 📷 Screenshot 3: Gap row with tooltip Select Next → to move the window forward and ← Prev to move it back. To change what is shown, change the date range or Vessel Flag at the top of the page. Expected result A timeline shows up to 15 days at a time, with date labels along the top. Prev and Next move by 7 days. Each button is greyed out at the start or end of the period. Good to know The timeline shows 15 days at a time. For longer periods, use Prev and Next . Names are shortened on narrow blocks. Hover over a block to see full details. Times in tooltips are shown in UTC. [CONFIRM] Gaps are shown in orange and vessels in red-orange. [CONFIRM: how gaps are defined, and that the timeline fills uncovered time as gaps] Duration in the vessel tooltip is shown as a plain number. [CONFIRM: unit, likely hours] Exporting the berth list Open the Berths tab and set the date range and filters. Select Export . A message says \"Exporting CSV...\". Wait. The file downloads automatically as berths-export.csv and a message says \"CSV Exported!\". 📷 Screenshot 4: Export button and success message While an export runs, Export is greyed out. It is also unavailable when the table is empty. The file is a CSV with one row per berth. Its columns are Terminal Name , Berth , Type , Vessel types , Handling , Length , Max LOA , Max DWT , Depth (LW) , Min dwell , Avg dwell , Median dwell and Max dwell . [CONFIRM: the file is built by the server, so its columns may differ from the on-screen table] To download the dwell-time data for one berth instead, use the chart menu (see \"How to view berth details and dwell time\"). Berth events Berth arrival and departure events appear in the port's Events tab as Berth Arrivals and Berth Departures . [CONFIRM: columns shown there; the berth-specific column set ( TimeStamp , Berth Name , Event , Vessel , IMO , Type , Flag , optional Call Sign , Course , MMSI , Draught , Heading , Latitude , Longitude , Reported Destination , Reported ETA , Speed ) was not found in use on any screen] Troubleshooting Problem What to do No data available in place of the timeline Adjust the date range or Vessel Flag , or refresh the page. I see a table instead of a timeline The page shows Top vessels by dwell time for this berth and period. [CONFIRM] Prev or Next is greyed out You are at the start or end of the period. Export does not start Wait for any running export to finish, and check the table has rows. The export does not download Allow downloads in your browser and try again. "}, "06-Zones/01-how-to-open-and-read-a-zone-page": {"t": "How to open and read a zone page", "j": "06-Zones", "h": "<p>Open a zone in Meridia to see the vessels currently in it, its traffic analytics and its entry and exit events.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>The zone must be in your <strong>Library<\/strong> or findable through <strong>Search<\/strong>.<\/li><li>Features such as <strong>Ask IQ<\/strong> and PurpleTRAC Auto-Screening in notifications depend on your access. See Good to know.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Library<\/strong> from the main navigation.<\/li><li>Select the <strong>Zones<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Library page with the Zones tab selected<\/div><\/li><li>Select the zone you want. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how a zone is located on this tab (search box, list rows) because that screen is outside this page's code. You can also use <strong>Search<\/strong> and pick a zone from the results.<\/li><li>The zone page opens (its address ends with the zone's ID).<div class=\"shot\"><b>Screenshot 2<\/b> – Zone page showing the header, tabs and Overview<\/div><\/li><li>Check the header. It shows the zone name and a subtitle made of the zone type, sub type and country, separated by commas. A country flag is shown when one is available; otherwise a zone icon is shown.<\/li><li>Use the breadcrumbs <strong>Library<\/strong> &gt; <strong>Zones<\/strong> above the name to go back to your Library.<\/li><li>Select a tab: <strong>Overview<\/strong>, <strong>Traffic<\/strong> or <strong>Events<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – The three zone tabs<\/div><\/li><li>On <strong>Overview<\/strong>, read the vessel count, the <strong>Traffic (Previous 30 days)<\/strong> panel, the map and the charts. See \"How to view live zone traffic on the map\".<\/li><li>On <strong>Traffic<\/strong>, review the zone's analytics over a time range you choose. See \"How to read zone traffic charts\".<\/li><li>On <strong>Events<\/strong>, review the individual <strong>Entries<\/strong> and <strong>Exits<\/strong>. See \"How to read the zone events table\".<\/li><li>To add the zone to your Library, open the three-dot menu in the header and select <strong>Add to Library<\/strong>.<\/li><li>To remove it, open the same menu and select <strong>Remove from Library<\/strong>. If you have notifications configured, a <strong>Remove from Library?<\/strong> confirmation appears.<div class=\"shot\"><b>Screenshot 4<\/b> – Three-dot menu showing Add to Library<\/div><\/li><li>To set up alerts, select <strong>Manage Notifications<\/strong> in the header and switch on <strong>Enable Live Notifications<\/strong>.<div class=\"shot\"><b>Screenshot 5<\/b> – Manage Notifications panel<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You see the zone's name, type and country, and can move between its Overview, Traffic and Events tabs.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>A confirmation message (\"added to bookmarks\" or \"removed from bookmarks\") appears after you add or remove the zone.<\/li><li>In <strong>Manage Notifications<\/strong>, you can choose <strong>Entries<\/strong> and <strong>Exits<\/strong>. Enabling notifications also adds the zone to your Library; the panel says so when the zone is not yet in your Library.<\/li><li>Under <strong>Entries<\/strong>, <strong>PurpleTRAC Auto-Screening<\/strong> and the <strong>SEVERITY<\/strong> options (<strong>Critical<\/strong>, <strong>Warning<\/strong>, <strong>OK<\/strong>, <strong>Unscored<\/strong>) appear. If PurpleTRAC Auto-Screening is not enabled for you, it shows a lock and the tooltip says to contact your account manager.<\/li><li>Switch on <strong>Email Notifications<\/strong> to choose <strong>Timing<\/strong> (<strong>Immediately<\/strong> or <strong>Scheduled<\/strong>). For <strong>Scheduled<\/strong>, set <strong>Emails per day<\/strong> (<strong>1<\/strong>, <strong>2<\/strong>, <strong>3<\/strong>, <strong>4<\/strong>, <strong>Hourly<\/strong>) and <strong>Send at<\/strong>. A note warns that <strong>Immediately<\/strong> on large zones and ports may trigger a large amount of emails.<\/li><li><strong>Ask IQ<\/strong> appears next to the tabs only if your account is entitled to it. Selecting it opens Ask IQ with a prompt about this zone.<\/li><li>The header has no date range picker for zones. Time ranges are set on the <strong>Traffic<\/strong> tab.<\/li><li>Newly created custom zones show a banner: \"Traffic analytics will be available 24 hours after zone creation. Data is processed daily.\" It appears on <strong>Overview<\/strong> and <strong>Traffic<\/strong> and disappears after that period. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the processing schedule and what happens if the zone was created in a test environment.<\/li><li>A <strong>Details<\/strong> tab (name, type, sub type, country, UNLOCODE, WPI number, sub division) exists in the code but is not shown in the tab bar, so it is not available.<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> There is no zone switcher on the page. To change zone, use <strong>Search<\/strong> or <strong>Library<\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A loading placeholder stays on screen<\/td><td>Wait a moment, then reload the page.<\/td><\/tr><tr><td>An error page appears instead of the zone<\/td><td>Check the zone ID in the address, then try again. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exact error text.<\/td><\/tr><tr><td>You cannot find the zone<\/td><td>Use <strong>Search<\/strong>, or check the <strong>Zones<\/strong> tab in <strong>Library<\/strong>.<\/td><\/tr><tr><td>The traffic panels are empty on a new custom zone<\/td><td>Wait for the banner period to pass and refresh.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Open a zone in Meridia to see the vessels currently in it, its traffic analytics and its entry and exit events. Before you begin The zone must be in your Library or findable through Search . Features such as Ask IQ and PurpleTRAC Auto-Screening in notifications depend on your access. See Good to know. Steps Open Library from the main navigation. Select the Zones tab. 📷 Screenshot 1: Library page with the Zones tab selected Select the zone you want. [CONFIRM] how a zone is located on this tab (search box, list rows) because that screen is outside this page's code. You can also use Search and pick a zone from the results. The zone page opens (its address ends with the zone's ID). 📷 Screenshot 2: Zone page showing the header, tabs and Overview Check the header. It shows the zone name and a subtitle made of the zone type, sub type and country, separated by commas. A country flag is shown when one is available; otherwise a zone icon is shown. Use the breadcrumbs Library > Zones above the name to go back to your Library. Select a tab: Overview , Traffic or Events . 📷 Screenshot 3: The three zone tabs On Overview , read the vessel count, the Traffic (Previous 30 days) panel, the map and the charts. See \"How to view live zone traffic on the map\". On Traffic , review the zone's analytics over a time range you choose. See \"How to read zone traffic charts\". On Events , review the individual Entries and Exits . See \"How to read the zone events table\". To add the zone to your Library, open the three-dot menu in the header and select Add to Library . To remove it, open the same menu and select Remove from Library . If you have notifications configured, a Remove from Library? confirmation appears. 📷 Screenshot 4: Three-dot menu showing Add to Library To set up alerts, select Manage Notifications in the header and switch on Enable Live Notifications . 📷 Screenshot 5: Manage Notifications panel Expected result You see the zone's name, type and country, and can move between its Overview, Traffic and Events tabs. Good to know A confirmation message (\"added to bookmarks\" or \"removed from bookmarks\") appears after you add or remove the zone. In Manage Notifications , you can choose Entries and Exits . Enabling notifications also adds the zone to your Library; the panel says so when the zone is not yet in your Library. Under Entries , PurpleTRAC Auto-Screening and the SEVERITY options ( Critical , Warning , OK , Unscored ) appear. If PurpleTRAC Auto-Screening is not enabled for you, it shows a lock and the tooltip says to contact your account manager. Switch on Email Notifications to choose Timing ( Immediately or Scheduled ). For Scheduled , set Emails per day ( 1 , 2 , 3 , 4 , Hourly ) and Send at . A note warns that Immediately on large zones and ports may trigger a large amount of emails. Ask IQ appears next to the tabs only if your account is entitled to it. Selecting it opens Ask IQ with a prompt about this zone. The header has no date range picker for zones. Time ranges are set on the Traffic tab. Newly created custom zones show a banner: \"Traffic analytics will be available 24 hours after zone creation. Data is processed daily.\" It appears on Overview and Traffic and disappears after that period. [CONFIRM] the processing schedule and what happens if the zone was created in a test environment. A Details tab (name, type, sub type, country, UNLOCODE, WPI number, sub division) exists in the code but is not shown in the tab bar, so it is not available. [CONFIRM] There is no zone switcher on the page. To change zone, use Search or Library . Troubleshooting Problem What to do A loading placeholder stays on screen Wait a moment, then reload the page. An error page appears instead of the zone Check the zone ID in the address, then try again. [CONFIRM] exact error text. You cannot find the zone Use Search , or check the Zones tab in Library . The traffic panels are empty on a new custom zone Wait for the banner period to pass and refresh. "}, "06-Zones/02-how-to-view-live-zone-traffic-on-the-map": {"t": "How to view live zone traffic on the map", "j": "06-Zones", "h": "<p>Use the zone Overview tab to see which vessels are in the zone right now, where they are, and how traffic looked over the last 24 hours.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open the zone page and stay on the <strong>Overview<\/strong> tab. See \"How to open and read a zone page\".<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the zone and select <strong>Overview<\/strong>.<\/li><li>Look at the top right of the page. It shows \"Updated ... ago\" with a <strong>Refresh<\/strong> link. The page also notes <strong>Auto-updates every 5 minutes<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Overview with the Updated ago line and Refresh link<\/div><\/li><li>Select <strong>Refresh<\/strong> to reload the vessels and charts at once. The link is unavailable while a refresh is running.<\/li><li>Read the <strong>Vessels In Zone<\/strong> card on the left. The number is the count of vessels in the zone.<\/li><li>Select the card to open the list. It is titled <strong>In Zone<\/strong>; each row shows the vessel name, type, IMO, an <strong>ATA<\/strong> time in UTC and the flag.<div class=\"shot\"><b>Screenshot 2<\/b> – Expanded In Zone list<\/div><\/li><li>Select a vessel in the list to open its vessel page.<\/li><li>Select <strong>Back<\/strong> to return, or <strong>View all<\/strong> to go to the <strong>Events<\/strong> tab.<\/li><li>Below the card, read <strong>Traffic (Previous 30 days)<\/strong>: <strong>Unique Entries per Day (avg)<\/strong>, <strong>Unique Entries per Day (max)<\/strong>, <strong>Total Entries<\/strong> and <strong>Total Exits<\/strong>.<\/li><li>Select <strong>View Traffic Analytics<\/strong> to open the <strong>Traffic<\/strong> tab.<\/li><li>On the map, find the zone boundary and the vessels. The legend at top left shows <strong>In Zone<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Map with zone boundary, vessel markers and legend<\/div><\/li><li>Select a vessel marker to see a popup with name, IMO, vessel type, flag, reported destination and ETA, timestamp and speed/course. The popup says \"Click vessel for more details\". <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> which fields appear for each marker.<\/li><li>Select the map style button (<strong>Toggle Map Styles<\/strong>) at top right. In <strong>Map Style<\/strong>, choose <strong>Simple<\/strong>, <strong>Satellite<\/strong> or <strong>C-MAP<\/strong>, and switch <strong>Grid / Graticules<\/strong> on or off.<div class=\"shot\"><b>Screenshot 4<\/b> – Map Style panel<\/div><\/li><li>Scroll down to the charts: <strong>Entries and Exits<\/strong> (<strong>Last 24 Hours<\/strong>) and <strong>Entries by Vessel Type<\/strong> (<strong>Last 24 Hours<\/strong>).<div class=\"shot\"><b>Screenshot 5<\/b> – Entries and Exits and Entries by Vessel Type charts<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You see the current vessels in the zone on the map and in the list, the last 30 days summary, and the last 24 hours of entries and exits.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>While vessels are still loading, a progress bar shows \"Loading ... of ...\" vessels.<\/li><li>Vessel positions are shown on the map; the count in the card may be higher than the number of markers. If vessels exist but none can be mapped, the list says \"No mappable vessels currently in zone\".<\/li><li>If there are none, the list says \"No vessels currently in zone\".<\/li><li>The <strong>Vessels In Zone<\/strong> card shows only the count until you select it; the list appears when it is expanded.<\/li><li>The map shows custom zones from their saved shape, and other zones from the zone boundary. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how boundaries are sourced.<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> What counts as \"in the zone\" and how often positions update, since this depends on backend data.<\/li><li>A custom-zone banner may appear at the top of the tab for newly created zones.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Error loading vessel data\" appears<\/td><td>Select <strong>Refresh<\/strong>. If it persists, reload the page.<\/td><\/tr><tr><td>The charts show \"No data available\"<\/td><td>Select <strong>Refresh<\/strong>; the message suggests adjusting the date range or filters or refreshing.<\/td><\/tr><tr><td>The map is blank<\/td><td><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> A message appears if the map service is not configured; contact your account manager.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the zone Overview tab to see which vessels are in the zone right now, where they are, and how traffic looked over the last 24 hours. Before you begin Open the zone page and stay on the Overview tab. See \"How to open and read a zone page\". Steps Open the zone and select Overview . Look at the top right of the page. It shows \"Updated ... ago\" with a Refresh link. The page also notes Auto-updates every 5 minutes . 📷 Screenshot 1: Overview with the Updated ago line and Refresh link Select Refresh to reload the vessels and charts at once. The link is unavailable while a refresh is running. Read the Vessels In Zone card on the left. The number is the count of vessels in the zone. Select the card to open the list. It is titled In Zone ; each row shows the vessel name, type, IMO, an ATA time in UTC and the flag. 📷 Screenshot 2: Expanded In Zone list Select a vessel in the list to open its vessel page. Select Back to return, or View all to go to the Events tab. Below the card, read Traffic (Previous 30 days) : Unique Entries per Day (avg) , Unique Entries per Day (max) , Total Entries and Total Exits . Select View Traffic Analytics to open the Traffic tab. On the map, find the zone boundary and the vessels. The legend at top left shows In Zone . 📷 Screenshot 3: Map with zone boundary, vessel markers and legend Select a vessel marker to see a popup with name, IMO, vessel type, flag, reported destination and ETA, timestamp and speed/course. The popup says \"Click vessel for more details\". [CONFIRM] which fields appear for each marker. Select the map style button ( Toggle Map Styles ) at top right. In Map Style , choose Simple , Satellite or C-MAP , and switch Grid / Graticules on or off. 📷 Screenshot 4: Map Style panel Scroll down to the charts: Entries and Exits ( Last 24 Hours ) and Entries by Vessel Type ( Last 24 Hours ). 📷 Screenshot 5: Entries and Exits and Entries by Vessel Type charts Expected result You see the current vessels in the zone on the map and in the list, the last 30 days summary, and the last 24 hours of entries and exits. Good to know While vessels are still loading, a progress bar shows \"Loading ... of ...\" vessels. Vessel positions are shown on the map; the count in the card may be higher than the number of markers. If vessels exist but none can be mapped, the list says \"No mappable vessels currently in zone\". If there are none, the list says \"No vessels currently in zone\". The Vessels In Zone card shows only the count until you select it; the list appears when it is expanded. The map shows custom zones from their saved shape, and other zones from the zone boundary. [CONFIRM] how boundaries are sourced. [CONFIRM] What counts as \"in the zone\" and how often positions update, since this depends on backend data. A custom-zone banner may appear at the top of the tab for newly created zones. Troubleshooting Problem What to do \"Error loading vessel data\" appears Select Refresh . If it persists, reload the page. The charts show \"No data available\" Select Refresh ; the message suggests adjusting the date range or filters or refreshing. The map is blank [CONFIRM] A message appears if the map service is not configured; contact your account manager. "}, "06-Zones/03-how-to-read-zone-traffic-charts": {"t": "How to read zone traffic charts", "j": "06-Zones", "h": "<p>Use the Traffic tab to analyse how many vessels enter and exit a zone over a period, and which vessels visit repeatedly.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open the zone page. See \"How to open and read a zone page\".<\/li><li>Select the <strong>Traffic<\/strong> tab.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Traffic<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Traffic tab with filters and charts<\/div><\/li><li>Choose the time range with the calendar button. It shows <strong>Previous 30 Days<\/strong> at first. Options: <strong>Previous 7 Days<\/strong>, <strong>Previous 30 Days<\/strong>, <strong>Previous 90 Days<\/strong>, <strong>Previous 12 Months<\/strong>, <strong>Custom<\/strong>.<\/li><li>For <strong>Custom<\/strong>, enter a <strong>Start date<\/strong> and <strong>End date<\/strong> and apply. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the exact apply button label, which is outside this page's code. The date picker accepts dates within the last two years.<div class=\"shot\"><b>Screenshot 2<\/b>

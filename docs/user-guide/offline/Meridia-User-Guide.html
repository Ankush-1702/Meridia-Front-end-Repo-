– Time range options with Custom dates<\/div><\/li><li>Narrow the data with <strong>Vessel Flag<\/strong>, <strong>Vessel Type<\/strong> and <strong>Vessel Class<\/strong>. Each has <strong>Select All<\/strong>; <strong>Vessel Flag<\/strong> also has a <strong>Search Flags<\/strong> box.<\/li><li>Note that <strong>Vessel Class<\/strong> is greyed out until at least one vessel type is selected.<div class=\"shot\"><b>Screenshot 3<\/b> – Vessel Flag, Vessel Type and Vessel Class filters<\/div><\/li><li>Wait about a second after changing filters; the charts reload automatically.<\/li><li>Select <strong>Refresh<\/strong> to reload all charts and the table.<\/li><li>Read <strong>Key Metrics<\/strong>: <strong>Entries<\/strong>, <strong>Exits<\/strong>, <strong>Unique Entries per Day (avg)<\/strong> and <strong>Unique Entries per Day (max)<\/strong>.<\/li><li>Read the <strong>Entries and Exits<\/strong> line chart. Its subtitle reads \"Totals per Day\" (or Week, Month, Quarter).<\/li><li>Change <strong>Group By<\/strong> with the dropdown on the chart (shows <strong>Daily<\/strong>, <strong>Weekly<\/strong>, <strong>Monthly<\/strong> or <strong>Quarterly<\/strong>). Choose <strong>Day<\/strong>, <strong>Week<\/strong>, <strong>Month<\/strong> or <strong>Quarter<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Group By dropdown<\/div><\/li><li>Read <strong>Entries<\/strong> - \"By Vessel Type, Totals\" (donut chart) and <strong>Entries<\/strong> - \"By Vessel Type, Per [Day/Week/Month/Quarter]\" (bar chart, with its own <strong>Group By<\/strong>).<\/li><li>Scroll to <strong>Top Visiting Vessels<\/strong> and read the table (columns below). Select a row to open that vessel's page.<div class=\"shot\"><b>Screenshot 5<\/b> – Top Visiting Vessels table<\/div><\/li><li>To export, open the three-dot download menu on a chart or table and choose <strong>Export Data (CSV)<\/strong>, or <strong>Export Image (PNG)<\/strong> where offered.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The charts and table update to your time range and filters, and exports download with the zone name and dates in the file name.<\/p>\n<h2>Good to know<\/h2>\n<ul><li><strong>Group By<\/strong> options depend on the range: up to 7 days allows <strong>Day<\/strong> only; up to 60 days adds <strong>Week<\/strong>; up to 90 days adds <strong>Month<\/strong>; longer ranges add <strong>Quarter<\/strong>. Unavailable options are greyed out, and the selection moves to an allowed one when the range changes.<\/li><li>Your filters and <strong>Group By<\/strong> choices are remembered in your browser.<\/li><li>Export options: <strong>Key Metrics<\/strong> and <strong>Top Visiting Vessels<\/strong> offer <strong>Export Data (CSV)<\/strong> only; <strong>Entries and Exits<\/strong> and both <strong>Entries<\/strong> charts offer <strong>Export Data (CSV)<\/strong> and <strong>Export Image (PNG)<\/strong>. A download menu is unavailable while there is no data.<\/li><li>The <strong>Top Visiting Vessels<\/strong> information icon says: \"Showing repeat visiting vessels only. Single visit vessels are excluded.\" It shows a count next to the title and loads 20 rows at a time.<\/li><li><strong>Top Visiting Vessels<\/strong> columns:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><strong>Vessel<\/strong><\/td><td>Vessel name<\/td><\/tr><tr><td><strong>IMO<\/strong><\/td><td>The vessel's IMO number<\/td><\/tr><tr><td><strong>Flag<\/strong><\/td><td>Flag state<\/td><\/tr><tr><td><strong>Type<\/strong><\/td><td>Vessel type<\/td><\/tr><tr><td><strong>Class<\/strong><\/td><td>Vessel class, or \"-\" if none<\/td><\/tr><tr><td><strong>Visits<\/strong><\/td><td>Number of visits <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how a visit is counted<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> How entries, exits and unique entries per day are calculated, whether the end date is included, and the data cut-off (the presets end yesterday).<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> What the <strong>Vessel Class<\/strong> values mean for each type.<\/li><li>An <strong>Export<\/strong> button exists in the code but is switched off, so only the per-chart menus export.<\/li><li>Newly created custom zones show a banner about analytics being available after 24 hours.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"No data available\" in a panel<\/td><td>Widen the time range, reset filters, or select <strong>Refresh<\/strong>.<\/td><\/tr><tr><td><strong>Vessel Class<\/strong> cannot be opened<\/td><td>Select at least one vessel type first.<\/td><\/tr><tr><td><strong>Group By<\/strong> option is greyed out<\/td><td>Choose a longer time range.<\/td><\/tr><tr><td>\"No recurring vessels found for the selected period\"<\/td><td>No vessel visited more than once; widen the range or filters.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Traffic tab to analyse how many vessels enter and exit a zone over a period, and which vessels visit repeatedly. Before you begin Open the zone page. See \"How to open and read a zone page\". Select the Traffic tab. Steps Select the Traffic tab. 📷 Screenshot 1: Traffic tab with filters and charts Choose the time range with the calendar button. It shows Previous 30 Days at first. Options: Previous 7 Days , Previous 30 Days , Previous 90 Days , Previous 12 Months , Custom . For Custom , enter a Start date and End date and apply. [CONFIRM] the exact apply button label, which is outside this page's code. The date picker accepts dates within the last two years. 📷 Screenshot 2: Time range options with Custom dates Narrow the data with Vessel Flag , Vessel Type and Vessel Class . Each has Select All ; Vessel Flag also has a Search Flags box. Note that Vessel Class is greyed out until at least one vessel type is selected. 📷 Screenshot 3: Vessel Flag, Vessel Type and Vessel Class filters Wait about a second after changing filters; the charts reload automatically. Select Refresh to reload all charts and the table. Read Key Metrics : Entries , Exits , Unique Entries per Day (avg) and Unique Entries per Day (max) . Read the Entries and Exits line chart. Its subtitle reads \"Totals per Day\" (or Week, Month, Quarter). Change Group By with the dropdown on the chart (shows Daily , Weekly , Monthly or Quarterly ). Choose Day , Week , Month or Quarter . 📷 Screenshot 4: Group By dropdown Read Entries - \"By Vessel Type, Totals\" (donut chart) and Entries - \"By Vessel Type, Per [Day/Week/Month/Quarter]\" (bar chart, with its own Group By ). Scroll to Top Visiting Vessels and read the table (columns below). Select a row to open that vessel's page. 📷 Screenshot 5: Top Visiting Vessels table To export, open the three-dot download menu on a chart or table and choose Export Data (CSV) , or Export Image (PNG) where offered. Expected result The charts and table update to your time range and filters, and exports download with the zone name and dates in the file name. Good to know Group By options depend on the range: up to 7 days allows Day only; up to 60 days adds Week ; up to 90 days adds Month ; longer ranges add Quarter . Unavailable options are greyed out, and the selection moves to an allowed one when the range changes. Your filters and Group By choices are remembered in your browser. Export options: Key Metrics and Top Visiting Vessels offer Export Data (CSV) only; Entries and Exits and both Entries charts offer Export Data (CSV) and Export Image (PNG) . A download menu is unavailable while there is no data. The Top Visiting Vessels information icon says: \"Showing repeat visiting vessels only. Single visit vessels are excluded.\" It shows a count next to the title and loads 20 rows at a time. Top Visiting Vessels columns: Column Meaning Vessel Vessel name IMO The vessel's IMO number Flag Flag state Type Vessel type Class Vessel class, or \"-\" if none Visits Number of visits [CONFIRM] how a visit is counted [CONFIRM] How entries, exits and unique entries per day are calculated, whether the end date is included, and the data cut-off (the presets end yesterday). [CONFIRM] What the Vessel Class values mean for each type. An Export button exists in the code but is switched off, so only the per-chart menus export. Newly created custom zones show a banner about analytics being available after 24 hours. Troubleshooting Problem What to do \"No data available\" in a panel Widen the time range, reset filters, or select Refresh . Vessel Class cannot be opened Select at least one vessel type first. Group By option is greyed out Choose a longer time range. \"No recurring vessels found for the selected period\" No vessel visited more than once; widen the range or filters. "}, "06-Zones/04-how-to-read-the-zone-events-table": {"t": "How to read the zone events table", "j": "06-Zones", "h": "<p>Use the Events tab to see when individual vessels entered or left a zone, search them, and export the full history.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open the zone page. See \"How to open and read a zone page\".<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Events<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Events tab with table<\/div><\/li><li>Open the <strong>Event Type<\/strong> dropdown. Both options are selected at first: <strong>Entries<\/strong> and <strong>Exits<\/strong>.<\/li><li>Tick or untick <strong>Entries<\/strong> or <strong>Exits<\/strong>, or use the select-all option, to filter the table.<div class=\"shot\"><b>Screenshot 2<\/b> – Event Type dropdown<\/div><\/li><li>Type in <strong>Search...<\/strong> to filter the loaded rows. The search checks all fields, including the displayed time.<\/li><li>Read the line \"Showing most recent ... events\". For the full history, use <strong>Export<\/strong>.<\/li><li>Check \"Updated ... ago\". Select <strong>Refresh<\/strong> to reload now. The tab also reloads every 5 minutes.<\/li><li>Click a column heading to sort by it.<div class=\"shot\"><b>Screenshot 3<\/b> – Table with sorted column<\/div><\/li><li>Select a row to open the vessel's page.<\/li><li>To export, select <strong>Export<\/strong>. In the window, choose event types, then a date range, and select <strong>Request export<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Export window<\/div><\/li><li>Wait for \"Export queued\", then select <strong>Done<\/strong>. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> where the finished file is delivered or downloaded.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists the most recent events, newest first, for the event types you chose.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The table loads the last 90 days only, and shows at most the 500 most recent events.<\/li><li>Export date presets: <strong>Today<\/strong>, <strong>Yesterday<\/strong>, <strong>Last 7 Days<\/strong>, <strong>Last 30 Days<\/strong>, <strong>Last 90 Days<\/strong> and <strong>Custom<\/strong> (<strong>From<\/strong> and <strong>To<\/strong> dates). The default is <strong>Last 30 Days<\/strong>. Export timestamps are in UTC.<\/li><li>Event badges read <strong>Entry<\/strong> and <strong>Exit<\/strong>.<\/li><li>The timestamp heading shows <strong>TimeStamp (UTC)<\/strong> or <strong>TimeStamp (System)<\/strong> depending on your time zone setting; <strong>Reported ETA<\/strong> follows the same setting.<\/li><li>Columns shown by default:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><strong>TimeStamp<\/strong><\/td><td>When the event happened<\/td><\/tr><tr><td><strong>Event<\/strong><\/td><td><strong>Entry<\/strong> or <strong>Exit<\/strong><\/td><\/tr><tr><td><strong>Vessel<\/strong><\/td><td>Vessel name with flag<\/td><\/tr><tr><td><strong>IMO<\/strong><\/td><td>IMO number<\/td><\/tr><tr><td><strong>Type<\/strong><\/td><td>Vessel type<\/td><\/tr><tr><td><strong>Flag<\/strong><\/td><td>Flag state<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Columns hidden by default (shown through the table's column controls; <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how to reveal them):<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><strong>Call Sign<\/strong>, <strong>MMSI<\/strong><\/td><td>Vessel identifiers<\/td><\/tr><tr><td><strong>Course<\/strong>, <strong>Heading<\/strong>, <strong>Speed<\/strong><\/td><td>Movement values reported with the event<\/td><\/tr><tr><td><strong>Draught<\/strong><\/td><td>Reported draught<\/td><\/tr><tr><td><strong>Latitude<\/strong>, <strong>Longitude<\/strong><\/td><td>Position at the event<\/td><\/tr><tr><td><strong>Navigational Status (status)<\/strong>, <strong>Navigational Status (code)<\/strong><\/td><td>Reported navigational status<\/td><\/tr><tr><td><strong>Reported Destination<\/strong>, <strong>Reported ETA<\/strong><\/td><td>Voyage details reported by the vessel<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Empty values show \"-\". <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> units for course, heading, speed and draught, and how an event is detected.<\/li><li>Selecting a row opens the vessel page using its IMO number.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"No data available\"<\/td><td>Check <strong>Event Type<\/strong> has a selection, clear <strong>Search...<\/strong>, then select <strong>Refresh<\/strong>.<\/td><\/tr><tr><td>The table is empty after an error<\/td><td>Select <strong>Refresh<\/strong>. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> whether an error message is shown.<\/td><\/tr><tr><td><strong>Request export<\/strong> is unavailable<\/td><td>Select at least one event type and a valid date range.<\/td><\/tr><tr><td>An older event is missing<\/td><td>The table shows only the latest 500 from 90 days. Use <strong>Export<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Events tab to see when individual vessels entered or left a zone, search them, and export the full history. Before you begin Open the zone page. See \"How to open and read a zone page\". Steps Select the Events tab. 📷 Screenshot 1: Events tab with table Open the Event Type dropdown. Both options are selected at first: Entries and Exits . Tick or untick Entries or Exits , or use the select-all option, to filter the table. 📷 Screenshot 2: Event Type dropdown Type in Search... to filter the loaded rows. The search checks all fields, including the displayed time. Read the line \"Showing most recent ... events\". For the full history, use Export . Check \"Updated ... ago\". Select Refresh to reload now. The tab also reloads every 5 minutes. Click a column heading to sort by it. 📷 Screenshot 3: Table with sorted column Select a row to open the vessel's page. To export, select Export . In the window, choose event types, then a date range, and select Request export . 📷 Screenshot 4: Export window Wait for \"Export queued\", then select Done . [CONFIRM] where the finished file is delivered or downloaded. Expected result The table lists the most recent events, newest first, for the event types you chose. Good to know The table loads the last 90 days only, and shows at most the 500 most recent events. Export date presets: Today , Yesterday , Last 7 Days , Last 30 Days , Last 90 Days and Custom ( From and To dates). The default is Last 30 Days . Export timestamps are in UTC. Event badges read Entry and Exit . The timestamp heading shows TimeStamp (UTC) or TimeStamp (System) depending on your time zone setting; Reported ETA follows the same setting. Columns shown by default: Column Meaning TimeStamp When the event happened Event Entry or Exit Vessel Vessel name with flag IMO IMO number Type Vessel type Flag Flag state Columns hidden by default (shown through the table's column controls; [CONFIRM] how to reveal them): Column Meaning Call Sign , MMSI Vessel identifiers Course , Heading , Speed Movement values reported with the event Draught Reported draught Latitude , Longitude Position at the event Navigational Status (status) , Navigational Status (code) Reported navigational status Reported Destination , Reported ETA Voyage details reported by the vessel Empty values show \"-\". [CONFIRM] units for course, heading, speed and draught, and how an event is detected. Selecting a row opens the vessel page using its IMO number. Troubleshooting Problem What to do \"No data available\" Check Event Type has a selection, clear Search... , then select Refresh . The table is empty after an error Select Refresh . [CONFIRM] whether an error message is shown. Request export is unavailable Select at least one event type and a valid date range. An older event is missing The table shows only the latest 500 from 90 days. Use Export . "}, "07-Custom-zones/01-how-to-create-custom-zone-shortcut": {"t": "How to reach Custom Zones from the Library", "j": "07-Custom-zones", "h": "<ol><li>In the Library, open the <strong>Zones<\/strong> tab.<\/li><li>Click <strong>Custom Zones<\/strong> (top right) to see and manage your custom zones.<div class=\"shot\"><b>Screenshot 1<\/b> – Zones tab with Custom Zones button<\/div><\/li><li>To create one directly, click <strong>Add<\/strong> → <strong>Custom zone<\/strong> (under <strong>Create new<\/strong>).<\/li><\/ol>\n<p>Full steps will be covered in the Zones / Custom Zones module.<\/p>", "x": " In the Library, open the Zones tab. Click Custom Zones (top right) to see and manage your custom zones. 📷 Screenshot 1: Zones tab with Custom Zones button To create one directly, click Add → Custom zone (under Create new ). Full steps will be covered in the Zones / Custom Zones module. "}, "07-Custom-zones/02-how-to-view-and-manage-custom-zones": {"t": "How to view and manage your custom zones", "j": "07-Custom-zones", "h": "<p>See every custom zone you have created, search them by name, and open or edit any of them.<\/p>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Library<\/strong> and select the <strong>Zones<\/strong> tab.<\/li><li>Click <strong>Custom Zones<\/strong> (next to the view selector). The <strong>Custom Zones<\/strong> page opens.<ul><li>Shortcut: on the <strong>Library<\/strong> page, click <strong>Add<\/strong>, then under <strong>Create new<\/strong> choose <strong>Custom zone<\/strong> to go straight to the creation page.<\/li><\/ul><div class=\"shot\"><b>Screenshot 1<\/b> – Library Zones tab with the Custom Zones button<\/div><\/li><li>Check the count at the top left, for example \"12 Custom Zones\".<\/li><li>To find a zone, type in the <strong>Search by Name<\/strong> box. The list updates after you stop typing.<div class=\"shot\"><b>Screenshot 2<\/b> – Custom Zones list with search box, New Custom Zone button and table<\/div><\/li><li>Read the table columns: <strong>Name<\/strong>, <strong>Type<\/strong>, <strong>Updated<\/strong> and <strong>Actions<\/strong>.<\/li><li>Click a zone's <strong>Name<\/strong> to open its zone page.<\/li><li>To change a zone, click the three-dot icon in its <strong>Actions<\/strong> column and choose <strong>Edit<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Actions menu showing Edit<\/div><\/li><li>To add another zone, click <strong>New Custom Zone<\/strong> (top right).<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists your custom zones, 20 per page <strong><mark class=\"confirm\">[CONFIRM: pagination controls and whether the list is capped]<\/mark><\/strong>. While you search, the count reads for example <code>3 results for \"gulf\"<\/code>.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The <strong>Type<\/strong> column shows the zone's shape (for example Polygon or Circle) <strong><mark class=\"confirm\">[CONFIRM: exact wording shown]<\/mark><\/strong>.<\/li><li><strong>Updated<\/strong> shows the date in a format such as 05 Oct 2026.<\/li><li>Columns cannot be sorted or filtered.<\/li><li>The <strong>Actions<\/strong> menu currently offers <strong>Edit<\/strong> only.<\/li><li>Breadcrumbs at the top (<strong>Library<\/strong> &gt; <strong>Zones<\/strong>) take you back to the Library.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>The page shows \"No custom zones\"<\/td><td>You have not created one yet. Click <strong>+ New Custom Zone<\/strong>.<\/td><\/tr><tr><td>\"No matches found\" and <code>No custom zones match \"…\". Try adjusting your search or create a new zone.<\/code><\/td><td>Check the spelling or clear the search box.<\/td><\/tr><tr><td>The table says \"No custom zones found\"<\/td><td>Clear your search to see the full list.<\/td><\/tr><tr><td>An error page appears instead of the list<\/td><td>Reload the page. If it persists, contact support.<\/td><\/tr><tr><td>You cannot see <strong>Custom Zones<\/strong><\/td><td>The feature may not be enabled for your account. Contact your account manager.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " See every custom zone you have created, search them by name, and open or edit any of them. Steps Open Library and select the Zones tab. Click Custom Zones (next to the view selector). The Custom Zones page opens. Shortcut: on the Library page, click Add , then under Create new choose Custom zone to go straight to the creation page. 📷 Screenshot 1: Library Zones tab with the Custom Zones button Check the count at the top left, for example \"12 Custom Zones\". To find a zone, type in the Search by Name box. The list updates after you stop typing. 📷 Screenshot 2: Custom Zones list with search box, New Custom Zone button and table Read the table columns: Name , Type , Updated and Actions . Click a zone's Name to open its zone page. To change a zone, click the three-dot icon in its Actions column and choose Edit . 📷 Screenshot 3: Actions menu showing Edit To add another zone, click New Custom Zone (top right). Expected result The table lists your custom zones, 20 per page [CONFIRM: pagination controls and whether the list is capped] . While you search, the count reads for example 3 results for \"gulf\" . Good to know The Type column shows the zone's shape (for example Polygon or Circle) [CONFIRM: exact wording shown] . Updated shows the date in a format such as 05 Oct 2026. Columns cannot be sorted or filtered. The Actions menu currently offers Edit only. Breadcrumbs at the top ( Library > Zones ) take you back to the Library. Troubleshooting Problem What to do The page shows \"No custom zones\" You have not created one yet. Click + New Custom Zone . \"No matches found\" and No custom zones match \"…\". Try adjusting your search or create a new zone. Check the spelling or clear the search box. The table says \"No custom zones found\" Clear your search to see the full list. An error page appears instead of the list Reload the page. If it persists, contact support. You cannot see Custom Zones The feature may not be enabled for your account. Contact your account manager. "}, "07-Custom-zones/03-how-to-create-a-custom-zone": {"t": "How to create a custom zone", "j": "07-Custom-zones", "h": "<p>Define your own area of interest, as a polygon or a circle, and save it so you can analyse traffic in it.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Your account needs access to custom zones <strong><mark class=\"confirm\">[CONFIRM: entitlement wording]<\/mark><\/strong>.<\/li><li>A polygon needs 3 to 100 points. A circle needs a centre and a radius of 100 m to 1,000 km.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the creation page: on the <strong>Library<\/strong> page click <strong>Add<\/strong>, then under <strong>Create new<\/strong> choose <strong>Custom zone<\/strong>. (Or on <strong>Custom Zones<\/strong> click <strong>New Custom Zone<\/strong>.) The <strong>New Zone<\/strong> page opens.<div class=\"shot\"><b>Screenshot 1<\/b> – New Zone page - form on the left, map on the right<\/div><\/li><li>Type a <strong>Name<\/strong> (required).<\/li><li>Optionally type a <strong>Description<\/strong>.<\/li><li>Next to <strong>Type<\/strong>, choose the <strong>Polygon<\/strong> or <strong>Circle<\/strong> tab.<\/li><li>Click the pencil button to the right of the tabs to turn drawing on or off (tooltip <strong>Enable Drawing<\/strong> / <strong>Disable Drawing<\/strong>). It is on by default.<\/li><li>To draw a <strong>Polygon<\/strong>, click on the map to add points. Right-click a point to remove it. Press <strong>Escape<\/strong> to finish drawing.<div class=\"shot\"><b>Screenshot 2<\/b> – Polygon being drawn with points listed in the form<\/div><\/li><li>To draw a <strong>Circle<\/strong>, click on the map and drag to set the radius. Right-click the circle to edit it. Press <strong>Escape<\/strong> to stop editing.<\/li><li>Fine-tune the shape in the form if needed:<ul><li>Polygon: edit each point's latitude and longitude, click the <strong>+<\/strong> icon to add a point, click <strong>✕<\/strong> to delete one, or click <strong>Remove All<\/strong>.<\/li><li>Circle: edit <strong>Centre Lat<\/strong>, <strong>Centre Long<\/strong> and <strong>Radius (m)<\/strong>.<\/li><\/ul><div class=\"shot\"><b>Screenshot 3<\/b> – Circle fields in the form<\/div><\/li><li>Click <strong>Create Zone<\/strong>. A message confirms <code>Custom zone \"&lt;name&gt;\" created successfully!<\/code> and you return to the <strong>Custom Zones<\/strong> list.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The new zone appears in the <strong>Custom Zones<\/strong> list and in your Library. Traffic analytics for it appear 24 hours after creation; data is processed daily.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>You can also load a shape from a file. See \"How to upload a zone shape file or GeoJSON\".<\/li><li><strong>Create Zone<\/strong> stays disabled until the form is valid and has at least 3 polygon points, or a radius above 0 for a circle.<\/li><li>Use the map style control (top right) and zoom control (bottom right) to find your location. The map shows coordinates as you move.<\/li><li><strong>Cancel<\/strong> discards your work and returns you to the previous page.<\/li><li>Switching between <strong>Polygon<\/strong> and <strong>Circle<\/strong> remembers what you drew for each type, but only the most recent shape is kept <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Name is required\"<\/td><td>Enter a name.<\/td><\/tr><tr><td>\"Zone name must be between 1 and 100 characters\"<\/td><td>Shorten the name.<\/td><\/tr><tr><td>\"Description must be between 5 and 150 characters\"<\/td><td>Make the description 5 to 150 characters, or leave it empty.<\/td><\/tr><tr><td>\"Points (min 3)\" shown in red<\/td><td>Add at least 3 points.<\/td><\/tr><tr><td>\"Latitude is required\" / \"Longitude is required\"<\/td><td>Fill in every coordinate.<\/td><\/tr><tr><td>\"-90 to 90\" / \"-180 to 180\" (polygon) or \"Latitude -90 to 90\" / \"Longitude -180 to 180\" (circle)<\/td><td>Enter a valid coordinate.<\/td><\/tr><tr><td>\"Radius is required\", \"Min 100 meters\", \"Max 1000km\"<\/td><td>Enter a radius from 100 to 1,000,000 metres.<\/td><\/tr><tr><td>\"Polygon must have at least 3 vertices\" / \"Polygon cannot have more than 100 vertices\"<\/td><td>Use 3 to 100 points.<\/td><\/tr><tr><td>\"Minimum distance between vertices must be at least 50m (found …m)\"<\/td><td>Move points further apart.<\/td><\/tr><tr><td>\"Polygon area must be at least 31416 m² (found … m²)\"<\/td><td>Make the area bigger.<\/td><\/tr><tr><td>\"Polygon area cannot exceed 10M km² (found … km²)\"<\/td><td>Make the area smaller.<\/td><\/tr><tr><td>\"Please fix the validation errors before submitting\"<\/td><td>Check the red \"Validation Errors:\" box in the form and correct each item.<\/td><\/tr><tr><td>Other save error<\/td><td>Try again; if it persists contact support <strong><mark class=\"confirm\">[CONFIRM: server-side limits such as maximum number of zones]<\/mark><\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Define your own area of interest, as a polygon or a circle, and save it so you can analyse traffic in it. Before you begin Your account needs access to custom zones [CONFIRM: entitlement wording] . A polygon needs 3 to 100 points. A circle needs a centre and a radius of 100 m to 1,000 km. Steps Open the creation page: on the Library page click Add , then under Create new choose Custom zone . (Or on Custom Zones click New Custom Zone .) The New Zone page opens. 📷 Screenshot 1: New Zone page - form on the left, map on the right Type a Name (required). Optionally type a Description . Next to Type , choose the Polygon or Circle tab. Click the pencil button to the right of the tabs to turn drawing on or off (tooltip Enable Drawing / Disable Drawing ). It is on by default. To draw a Polygon , click on the map to add points. Right-click a point to remove it. Press Escape to finish drawing. 📷 Screenshot 2: Polygon being drawn with points listed in the form To draw a Circle , click on the map and drag to set the radius. Right-click the circle to edit it. Press Escape to stop editing. Fine-tune the shape in the form if needed: Polygon: edit each point's latitude and longitude, click the + icon to add a point, click ✕ to delete one, or click Remove All . Circle: edit Centre Lat , Centre Long and Radius (m) . 📷 Screenshot 3: Circle fields in the form Click Create Zone . A message confirms Custom zone \"<name>\" created successfully! and you return to the Custom Zones list. Expected result The new zone appears in the Custom Zones list and in your Library. Traffic analytics for it appear 24 hours after creation; data is processed daily. Good to know You can also load a shape from a file. See \"How to upload a zone shape file or GeoJSON\". Create Zone stays disabled until the form is valid and has at least 3 polygon points, or a radius above 0 for a circle. Use the map style control (top right) and zoom control (bottom right) to find your location. The map shows coordinates as you move. Cancel discards your work and returns you to the previous page. Switching between Polygon and Circle remembers what you drew for each type, but only the most recent shape is kept [CONFIRM] . Troubleshooting Problem What to do \"Name is required\" Enter a name. \"Zone name must be between 1 and 100 characters\" Shorten the name. \"Description must be between 5 and 150 characters\" Make the description 5 to 150 characters, or leave it empty. \"Points (min 3)\" shown in red Add at least 3 points. \"Latitude is required\" / \"Longitude is required\" Fill in every coordinate. \"-90 to 90\" / \"-180 to 180\" (polygon) or \"Latitude -90 to 90\" / \"Longitude -180 to 180\" (circle) Enter a valid coordinate. \"Radius is required\", \"Min 100 meters\", \"Max 1000km\" Enter a radius from 100 to 1,000,000 metres. \"Polygon must have at least 3 vertices\" / \"Polygon cannot have more than 100 vertices\" Use 3 to 100 points. \"Minimum distance between vertices must be at least 50m (found …m)\" Move points further apart. \"Polygon area must be at least 31416 m² (found … m²)\" Make the area bigger. \"Polygon area cannot exceed 10M km² (found … km²)\" Make the area smaller. \"Please fix the validation errors before submitting\" Check the red \"Validation Errors:\" box in the form and correct each item. Other save error Try again; if it persists contact support [CONFIRM: server-side limits such as maximum number of zones] . "}, "07-Custom-zones/04-how-to-upload-a-zone-shape-file-or-geojson": {"t": "How to upload a zone shape file or GeoJSON", "j": "07-Custom-zones", "h": "<p>Create or fill in a custom zone by loading a GeoJSON or WKT file instead of drawing.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Prepare a file ending in <code>.geojson<\/code>, <code>.json<\/code>, <code>.wkt<\/code> or <code>.txt<\/code>. Shapefiles and KML are not supported.<\/li><li>Only the first shape in the file is used.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the <strong>New Zone<\/strong> page (<strong>Library<\/strong> &gt; <strong>Add<\/strong> &gt; <strong>Custom zone<\/strong>).<\/li><li>Scroll to the box below the <strong>or<\/strong> divider that reads <strong>Click to upload or drag and drop<\/strong> with <strong>GeoJSON, WKT<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Upload box under the or divider<\/div><\/li><li>Click the box and choose your file, or drag the file onto it.<\/li><li>Wait for the green message, for example \"Polygon with 5 points loaded\" or \"Circle loaded successfully\".<div class=\"shot\"><b>Screenshot 2<\/b> – Loaded file pill, green message and shape on the map<\/div><\/li><li>Check the <strong>Name<\/strong>, which is filled in from the file name. Change it if you like.<\/li><li>Click <strong>Create Zone<\/strong>.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The shape appears on the map and the map zooms to it. The type switches to <strong>Polygon<\/strong> or <strong>Circle<\/strong> to match the file. The file name appears in place of the upload box.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>While a file is loaded, the type tabs, drawing button and coordinate fields are locked.<\/li><li>To start over, click the <strong>✕<\/strong> next to the file name (tooltip <strong>Remove file and clear data<\/strong>). This clears the shape and name.<\/li><li>Circles can come from a GeoJSON point with a radius, or from WKT <code>POINT<\/code> or <code>CIRCLE<\/code>. If no radius is given, 1000 m is used <strong><mark class=\"confirm\">[CONFIRM: confirm this default is intended]<\/mark><\/strong>.<\/li><li>The same size limits apply as when drawing (3 to 100 points, circle radius 100 m to 1,000 km).<\/li><li>Maximum file size <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Please upload a GeoJSON or WKT file\"<\/td><td>Use a <code>.geojson<\/code>, <code>.json<\/code>, <code>.wkt<\/code> or <code>.txt<\/code> file.<\/td><\/tr><tr><td>\"Unable to parse file. Please check the format.\"<\/td><td>Check the file holds a valid polygon, point or circle.<\/td><\/tr><tr><td>\"Error processing file: …\"<\/td><td>The file is not valid; fix and retry.<\/td><\/tr><tr><td>\"Error reading file\"<\/td><td>Try selecting the file again.<\/td><\/tr><tr><td>\"Zone type must be Polygon\" (or Circle)<\/td><td>When editing a zone, the file shape must match the zone's type.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Create or fill in a custom zone by loading a GeoJSON or WKT file instead of drawing. Before you begin Prepare a file ending in .geojson , .json , .wkt or .txt . Shapefiles and KML are not supported. Only the first shape in the file is used. Steps Open the New Zone page ( Library > Add > Custom zone ). Scroll to the box below the or divider that reads Click to upload or drag and drop with GeoJSON, WKT . 📷 Screenshot 1: Upload box under the or divider Click the box and choose your file, or drag the file onto it. Wait for the green message, for example \"Polygon with 5 points loaded\" or \"Circle loaded successfully\". 📷 Screenshot 2: Loaded file pill, green message and shape on the map Check the Name , which is filled in from the file name. Change it if you like. Click Create Zone . Expected result The shape appears on the map and the map zooms to it. The type switches to Polygon or Circle to match the file. The file name appears in place of the upload box. Good to know While a file is loaded, the type tabs, drawing button and coordinate fields are locked. To start over, click the ✕ next to the file name (tooltip Remove file and clear data ). This clears the shape and name. Circles can come from a GeoJSON point with a radius, or from WKT POINT or CIRCLE . If no radius is given, 1000 m is used [CONFIRM: confirm this default is intended] . The same size limits apply as when drawing (3 to 100 points, circle radius 100 m to 1,000 km). Maximum file size [CONFIRM] . Troubleshooting Problem What to do \"Please upload a GeoJSON or WKT file\" Use a .geojson , .json , .wkt or .txt file. \"Unable to parse file. Please check the format.\" Check the file holds a valid polygon, point or circle. \"Error processing file: …\" The file is not valid; fix and retry. \"Error reading file\" Try selecting the file again. \"Zone type must be Polygon\" (or Circle) When editing a zone, the file shape must match the zone's type. "}, "07-Custom-zones/05-how-to-edit-a-custom-zone": {"t": "How to edit a custom zone", "j": "07-Custom-zones", "h": "<p>Change the name, description or shape of a custom zone you created.<\/p>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Library<\/strong> &gt; <strong>Zones<\/strong> &gt; <strong>Custom Zones<\/strong>.<\/li><li>In the zone's row, click the three-dot icon in <strong>Actions<\/strong> and choose <strong>Edit<\/strong>. The page titled <strong>Edit &lt;zone name&gt;<\/strong> opens.<div class=\"shot\"><b>Screenshot 1<\/b> – Actions menu with Edit<\/div><\/li><li>Change the <strong>Name<\/strong> or <strong>Description<\/strong>.<\/li><li>Change the shape: edit points or <strong>Centre Lat<\/strong>, <strong>Centre Long<\/strong> and <strong>Radius (m)<\/strong>, or draw on the map. The existing shape is shown and the map zooms to it.<div class=\"shot\"><b>Screenshot 2<\/b> – Edit page with the existing zone loaded<\/div><\/li><li>Click <strong>Save Changes<\/strong>. A message confirms <code>Custom zone \"&lt;name&gt;\" updated successfully!<\/code> and you return to the list.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>The <strong>Polygon<\/strong> / <strong>Circle<\/strong> type cannot be changed on an existing zone.<\/li><li>You can upload a file to replace the shape, but its type must match (\"Zone type must be Polygon\" or \"Zone type must be Circle\"). The name is not overwritten.<\/li><li><strong>Save Changes<\/strong> stays disabled until you change something and the form is valid. The validation rules match those in \"How to create a custom zone\".<\/li><li><strong>Cancel<\/strong> leaves without saving.<\/li><li>Deleting a zone is not available in the screen <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>An error page shows when opening Edit<\/td><td>Return to the list and try again; the zone may no longer exist.<\/td><\/tr><tr><td><strong>Save Changes<\/strong> is greyed out<\/td><td>Make a change and fix any red fields.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Change the name, description or shape of a custom zone you created. Steps Open Library > Zones > Custom Zones . In the zone's row, click the three-dot icon in Actions and choose Edit . The page titled Edit <zone name> opens. 📷 Screenshot 1: Actions menu with Edit Change the Name or Description . Change the shape: edit points or Centre Lat , Centre Long and Radius (m) , or draw on the map. The existing shape is shown and the map zooms to it. 📷 Screenshot 2: Edit page with the existing zone loaded Click Save Changes . A message confirms Custom zone \"<name>\" updated successfully! and you return to the list. Good to know The Polygon / Circle type cannot be changed on an existing zone. You can upload a file to replace the shape, but its type must match (\"Zone type must be Polygon\" or \"Zone type must be Circle\"). The name is not overwritten. Save Changes stays disabled until you change something and the form is valid. The validation rules match those in \"How to create a custom zone\". Cancel leaves without saving. Deleting a zone is not available in the screen [CONFIRM] . Troubleshooting Problem What to do An error page shows when opening Edit Return to the list and try again; the zone may no longer exist. Save Changes is greyed out Make a change and fix any red fields. "}, "08-Fleets/01-how-to-manage-fleets-in-library": {"t": "How to open, edit or delete a fleet from the Library", "j": "08-Fleets", "h": "<p>&gt; Available only if fleet management is enabled for your account (you will see a <strong>Fleets<\/strong> tab).<\/p>\n<h2>Open a fleet<\/h2>\n<ol><li>In the Library, click the <strong>Fleets<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Fleets tab – fleet cards with vessel counts<\/div><\/li><li>Click a fleet card.<\/li><\/ol>\n<h2>Create a fleet<\/h2>\n<ol><li>Click <strong>Add<\/strong> → <strong>Fleet<\/strong> (under <strong>Create new<\/strong>), or click <strong>+ Add items<\/strong> on an empty Fleets tab.<\/li><\/ol>\n<h2>Edit or delete a fleet<\/h2>\n<ol><li>Hover over a fleet card and click the <strong>⋮<\/strong> (More actions) button at the top right.<div class=\"shot\"><b>Screenshot 2<\/b> – Fleet card menu – Open, Edit, Delete<\/div><\/li><li>Choose <strong>Edit<\/strong> to change the fleet, or <strong>Delete<\/strong>.<\/li><li>For delete, read the <strong>Delete fleet?<\/strong> window and click <strong>Delete fleet<\/strong> (or cancel). A \"Fleet deleted successfully\" message appears.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<p>Deleting a fleet removes its definition and vessel list, stops its notifications and alerts, and removes its analytics and event history. The vessels themselves are not affected. <strong>This can't be undone.<\/strong><\/p>", "x": " > Available only if fleet management is enabled for your account (you will see a Fleets tab). Open a fleet In the Library, click the Fleets tab. 📷 Screenshot 1: Fleets tab – fleet cards with vessel counts Click a fleet card. Create a fleet Click Add → Fleet (under Create new ), or click + Add items on an empty Fleets tab. Edit or delete a fleet Hover over a fleet card and click the ⋮ (More actions) button at the top right. 📷 Screenshot 2: Fleet card menu – Open, Edit, Delete Choose Edit to change the fleet, or Delete . For delete, read the Delete fleet? window and click Delete fleet (or cancel). A \"Fleet deleted successfully\" message appears. Good to know Deleting a fleet removes its definition and vessel list, stops its notifications and alerts, and removes its analytics and event history. The vessels themselves are not affected. This can't be undone. "}, "08-Fleets/02-how-to-create-a-fleet": {"t": "How to create a fleet", "j": "08-Fleets", "h": "<p>Create a named group of vessels so you can monitor them together.<\/p>\n<p>&gt; Available only if fleet management is enabled for your account. If you don't have it, you won't see the <strong>Fleets<\/strong> tab or the <strong>Fleet<\/strong> option.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>You need the IMO numbers or names of the vessels you want to add.<\/li><li>A fleet needs a name (at least 3 characters) and at least one vessel.<\/li><li>A fleet can hold up to <strong>1,000 vessels<\/strong>. This limit is the same for every account.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the Library, click <strong>Add<\/strong>, then under <strong>Create new<\/strong> click <strong>Fleet<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Add menu with Fleet under Create new<\/div><\/li><li>On the <strong>New Fleet<\/strong> page, type a name in <strong>Name<\/strong> (up to 100 characters).<\/li><li>Optional: type a note in <strong>Description (optional)<\/strong> (up to 200 characters).<div class=\"shot\"><b>Screenshot 2<\/b> – Details card with Name and Description<\/div><\/li><li>In <strong>Add Vessels<\/strong>, stay on the <strong>Search<\/strong> tab and type a vessel name or IMO number in <strong>Search vessel name or IMO...<\/strong>. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> Search starts after you type at least 3 characters.<\/li><li>Click a vessel in the results to add it. Vessels already added show a tick and can't be clicked again.<div class=\"shot\"><b>Screenshot 3<\/b> – Search results with an added vessel ticked<\/div><\/li><li>To add many vessels at once, click the <strong>Bulk Import<\/strong> tab.<\/li><li>Either paste IMO numbers into <strong>Paste IMO numbers<\/strong> (comma or space separated) and click <strong>Add<\/strong>, or upload a file in <strong>Upload CSV<\/strong> and click <strong>Upload<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Bulk Import tab with paste and upload options<\/div><\/li><li>Check the <strong>Vessels<\/strong> panel on the right. It lists every vessel added and a count such as 12 / 1,000.<div class=\"shot\"><b>Screenshot 5<\/b> – Vessels preview panel with count<\/div><\/li><li>Click <strong>Save Changes<\/strong>.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>A \"Fleet \"name\" created successfully\" message appears and the new fleet opens.<\/p>\n<h2>Good to know<\/h2>\n<ul><li><strong>Upload a CSV:<\/strong> click <strong>Download template<\/strong> for the format. The file must be a .csv with one IMO per row. Drag and drop works too; click the X next to the file name to remove it. You can use paste or upload, not both at once.<\/li><li><strong>IMOs that can't be added:<\/strong> a yellow panel shows \"N IMOs couldn't be added\" with counts of \"not found\" and \"invalid format\". Click it to see each IMO and the reason, and use the X or <strong>Dismiss all<\/strong> to clear them. The reasons come from the system. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li><strong>Remove vessels:<\/strong> click the X beside a vessel in the <strong>Vessels<\/strong> panel, or open the panel's vessel actions menu and click <strong>Clear fleet<\/strong> to remove all of them.<\/li><li><strong>Near the limit:<\/strong> the count turns yellow at 90% of the limit and red above it, with a message \"Remove N vessel(s) to save\".<\/li><li><strong>Leaving without saving:<\/strong> click <strong>Cancel<\/strong>. If you've entered anything, <strong>Discard changes?<\/strong> asks you to confirm with <strong>Discard changes<\/strong>, or click <strong>Keep editing<\/strong>.<\/li><li>Fleets you create here are static: they contain exactly the vessels you add.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>Save Changes<\/strong> is greyed out<\/td><td>Read the message beside it and fix that item.<\/td><\/tr><tr><td>\"Add a name and at least one vessel\"<\/td><td>Enter a name and add a vessel.<\/td><\/tr><tr><td>\"Add a name\" / \"Name is required\"<\/td><td>Type a fleet name.<\/td><\/tr><tr><td>\"Name must be at least 3 characters\"<\/td><td>Use a longer name.<\/td><\/tr><tr><td>\"A fleet with this name already exists\"<\/td><td>Choose a name not used by another of your fleets (capitals are ignored).<\/td><\/tr><tr><td>\"Add at least one vessel\"<\/td><td>Add a vessel by search or bulk import.<\/td><\/tr><tr><td>\"Remove N vessels to save — limit is 1000\"<\/td><td>Remove vessels in the <strong>Vessels<\/strong> panel.<\/td><\/tr><tr><td>\"No results found for ...\"<\/td><td>Check the spelling or try the IMO number.<\/td><\/tr><tr><td>\"N IMOs couldn't be added\"<\/td><td>Open the panel, correct the IMOs and add them again.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Create a named group of vessels so you can monitor them together. > Available only if fleet management is enabled for your account. If you don't have it, you won't see the Fleets tab or the Fleet option. Before you begin You need the IMO numbers or names of the vessels you want to add. A fleet needs a name (at least 3 characters) and at least one vessel. A fleet can hold up to 1,000 vessels . This limit is the same for every account. Steps In the Library, click Add , then under Create new click Fleet . 📷 Screenshot 1: Add menu with Fleet under Create new On the New Fleet page, type a name in Name (up to 100 characters). Optional: type a note in Description (optional) (up to 200 characters). 📷 Screenshot 2: Details card with Name and Description In Add Vessels , stay on the Search tab and type a vessel name or IMO number in Search vessel name or IMO... . [CONFIRM] Search starts after you type at least 3 characters. Click a vessel in the results to add it. Vessels already added show a tick and can't be clicked again. 📷 Screenshot 3: Search results with an added vessel ticked To add many vessels at once, click the Bulk Import tab. Either paste IMO numbers into Paste IMO numbers (comma or space separated) and click Add , or upload a file in Upload CSV and click Upload . 📷 Screenshot 4: Bulk Import tab with paste and upload options Check the Vessels panel on the right. It lists every vessel added and a count such as 12 / 1,000. 📷 Screenshot 5: Vessels preview panel with count Click Save Changes . Expected result A \"Fleet \"name\" created successfully\" message appears and the new fleet opens. Good to know Upload a CSV: click Download template for the format. The file must be a .csv with one IMO per row. Drag and drop works too; click the X next to the file name to remove it. You can use paste or upload, not both at once. IMOs that can't be added: a yellow panel shows \"N IMOs couldn't be added\" with counts of \"not found\" and \"invalid format\". Click it to see each IMO and the reason, and use the X or Dismiss all to clear them. The reasons come from the system. [CONFIRM] Remove vessels: click the X beside a vessel in the Vessels panel, or open the panel's vessel actions menu and click Clear fleet to remove all of them. Near the limit: the count turns yellow at 90% of the limit and red above it, with a message \"Remove N vessel(s) to save\". Leaving without saving: click Cancel . If you've entered anything, Discard changes? asks you to confirm with Discard changes , or click Keep editing . Fleets you create here are static: they contain exactly the vessels you add. Troubleshooting Problem What to do Save Changes is greyed out Read the message beside it and fix that item. \"Add a name and at least one vessel\" Enter a name and add a vessel. \"Add a name\" / \"Name is required\" Type a fleet name. \"Name must be at least 3 characters\" Use a longer name. \"A fleet with this name already exists\" Choose a name not used by another of your fleets (capitals are ignored). \"Add at least one vessel\" Add a vessel by search or bulk import. \"Remove N vessels to save — limit is 1000\" Remove vessels in the Vessels panel. \"No results found for ...\" Check the spelling or try the IMO number. \"N IMOs couldn't be added\" Open the panel, correct the IMOs and add them again. "}, "08-Fleets/03-how-to-open-and-read-a-fleet-page": {"t": "How to open and read a fleet page", "j": "08-Fleets", "h": "<p>Open a fleet from your Library to see its vessels on a map or list, its composition and its recent events.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Fleet management must be switched on for your account or user. If it is not, the <strong>Fleets<\/strong> tab and fleet pages are not shown to you.<\/li><li>You need at least one fleet. To create or change a fleet, see the separate fleet articles.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Library<\/strong> from the main navigation.<\/li><li>Select the <strong>Fleets<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Library page with the Fleets tab selected, showing fleet cards<\/div><\/li><li>Select the card of the fleet you want. Each card shows the fleet name, the number of vessels (\"1 vessel\" or \"N vessels\") and the description, if there is one.<\/li><li>The fleet page opens on the <strong>Overview<\/strong> tab.<div class=\"shot\"><b>Screenshot 2<\/b> – Fleet page header, tabs and Overview map<\/div><\/li><li>Check the header. It shows the fleet name and, below it, the vessel count.<\/li><li>Use the breadcrumbs <strong>Library<\/strong> &gt; <strong>Fleets<\/strong> above the name to go back to your fleets.<\/li><li>Select a tab: <strong>Overview<\/strong>, <strong>Composition<\/strong> or <strong>Events<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – The three fleet tabs<\/div><\/li><li>On <strong>Overview<\/strong>, switch between the map and the vessel table with the two icons at the top right (tooltips <strong>Map view<\/strong> and <strong>List view<\/strong>). The map is shown first.<\/li><li>On <strong>Composition<\/strong>, read the summary cards and charts that break down the fleet. See \"How to read fleet composition\".<\/li><li>On <strong>Events<\/strong>, read the table of recent events for the fleet's vessels. See \"How to view fleet events\".<\/li><li>To narrow the vessels on <strong>Overview<\/strong>, use <strong>Vessel Flag<\/strong>, <strong>Vessel Type<\/strong> and <strong>Vessel Class<\/strong>. If your account includes the MTI score, <strong>MTI Score<\/strong> also appears.<\/li><li>To clear your choices, select <strong>Reset Filters<\/strong>. It is greyed out until a filter is changed.<div class=\"shot\"><b>Screenshot 4<\/b> – Overview filter row with Reset Filters<\/div><\/li><li>To reload the vessel data, select <strong>Refresh<\/strong> next to \"Updated ... ago\".<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You see the fleet's name and vessel count, and can move between the Overview, Composition and Events tabs.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The tab you are on is kept in the page address (for example <code>?tab=composition<\/code>), so the browser Back button returns you to the previous tab.<\/li><li>Filters on <strong>Overview<\/strong> and <strong>Composition<\/strong> are separate. Changing one does not change the other.<\/li><li>The <strong>Overview<\/strong> data reloads by itself every 5 minutes. <strong>Updated ... ago<\/strong> shows its age. The <strong>Events<\/strong> tab has its own <strong>Refresh<\/strong>.<\/li><li>The fleet page has no date range picker.<\/li><li>The table view in <strong>Overview<\/strong> shows the columns <strong>Vessel<\/strong>, <strong>IMO<\/strong>, <strong>MMSI<\/strong>, <strong>Type<\/strong>, <strong>Class<\/strong>, <strong>Flag<\/strong>, <strong>Nav Status<\/strong>, <strong>MTI Score<\/strong> (only if you have it), <strong>Next Port<\/strong>, <strong>Last Reported<\/strong>, <strong>Speed<\/strong> and <strong>Course<\/strong>. You can sort by any column and search with <strong>Search vessels...<\/strong>. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how each value is sourced.<\/li><li>Above the table, \"Showing X of Y vessels\" tells you how many vessels match, plus the number of filters applied. Its menu offers <strong>Export Data (CSV)<\/strong>. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exact CSV contents and file name (see report note).<\/li><li>The three-dot menu in the header holds the actions to change or delete the fleet. These are covered in separate articles.<\/li><li>Locked scores in the vessel panel (see \"How to view your fleet on the map\") show a lock with an <strong>Unlock<\/strong> prompt. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the \"Contact us\" details shown on click, because the code shows an \"Available on request.\" hover card with a <strong>More about ...<\/strong> link.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>No <strong>Fleets<\/strong> tab in Library<\/td><td>Fleet management is not enabled for you. Ask your account manager. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>A loading placeholder stays on screen<\/td><td>Wait a moment, then reload the page.<\/td><\/tr><tr><td>An error page appears instead of the fleet<\/td><td>Check you opened a fleet you can access, then try again. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exact error text.<\/td><\/tr><tr><td>The table says <strong>No vessels match these filters.<\/strong><\/td><td>Select <strong>Reset filters<\/strong> or adjust the filters.<\/td><\/tr><tr><td>The table says <strong>No data available<\/strong><\/td><td>The fleet has no vessels to show.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Open a fleet from your Library to see its vessels on a map or list, its composition and its recent events. Before you begin Fleet management must be switched on for your account or user. If it is not, the Fleets tab and fleet pages are not shown to you. You need at least one fleet. To create or change a fleet, see the separate fleet articles. Steps Open Library from the main navigation. Select the Fleets tab. 📷 Screenshot 1: Library page with the Fleets tab selected, showing fleet cards Select the card of the fleet you want. Each card shows the fleet name, the number of vessels (\"1 vessel\" or \"N vessels\") and the description, if there is one. The fleet page opens on the Overview tab. 📷 Screenshot 2: Fleet page header, tabs and Overview map Check the header. It shows the fleet name and, below it, the vessel count. Use the breadcrumbs Library > Fleets above the name to go back to your fleets. Select a tab: Overview , Composition or Events . 📷 Screenshot 3: The three fleet tabs On Overview , switch between the map and the vessel table with the two icons at the top right (tooltips Map view and List view ). The map is shown first. On Composition , read the summary cards and charts that break down the fleet. See \"How to read fleet composition\". On Events , read the table of recent events for the fleet's vessels. See \"How to view fleet events\". To narrow the vessels on Overview , use Vessel Flag , Vessel Type and Vessel Class . If your account includes the MTI score, MTI Score also appears. To clear your choices, select Reset Filters . It is greyed out until a filter is changed. 📷 Screenshot 4: Overview filter row with Reset Filters To reload the vessel data, select Refresh next to \"Updated ... ago\". Expected result You see the fleet's name and vessel count, and can move between the Overview, Composition and Events tabs. Good to know The tab you are on is kept in the page address (for example ?tab=composition ), so the browser Back button returns you to the previous tab. Filters on Overview and Composition are separate. Changing one does not change the other. The Overview data reloads by itself every 5 minutes. Updated ... ago shows its age. The Events tab has its own Refresh . The fleet page has no date range picker. The table view in Overview shows the columns Vessel , IMO , MMSI , Type , Class , Flag , Nav Status , MTI Score (only if you have it), Next Port , Last Reported , Speed and Course . You can sort by any column and search with Search vessels... . [CONFIRM] how each value is sourced. Above the table, \"Showing X of Y vessels\" tells you how many vessels match, plus the number of filters applied. Its menu offers Export Data (CSV) . [CONFIRM] exact CSV contents and file name (see report note). The three-dot menu in the header holds the actions to change or delete the fleet. These are covered in separate articles. Locked scores in the vessel panel (see \"How to view your fleet on the map\") show a lock with an Unlock prompt. [CONFIRM] the \"Contact us\" details shown on click, because the code shows an \"Available on request.\" hover card with a More about ... link. Troubleshooting Problem What to do No Fleets tab in Library Fleet management is not enabled for you. Ask your account manager. [CONFIRM] A loading placeholder stays on screen Wait a moment, then reload the page. An error page appears instead of the fleet Check you opened a fleet you can access, then try again. [CONFIRM] exact error text. The table says No vessels match these filters. Select Reset filters or adjust the filters. The table says No data available The fleet has no vessels to show. "}, "08-Fleets/04-how-to-view-your-fleet-on-the-map": {"t": "How to view your fleet on the map", "j": "08-Fleets", "h": "<p>Use the <strong>Overview<\/strong> tab of a fleet page to see where each vessel in the fleet was last reported, and to open a vessel's details.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a fleet page (see \"How to open and read a fleet page\").<\/li><li>The map shows only vessels that have a valid last position. A vessel without one is not drawn but still appears in the list view.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Overview<\/strong> tab. The map is the default view.<div class=\"shot\"><b>Screenshot 1<\/b> – Fleet Overview map with vessel markers and the Legend<\/div><\/li><li>Look at the markers. Each arrow is one vessel. Its colour shows the vessel type and it points in the vessel's heading or course.<\/li><li>Hover over a marker. A card shows <strong>Name<\/strong>, <strong>IMO<\/strong>, <strong>Vessel Type<\/strong>, <strong>Vessel Class<\/strong>, <strong>Flag<\/strong>, <strong>Speed<\/strong>, <strong>Course<\/strong>, <strong>Destination<\/strong>, <strong>ETA<\/strong> and <strong>Last Reported<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Hover card on a vessel marker<\/div><\/li><li>Select <strong>Legend<\/strong> at the top left to open it. It lists the vessel types in your fleet with their colours.<\/li><li>Untick a type in the legend to hide those vessels. Tick it again to show them.<\/li><li>Select the map-style button at the top right (tooltip <strong>Toggle Map Styles<\/strong>) to open <strong>Map Style<\/strong>.<\/li><li>Choose <strong>Simple<\/strong>, <strong>Satellite<\/strong> or <strong>C-MAP<\/strong>. Turn <strong>Grid / Graticules<\/strong> on or off.<div class=\"shot\"><b>Screenshot 3<\/b> – Map Style panel<\/div><\/li><li>Use the <strong>Zoom in<\/strong> and <strong>Zoom out<\/strong> buttons at the bottom right.<\/li><li>Move the pointer over the map to read its position in the box at the bottom left.<\/li><li>Select a vessel marker. A side panel opens with the vessel's details.<div class=\"shot\"><b>Screenshot 4<\/b> – Vessel side panel opened from the map<\/div><\/li><li>Read the rows. See Good to know for what each one means.<\/li><li>Select the vessel name at the top of the panel, or <strong>Full Details<\/strong> at the bottom, to open the full vessel page.<\/li><li>Close the panel with the close button, the <strong>Esc<\/strong> key, or by clicking outside it.<\/li><li>To work with a subset of the fleet, use <strong>Vessel Flag<\/strong>, <strong>Vessel Type<\/strong>, <strong>Vessel Class<\/strong> or (if you have it) <strong>MTI Score<\/strong> above the map. The map updates to match.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The map shows one marker for each filtered vessel with a known position. Selecting a marker opens that vessel's panel.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Panel rows: <strong>Type<\/strong>, <strong>Class<\/strong>, <strong>MMSI<\/strong>, <strong>Callsign<\/strong>, <strong>Flag<\/strong>, <strong>Build year<\/strong>, <strong>Age<\/strong>, <strong>DWT<\/strong>, <strong>Registry status<\/strong>, <strong>PurpleTRAC screening<\/strong>, <strong>MTI score<\/strong>, then <strong>Latest position<\/strong> (a small map) with <strong>Nav Status<\/strong>, <strong>Coordinates<\/strong>, <strong>Speed<\/strong>, <strong>Course<\/strong>, <strong>Destination<\/strong>, <strong>ETA<\/strong> (UTC), <strong>Last reported<\/strong> and <strong>Source<\/strong>. A dash (-) means no value.<\/li><li><strong>PurpleTRAC screening<\/strong> and <strong>MTI score<\/strong> need the matching access. Without it you see a lock with <strong>Unlock<\/strong>. Hover to read what it offers. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the \"Contact us\" step that opens on click: in the code this is an \"Available on request.\" card with a <strong>More about PurpleTRAC<\/strong> or <strong>More about MTI<\/strong> link.<\/li><li>Marker colours come from the vessel type. Types without a set colour use a default. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the full colour list.<\/li><li>If the Ask IQ feature is enabled for you, an <strong>Ask IQ<\/strong> button appears in the vessel panel. Users without it see nothing.<\/li><li>The legend currently offers a <strong>Type<\/strong> view only. The legend by flag is switched off in the code.<\/li><li>Event markers do not appear on this map. They appear on the small map inside a fleet event's side panel. See \"How to view fleet events\".<\/li><li>Hiding a type in the legend does not change the filters or the vessel count.<\/li><li>Use <strong>Refresh<\/strong> to reload positions; data also reloads every 5 minutes.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>The map is blank or shows a notice about a missing token<\/td><td>The map service is not configured. Contact support. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>A vessel is missing from the map<\/td><td>It may have no valid position, or its type is unticked in the <strong>Legend<\/strong>. Check <strong>List view<\/strong>.<\/td><\/tr><tr><td>No markers after filtering<\/td><td>Select <strong>Reset Filters<\/strong>.<\/td><\/tr><tr><td>The panel does not open<\/td><td>Click the marker itself, not the hover card.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Overview tab of a fleet page to see where each vessel in the fleet was last reported, and to open a vessel's details. Before you begin Open a fleet page (see \"How to open and read a fleet page\"). The map shows only vessels that have a valid last position. A vessel without one is not drawn but still appears in the list view. Steps Select the Overview tab. The map is the default view. 📷 Screenshot 1: Fleet Overview map with vessel markers and the Legend Look at the markers. Each arrow is one vessel. Its colour shows the vessel type and it points in the vessel's heading or course. Hover over a marker. A card shows Name , IMO , Vessel Type , Vessel Class , Flag , Speed , Course , Destination , ETA and Last Reported . 📷 Screenshot 2: Hover card on a vessel marker Select Legend at the top left to open it. It lists the vessel types in your fleet with their colours. Untick a type in the legend to hide those vessels. Tick it again to show them. Select the map-style button at the top right (tooltip Toggle Map Styles ) to open Map Style . Choose Simple , Satellite or C-MAP . Turn Grid / Graticules on or off. 📷 Screenshot 3: Map Style panel Use the Zoom in and Zoom out buttons at the bottom right. Move the pointer over the map to read its position in the box at the bottom left. Select a vessel marker. A side panel opens with the vessel's details. 📷 Screenshot 4: Vessel side panel opened from the map Read the rows. See Good to know for what each one means. Select the vessel name at the top of the panel, or Full Details at the bottom, to open the full vessel page. Close the panel with the close button, the Esc key, or by clicking outside it. To work with a subset of the fleet, use Vessel Flag , Vessel Type , Vessel Class or (if you have it) MTI Score above the map. The map updates to match. Expected result The map shows one marker for each filtered vessel with a known position. Selecting a marker opens that vessel's panel. Good to know Panel rows: Type , Class , MMSI , Callsign , Flag , Build year , Age , DWT , Registry status , PurpleTRAC screening , MTI score , then Latest position (a small map) with Nav Status , Coordinates , Speed , Course , Destination , ETA (UTC), Last reported and Source . A dash (-) means no value. PurpleTRAC screening and MTI score need the matching access. Without it you see a lock with Unlock . Hover to read what it offers. [CONFIRM] the \"Contact us\" step that opens on click: in the code this is an \"Available on request.\" card with a More about PurpleTRAC or More about MTI link. Marker colours come from the vessel type. Types without a set colour use a default. [CONFIRM] the full colour list. If the Ask IQ feature is enabled for you, an Ask IQ button appears in the vessel panel. Users without it see nothing. The legend currently offers a Type view only. The legend by flag is switched off in the code. Event markers do not appear on this map. They appear on the small map inside a fleet event's side panel. See \"How to view fleet events\". Hiding a type in the legend does not change the filters or the vessel count. Use Refresh to reload positions; data also reloads every 5 minutes. Troubleshooting Problem What to do The map is blank or shows a notice about a missing token The map service is not configured. Contact support. [CONFIRM] A vessel is missing from the map It may have no valid position, or its type is unticked in the Legend . Check List view . No markers after filtering Select Reset Filters . The panel does not open Click the marker itself, not the hover card. "}, "08-Fleets/05-how-to-read-fleet-composition": {"t": "How to read fleet composition", "j": "08-Fleets", "h": "<p>Use the <strong>Composition<\/strong> tab to see how your fleet breaks down by vessel type, flag, build, size and more.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a fleet page and select <strong>Composition<\/strong>.<\/li><li>Charts rebuild when you change filters, after a short delay of about one second.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Composition<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Composition tab with summary cards and charts<\/div><\/li><li>Read the four cards at the top: <strong>Vessels<\/strong>, <strong>Average age<\/strong>, <strong>Total DWT<\/strong> and <strong>Flag states<\/strong>.<\/li><li>Read <strong>Vessels<\/strong> as \"X of Y\". X is the vessels matching your filters. Y is the fleet total.<\/li><li>Narrow the data with <strong>Vessel Flag<\/strong>, <strong>Vessel Type<\/strong> and <strong>Vessel Class<\/strong>. Use the search box inside <strong>Vessel Type<\/strong> and <strong>Vessel Class<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Composition filter row<\/div><\/li><li>To clear your choices, select <strong>Reset Filters<\/strong>.<\/li><li>Scroll through the chart groups: <strong>Type and class<\/strong>, <strong>Registration and flag<\/strong>, <strong>Build and origin<\/strong>, <strong>Size and dimensions<\/strong>.<\/li><li>In <strong>Type and class<\/strong>, read <strong>Vessel type<\/strong> (a ring chart, \"Share of fleet\") and <strong>Class<\/strong> (bars, \"Size band, coloured by vessel type\").<\/li><li>In <strong>Registration and flag<\/strong>, read <strong>Flag<\/strong> and <strong>Port of registry<\/strong>. They show the \"Top 5 by vessel count\".<\/li><li>To see every value, select <strong>Show all (N)<\/strong>. Select <strong>Show top 5<\/strong> to go back.<div class=\"shot\"><b>Screenshot 3<\/b> – Flag chart switched to Show all<\/div><\/li><li>In <strong>Build and origin<\/strong>, read <strong>Country of build<\/strong>, <strong>Builder<\/strong> and <strong>Age profile<\/strong>.<\/li><li>In <strong>Size and dimensions<\/strong>, read <strong>Size<\/strong> and <strong>Dimensions<\/strong>.<\/li><li>Switch <strong>Size<\/strong> between <strong>DWT<\/strong> and <strong>GT<\/strong> (it opens on <strong>GT<\/strong>). Switch <strong>Dimensions<\/strong> between <strong>LOA<\/strong>, <strong>Beam<\/strong> and <strong>Draught<\/strong> (it opens on <strong>Draught<\/strong>).<\/li><li>Hover over a bar or ring segment. The tooltip shows the label, <strong>Vessels<\/strong> and <strong>Share<\/strong> (for example \"12% of 40\").<div class=\"shot\"><b>Screenshot 4<\/b> – Chart tooltip<\/div><\/li><li>To save a chart, open its menu at the top right of the card and choose <strong>Export Data (CSV)<\/strong> or <strong>Export Image (PNG)<\/strong>.<\/li><li>To see which vessels are behind the numbers, select <strong>View vessels (N)<\/strong> or the <strong>Vessels<\/strong> card.<\/li><li>In the <strong>Vessels (X of Y)<\/strong> panel, type in <strong>Search name, IMO, type, class…<\/strong> and use <strong>Sort<\/strong> (<strong>Name<\/strong> or <strong>IMO<\/strong>).<\/li><li>Select a vessel to see its details. Use the back arrow to return, or <strong>Full Details<\/strong> to open its vessel page.<div class=\"shot\"><b>Screenshot 5<\/b> – Vessels side panel<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The cards and charts describe the vessels that match your filters, and every chart can be exported.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Bar labels show the number of vessels. The tooltip adds the share of the filtered total.<\/li><li>Grey bars are labelled \"unknown\", or values outside your current flag or class selection. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exactly when grey is used.<\/li><li><strong>Total DWT<\/strong> and the <strong>Size<\/strong> (DWT) and <strong>Dimensions<\/strong> charts may show \"Based on X of Y vessels\". The info icon explains that only some vessels have adequate data. If none do, you see \"No DWT data available\" (or the matching measure).<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how <strong>Average age<\/strong>, <strong>Total DWT<\/strong>, the size bands in <strong>Class<\/strong> and <strong>Age profile<\/strong>, and the <strong>Share<\/strong> percentages are calculated, and which units <strong>Dimensions<\/strong> uses.<\/li><li>The CSV has three columns: the chart name, <strong>Vessels<\/strong> and <strong>Percentage<\/strong>. The file is named after the fleet and chart.<\/li><li>There is no <strong>MTI Score<\/strong> filter on this tab.<\/li><li>If you untick every value in a filter, the page shows no data. A planned <strong>Export<\/strong> button for the whole tab is switched off in the code.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A chart shows <strong>No data available<\/strong><\/td><td>Select <strong>Reset Filters<\/strong> or refresh the page.<\/td><\/tr><tr><td><strong>View vessels<\/strong> is greyed out<\/td><td>No vessels match the filters. Reset them.<\/td><\/tr><tr><td><strong>Show all<\/strong> is greyed out<\/td><td>The chart has five or fewer values.<\/td><\/tr><tr><td><strong>Export Image (PNG)<\/strong> does nothing in <strong>Show all<\/strong> view<\/td><td>Switch back to <strong>Show top 5<\/strong> and export again. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>Numbers do not match <strong>Overview<\/strong><\/td><td>Each tab has its own filters. Check both.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Composition tab to see how your fleet breaks down by vessel type, flag, build, size and more. Before you begin Open a fleet page and select Composition . Charts rebuild when you change filters, after a short delay of about one second. Steps Select the Composition tab. 📷 Screenshot 1: Composition tab with summary cards and charts Read the four cards at the top: Vessels , Average age , Total DWT and Flag states . Read Vessels as \"X of Y\". X is the vessels matching your filters. Y is the fleet total. Narrow the data with Vessel Flag , Vessel Type and Vessel Class . Use the search box inside Vessel Type and Vessel Class . 📷 Screenshot 2: Composition filter row To clear your choices, select Reset Filters . Scroll through the chart groups: Type and class , Registration and flag , Build and origin , Size and dimensions . In Type and class , read Vessel type (a ring chart, \"Share of fleet\") and Class (bars, \"Size band, coloured by vessel type\"). In Registration and flag , read Flag and Port of registry . They show the \"Top 5 by vessel count\". To see every value, select Show all (N) . Select Show top 5 to go back. 📷 Screenshot 3: Flag chart switched to Show all In Build and origin , read Country of build , Builder and Age profile . In Size and dimensions , read Size and Dimensions . Switch Size between DWT and GT (it opens on GT ). Switch Dimensions between LOA , Beam and Draught (it opens on Draught ). Hover over a bar or ring segment. The tooltip shows the label, Vessels and Share (for example \"12% of 40\"). 📷 Screenshot 4: Chart tooltip To save a chart, open its menu at the top right of the card and choose Export Data (CSV) or Export Image (PNG) . To see which vessels are behind the numbers, select View vessels (N) or the Vessels card. In the Vessels (X of Y) panel, type in Search name, IMO, type, class… and use Sort ( Name or IMO ). Select a vessel to see its details. Use the back arrow to return, or Full Details to open its vessel page. 📷 Screenshot 5: Vessels side panel Expected result The cards and charts describe the vessels that match your filters, and every chart can be exported. Good to know Bar labels show the number of vessels. The tooltip adds the share of the filtered total. Grey bars are labelled \"unknown\", or values outside your current flag or class selection. [CONFIRM] exactly when grey is used. Total DWT and the Size (DWT) and Dimensions charts may show \"Based on X of Y vessels\". The info icon explains that only some vessels have adequate data. If none do, you see \"No DWT data available\" (or the matching measure). [CONFIRM] how Average age , Total DWT , the size bands in Class and Age profile , and the Share percentages are calculated, and which units Dimensions uses. The CSV has three columns: the chart name, Vessels and Percentage . The file is named after the fleet and chart. There is no MTI Score filter on this tab. If you untick every value in a filter, the page shows no data. A planned Export button for the whole tab is switched off in the code. Troubleshooting Problem What to do A chart shows No data available Select Reset Filters or refresh the page. View vessels is greyed out No vessels match the filters. Reset them. Show all is greyed out The chart has five or fewer values. Export Image (PNG) does nothing in Show all view Switch back to Show top 5 and export again. [CONFIRM] Numbers do not match Overview Each tab has its own filters. Check both. "}, "08-Fleets/06-how-to-view-fleet-events": {"t": "How to view fleet events", "j": "08-Fleets", "h": "<p>Use the <strong>Events<\/strong> tab to see recent port, zone and other events for every vessel in a fleet, open the detail of any event, and export a longer history.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a fleet page and select <strong>Events<\/strong>.<\/li><li>The table always covers the last 90 days and has no date picker. Use <strong>Export<\/strong> for other periods.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Events<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Fleet Events tab with table<\/div><\/li><li>Wait for the table to load. A spinner shows while data loads.<\/li><li>Select <strong>Event Type<\/strong> to choose what to see.<\/li><li>Tick the types you want. They are grouped as <strong>Port Events<\/strong> (<strong>Area Arrival<\/strong>, <strong>Arrival<\/strong>, <strong>Departure<\/strong>, <strong>Area Departure<\/strong>), <strong>Zone Events<\/strong> (<strong>Zone Entry<\/strong>, <strong>Zone Exit<\/strong>) and <strong>Other Events<\/strong> (<strong>AIS Gap<\/strong>, <strong>STS Pairing<\/strong>, <strong>Positional Discrepancy<\/strong>, <strong>Port State Control<\/strong>). All are ticked at first.<div class=\"shot\"><b>Screenshot 2<\/b> – Event Type dropdown<\/div><\/li><li>Type in <strong>Search...<\/strong> to narrow the rows. It matches any value, including the dates as you see them.<\/li><li>Select a column heading to sort. Select it again to reverse the order.<\/li><li>Open the column panel on the side of th

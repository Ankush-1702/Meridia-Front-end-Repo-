e table to add or hide columns. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> where it appears on screen.<\/li><li>To restore the standard columns, select <strong>Reset columns<\/strong>.<\/li><li>Select a row to open the <strong>Event Details<\/strong> side panel.<div class=\"shot\"><b>Screenshot 3<\/b> – Event Details side panel<\/div><\/li><li>In the panel, read <strong>Vessels<\/strong>, <strong>Location<\/strong> and <strong>Details<\/strong>. Select a vessel or location card to see more. Use the back arrow to return.<\/li><li>Select <strong>Full Details<\/strong> inside a vessel or location view to open that vessel, port or zone page.<\/li><li>Close the panel with the close button, <strong>Esc<\/strong>, or by clicking outside it.<\/li><li>To reload, select <strong>Refresh<\/strong> next to \"Updated ... ago\".<\/li><li>To get a file, select <strong>Export<\/strong>.<\/li><li>In <strong>Export<\/strong>, choose <strong>Event type<\/strong> and <strong>Date range<\/strong> (<strong>Today<\/strong>, <strong>Yesterday<\/strong>, <strong>Last 7 Days<\/strong>, <strong>Last 30 Days<\/strong>, <strong>Last 90 Days<\/strong> or <strong>Custom<\/strong> with <strong>From<\/strong> and <strong>To<\/strong>).<\/li><li>Select <strong>Request export<\/strong>. When ready it appears in <strong>Notifications<\/strong> &gt; <strong>Downloads<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Export window<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists the matching events, and the text beside the search box says, for example, \"Showing most recent 120 events\".<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Standard columns:<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TimeStamp (UTC) or (System)<\/td><td>When the event happened, in UTC or your system time zone.<\/td><\/tr><tr><td>Vessel<\/td><td>Vessel name with flag.<\/td><\/tr><tr><td>IMO<\/td><td>The vessel's IMO number.<\/td><\/tr><tr><td>Event<\/td><td>The event type.<\/td><\/tr><tr><td>Location<\/td><td>The port or zone linked to the event.<\/td><\/tr><tr><td>Country<\/td><td>Country of that location.<\/td><\/tr><tr><td>UN/LOCODE<\/td><td>The location's UN/LOCODE, where it has one.<\/td><\/tr><tr><td>Location Type<\/td><td>Kind of location. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> values.<\/td><\/tr><tr><td>Speed<\/td><td>Vessel speed in knots.<\/td><\/tr><tr><td>Course<\/td><td>Vessel course in degrees.<\/td><\/tr><tr><td>Duration (hours)<\/td><td>How long the event lasted, where that applies.<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Optional columns come in groups: <strong>Vessel identity<\/strong> (<strong>MMSI<\/strong>, <strong>Call Sign<\/strong>, <strong>Flag<\/strong>, <strong>Type<\/strong>), <strong>Position &amp; movement<\/strong> (<strong>Heading<\/strong>, <strong>Draught<\/strong>, <strong>Navigational Status<\/strong>, <strong>Reported Destination<\/strong>, <strong>Reported ETA<\/strong>), <strong>Port State Control<\/strong> (<strong>Authority<\/strong>, <strong>Inspection Type<\/strong>, <strong>Inspection Date<\/strong>, <strong>Detained<\/strong>, <strong>Days Detained<\/strong>, <strong>No. Defects<\/strong>, <strong>Release Date<\/strong>), <strong>STS pairing<\/strong> (<strong>STS Type<\/strong>, <strong>Paired Vessel<\/strong>, <strong>Paired IMO<\/strong>, <strong>STS Ended<\/strong>), <strong>AIS gap<\/strong> (<strong>Gap Stopped<\/strong>, <strong>Gap Resumed<\/strong>, <strong>Draught Change<\/strong>) and <strong>Positional discrepancy<\/strong> (<strong>Has Ended<\/strong>, <strong>Started Latitude<\/strong>, <strong>Started Longitude<\/strong>, <strong>Stopped Timestamp<\/strong>, <strong>Stopped Latitude<\/strong>, <strong>Stopped Longitude<\/strong>).<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the exact definitions of AIS Gap, STS Pairing, Positional Discrepancy and Area Arrival/Departure events.<\/li><li>A dash (-) means no value. A tooltip beside the table says not every column applies to every event type.<\/li><li>The table shows at most the 500 most recent events, 100 per page. Export timestamps are in UTC.<\/li><li>In the panel, <strong>Vessels<\/strong> appears only for vessels found in the fleet. STS pairings show <strong>Primary vessel<\/strong> and <strong>Paired vessel<\/strong>. The <strong>Location<\/strong> section has a small map. Port State Control events have no map.<\/li><li>On that map, STS pairings show a pairing marker. AIS gaps show a start and end marker joined by a dashed red line. Positional discrepancies show start and end markers joined by a dashed yellow line. Port and zone events show the vessel at the event position, the location pin and, for zones, the boundary.<\/li><li>Location view shows <strong>Last 24 hours<\/strong>: <strong>Arrivals<\/strong>/<strong>Entries<\/strong>, <strong>In port<\/strong>/<strong>In zone<\/strong>, <strong>Departures<\/strong>/<strong>Exits<\/strong>.<\/li><li>Data reloads every 5 minutes.<\/li><li>There are no notification settings on the fleet page. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> whether fleet alerts exist elsewhere.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>No data available<\/strong><\/td><td>Tick more event types, clear <strong>Search...<\/strong>, or check later.<\/td><\/tr><tr><td><strong>Refresh<\/strong> is greyed out<\/td><td>A refresh is already running.<\/td><\/tr><tr><td>I need data older than 90 days<\/td><td>Use <strong>Export<\/strong> with a longer <strong>Date range<\/strong>.<\/td><\/tr><tr><td><strong>Request export<\/strong> is greyed out<\/td><td>Pick at least one event type and a valid date range.<\/td><\/tr><tr><td>A vessel card is missing in the panel<\/td><td>The vessel is not in the fleet's loaded list. Reload.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Events tab to see recent port, zone and other events for every vessel in a fleet, open the detail of any event, and export a longer history. Before you begin Open a fleet page and select Events . The table always covers the last 90 days and has no date picker. Use Export for other periods. Steps Select the Events tab. 📷 Screenshot 1: Fleet Events tab with table Wait for the table to load. A spinner shows while data loads. Select Event Type to choose what to see. Tick the types you want. They are grouped as Port Events ( Area Arrival , Arrival , Departure , Area Departure ), Zone Events ( Zone Entry , Zone Exit ) and Other Events ( AIS Gap , STS Pairing , Positional Discrepancy , Port State Control ). All are ticked at first. 📷 Screenshot 2: Event Type dropdown Type in Search... to narrow the rows. It matches any value, including the dates as you see them. Select a column heading to sort. Select it again to reverse the order. Open the column panel on the side of the table to add or hide columns. [CONFIRM] where it appears on screen. To restore the standard columns, select Reset columns . Select a row to open the Event Details side panel. 📷 Screenshot 3: Event Details side panel In the panel, read Vessels , Location and Details . Select a vessel or location card to see more. Use the back arrow to return. Select Full Details inside a vessel or location view to open that vessel, port or zone page. Close the panel with the close button, Esc , or by clicking outside it. To reload, select Refresh next to \"Updated ... ago\". To get a file, select Export . In Export , choose Event type and Date range ( Today , Yesterday , Last 7 Days , Last 30 Days , Last 90 Days or Custom with From and To ). Select Request export . When ready it appears in Notifications > Downloads . 📷 Screenshot 4: Export window Expected result The table lists the matching events, and the text beside the search box says, for example, \"Showing most recent 120 events\". Good to know Standard columns: Column Meaning TimeStamp (UTC) or (System) When the event happened, in UTC or your system time zone. Vessel Vessel name with flag. IMO The vessel's IMO number. Event The event type. Location The port or zone linked to the event. Country Country of that location. UN/LOCODE The location's UN/LOCODE, where it has one. Location Type Kind of location. [CONFIRM] values. Speed Vessel speed in knots. Course Vessel course in degrees. Duration (hours) How long the event lasted, where that applies. Optional columns come in groups: Vessel identity ( MMSI , Call Sign , Flag , Type ), Position & movement ( Heading , Draught , Navigational Status , Reported Destination , Reported ETA ), Port State Control ( Authority , Inspection Type , Inspection Date , Detained , Days Detained , No. Defects , Release Date ), STS pairing ( STS Type , Paired Vessel , Paired IMO , STS Ended ), AIS gap ( Gap Stopped , Gap Resumed , Draught Change ) and Positional discrepancy ( Has Ended , Started Latitude , Started Longitude , Stopped Timestamp , Stopped Latitude , Stopped Longitude ). [CONFIRM] the exact definitions of AIS Gap, STS Pairing, Positional Discrepancy and Area Arrival/Departure events. A dash (-) means no value. A tooltip beside the table says not every column applies to every event type. The table shows at most the 500 most recent events, 100 per page. Export timestamps are in UTC. In the panel, Vessels appears only for vessels found in the fleet. STS pairings show Primary vessel and Paired vessel . The Location section has a small map. Port State Control events have no map. On that map, STS pairings show a pairing marker. AIS gaps show a start and end marker joined by a dashed red line. Positional discrepancies show start and end markers joined by a dashed yellow line. Port and zone events show the vessel at the event position, the location pin and, for zones, the boundary. Location view shows Last 24 hours : Arrivals / Entries , In port / In zone , Departures / Exits . Data reloads every 5 minutes. There are no notification settings on the fleet page. [CONFIRM] whether fleet alerts exist elsewhere. Troubleshooting Problem What to do No data available Tick more event types, clear Search... , or check later. Refresh is greyed out A refresh is already running. I need data older than 90 days Use Export with a longer Date range . Request export is greyed out Pick at least one event type and a valid date range. A vessel card is missing in the panel The vessel is not in the fleet's loaded list. Reload. "}, "08-Fleets/07-how-to-edit-or-delete-a-fleet": {"t": "How to edit or delete a fleet", "j": "08-Fleets", "h": "<p>Change a fleet's name, description or vessels, or delete it, from the Library or the fleet page.<\/p>\n<p>&gt; Available only if fleet management is enabled for your account.<\/p>\n<h2>Steps: edit or rename<\/h2>\n<ol><li>In the Library, click the <strong>Fleets<\/strong> tab.<\/li><li>Hover over a fleet card and click the <strong>More actions<\/strong> button at the top right.<div class=\"shot\"><b>Screenshot 1<\/b> – Fleet card menu with Open, Edit and Delete<\/div><\/li><li>Click <strong>Edit<\/strong>. (From a fleet page, click the menu beside the fleet name and click <strong>Edit<\/strong>.)<div class=\"shot\"><b>Screenshot 2<\/b> – Fleet page menu with Edit and Delete<\/div><\/li><li>On the <strong>Edit<\/strong> page, change <strong>Name<\/strong> or <strong>Description (optional)<\/strong> to rename the fleet or update its note.<\/li><li>To add vessels, use <strong>Search vessel name or IMO...<\/strong> or the <strong>Bulk Import<\/strong> tab, as when you create a fleet.<\/li><li>To remove vessels, click the X beside a vessel in the <strong>Vessels<\/strong> panel, or use <strong>Clear fleet<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Edit page with the Vessels panel<\/div><\/li><li>Click <strong>Save Changes<\/strong>.<\/li><\/ol>\n<h2>Steps: delete<\/h2>\n<ol><li>Open the fleet's menu as above (Library card or fleet page) and click <strong>Delete<\/strong>.<\/li><li>In <strong>Delete fleet?<\/strong>, read what will be removed.<div class=\"shot\"><b>Screenshot 4<\/b> – Delete fleet? confirmation<\/div><\/li><li>Click <strong>Delete fleet<\/strong> to confirm.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<ul><li>After saving, \"Fleet \"name\" updated successfully\" appears. You return to the fleet page if you came from it, otherwise to the Library <strong>Fleets<\/strong> tab.<\/li><li>After deleting, \"Fleet deleted successfully\" appears and you return to the Library <strong>Fleets<\/strong> tab.<\/li><\/ul>\n<h2>Good to know<\/h2>\n<ul><li><strong>Save Changes<\/strong> stays greyed out until you change something. The name rules are the same as when creating a fleet.<\/li><li><strong>Cancel<\/strong> always asks you to confirm with <strong>Discard changes?<\/strong> while editing. Click <strong>Discard changes<\/strong> to leave or <strong>Keep editing<\/strong> to stay.<\/li><li>Deleting removes the fleet and its vessel list, stops its notifications and alerts, and removes its analytics and event history. The vessels stay in Meridia and in other fleets. <strong>This can't be undone.<\/strong><\/li><li>The delete window shows the fleet's name, type and vessel count.<\/li><li>Editing a fleet can't be done from the list view's rows; use the cards. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> whether list view offers fleet actions.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>No <strong>Edit<\/strong> or <strong>Delete<\/strong> option<\/td><td>Your account may not have fleet management; contact your administrator. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>\"A fleet with this name already exists\"<\/td><td>Pick a different name.<\/td><\/tr><tr><td>\"Name must be at least 3 characters\"<\/td><td>Use a longer name.<\/td><\/tr><tr><td>\"Add at least one vessel\"<\/td><td>A fleet can't be saved empty; delete it instead if you no longer need it.<\/td><\/tr><tr><td>The edit page shows an error instead of the fleet<\/td><td>Reload the page or return to the Library and try again.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Change a fleet's name, description or vessels, or delete it, from the Library or the fleet page. > Available only if fleet management is enabled for your account. Steps: edit or rename In the Library, click the Fleets tab. Hover over a fleet card and click the More actions button at the top right. 📷 Screenshot 1: Fleet card menu with Open, Edit and Delete Click Edit . (From a fleet page, click the menu beside the fleet name and click Edit .) 📷 Screenshot 2: Fleet page menu with Edit and Delete On the Edit page, change Name or Description (optional) to rename the fleet or update its note. To add vessels, use Search vessel name or IMO... or the Bulk Import tab, as when you create a fleet. To remove vessels, click the X beside a vessel in the Vessels panel, or use Clear fleet . 📷 Screenshot 3: Edit page with the Vessels panel Click Save Changes . Steps: delete Open the fleet's menu as above (Library card or fleet page) and click Delete . In Delete fleet? , read what will be removed. 📷 Screenshot 4: Delete fleet? confirmation Click Delete fleet to confirm. Expected result After saving, \"Fleet \"name\" updated successfully\" appears. You return to the fleet page if you came from it, otherwise to the Library Fleets tab. After deleting, \"Fleet deleted successfully\" appears and you return to the Library Fleets tab. Good to know Save Changes stays greyed out until you change something. The name rules are the same as when creating a fleet. Cancel always asks you to confirm with Discard changes? while editing. Click Discard changes to leave or Keep editing to stay. Deleting removes the fleet and its vessel list, stops its notifications and alerts, and removes its analytics and event history. The vessels stay in Meridia and in other fleets. This can't be undone. The delete window shows the fleet's name, type and vessel count. Editing a fleet can't be done from the list view's rows; use the cards. [CONFIRM] whether list view offers fleet actions. Troubleshooting Problem What to do No Edit or Delete option Your account may not have fleet management; contact your administrator. [CONFIRM] \"A fleet with this name already exists\" Pick a different name. \"Name must be at least 3 characters\" Use a longer name. \"Add at least one vessel\" A fleet can't be saved empty; delete it instead if you no longer need it. The edit page shows an error instead of the fleet Reload the page or return to the Library and try again. "}, "09-Notifications/01-how-to-open-and-read-your-notifications": {"t": "How to open and read your notifications", "j": "09-Notifications", "h": "<p>See new vessel, port and zone notifications from the bell in the sidebar, from pop-ups, or on the full Notifications page.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>The <strong>Notifications<\/strong> entry only appears in the sidebar if your account includes Meridia.<\/li><li>You only receive notifications for ports and zones where you have turned notifications on. See \"How to turn notifications on for a port or zone\".<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Look for the bell icon labelled <strong>Notifications<\/strong> in the sidebar.<ul><li>When the sidebar is collapsed, a small dot on the bell means there are new notifications or downloads.<\/li><li>When the sidebar is expanded, a number appears beside <strong>Notifications<\/strong> (it shows <strong>9+<\/strong> for more than nine).<\/li><\/ul><div class=\"shot\"><b>Screenshot 1<\/b> – Sidebar with the Notifications bell and badge<\/div><\/li><li>Click <strong>Notifications<\/strong> to open the notifications panel.<\/li><li>On the <strong>Notifications<\/strong> tab, read the list. Newest items appear first.<div class=\"shot\"><b>Screenshot 2<\/b> – Notifications panel with a list of items<\/div><\/li><li>Read each item: a coloured tag, the port or zone name, then the vessel name, the event (for example Arrival or Entry) and how long ago it happened.<\/li><li>To remove one item from the panel list, click the <strong>x<\/strong> on that item.<\/li><li>To see everything, click <strong>View All<\/strong> at the bottom of the panel.<div class=\"shot\"><b>Screenshot 3<\/b> – View All button at the bottom of the panel<\/div><\/li><li>You can also click any item in the panel to open the <strong>Notifications<\/strong> page.<\/li><li>To close the panel without opening the page, click the <strong>x<\/strong> at the top right of the panel.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The <strong>Notifications<\/strong> page opens at <code>/analytics/notifications<\/code> and lists your notifications. Opening it clears the bell number or dot and empties the panel list.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>If there is nothing new, the panel shows <strong>No notifications<\/strong>.<\/li><li>The tag on each item shows the vessel's risk result. It shows <strong>NA<\/strong> for exits, port arrivals, port departures, port area departures, and for tug and push-boat vessels, and <strong>Unscored<\/strong> if no result is available yet.<\/li><li>Removing an item with the <strong>x<\/strong> only removes it from the panel list. It does not delete it from the Notifications page <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>.<\/li><li>The panel does not have read or unread states, or a mark-as-read option.<\/li><li>If pop-ups are on, new notifications also appear in the bottom-left corner (see \"How to turn notification pop-ups on or off\").<\/li><li>Click a pop-up to open the <strong>Notifications<\/strong> page. Click <strong>x<\/strong> on a pop-up to close it. When more than one pop-up shows, <strong>Dismiss All<\/strong> closes them all.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>I do not see <strong>Notifications<\/strong> in the sidebar<\/td><td>Your account may not include Meridia. Contact your account manager.<\/td><\/tr><tr><td>The panel says <strong>No notifications<\/strong><\/td><td>Turn on notifications for a port or zone first.<\/td><\/tr><tr><td>I do not see pop-ups<\/td><td>Check <strong>Show Notification Pop-ups<\/strong> in <strong>My Profile<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " See new vessel, port and zone notifications from the bell in the sidebar, from pop-ups, or on the full Notifications page. Before you begin The Notifications entry only appears in the sidebar if your account includes Meridia. You only receive notifications for ports and zones where you have turned notifications on. See \"How to turn notifications on for a port or zone\". Steps Look for the bell icon labelled Notifications in the sidebar. When the sidebar is collapsed, a small dot on the bell means there are new notifications or downloads. When the sidebar is expanded, a number appears beside Notifications (it shows 9+ for more than nine). 📷 Screenshot 1: Sidebar with the Notifications bell and badge Click Notifications to open the notifications panel. On the Notifications tab, read the list. Newest items appear first. 📷 Screenshot 2: Notifications panel with a list of items Read each item: a coloured tag, the port or zone name, then the vessel name, the event (for example Arrival or Entry) and how long ago it happened. To remove one item from the panel list, click the x on that item. To see everything, click View All at the bottom of the panel. 📷 Screenshot 3: View All button at the bottom of the panel You can also click any item in the panel to open the Notifications page. To close the panel without opening the page, click the x at the top right of the panel. Expected result The Notifications page opens at /analytics/notifications and lists your notifications. Opening it clears the bell number or dot and empties the panel list. Good to know If there is nothing new, the panel shows No notifications . The tag on each item shows the vessel's risk result. It shows NA for exits, port arrivals, port departures, port area departures, and for tug and push-boat vessels, and Unscored if no result is available yet. Removing an item with the x only removes it from the panel list. It does not delete it from the Notifications page [CONFIRM] . The panel does not have read or unread states, or a mark-as-read option. If pop-ups are on, new notifications also appear in the bottom-left corner (see \"How to turn notification pop-ups on or off\"). Click a pop-up to open the Notifications page. Click x on a pop-up to close it. When more than one pop-up shows, Dismiss All closes them all. Troubleshooting Problem What to do I do not see Notifications in the sidebar Your account may not include Meridia. Contact your account manager. The panel says No notifications Turn on notifications for a port or zone first. I do not see pop-ups Check Show Notification Pop-ups in My Profile . "}, "09-Notifications/02-how-to-filter-and-manage-notifications-page": {"t": "How to filter and manage the Notifications page", "j": "09-Notifications", "h": "<p>Narrow the Notifications page to ports or zones, refresh it, export it, and choose how far back it looks.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open <strong>Notifications<\/strong> in the sidebar, then click <strong>View All<\/strong>, or go to the <strong>Notifications<\/strong> page directly.<\/li><li>You will see the <strong>Notifications<\/strong> tab and the <strong>Downloads<\/strong> tab at the top. Stay on <strong>Notifications<\/strong>.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Choose <strong>All<\/strong>, <strong>Ports<\/strong> or <strong>Zones<\/strong> to filter the list by type.<ul><li><strong>Ports<\/strong> shows port arrival, departure, area arrival and area departure notifications.<\/li><li><strong>Zones<\/strong> shows zone entry and exit notifications.<\/li><\/ul><div class=\"shot\"><b>Screenshot 1<\/b> – All, Ports and Zones tabs above the table<\/div><\/li><li>Read the table. Columns are <strong>Date/Time<\/strong> (shown as UTC or System, depending on your time zone setting), <strong>Zone/Port Name<\/strong> (<strong>Zone Name<\/strong> or <strong>Port Name<\/strong> on the other tabs), <strong>Event Type<\/strong>, <strong>Vessel Name<\/strong>, <strong>Vessel IMO<\/strong>, <strong>Vessel Type<\/strong> and <strong>Risk<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Notifications table with columns<\/div><\/li><li>Click a port, zone, vessel name or IMO to open its details page.<\/li><li>Hover over <strong>Risk<\/strong> or <strong>Event Type<\/strong> to see a tooltip.<\/li><li>Click <strong>Refresh<\/strong> to reload the list.<\/li><li>Click <strong>Export<\/strong> to download the rows shown on the current page as a CSV file. The file is named after the tab, for example \"All-Notifications\".<\/li><li>To change how far back notifications are shown, click the three-dot menu at the top right.<\/li><li>Under <strong>Show Notifications<\/strong>, choose one option from the list. The selected option has a tick.<div class=\"shot\"><b>Screenshot 3<\/b> – Three-dot menu with Show Notifications options<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table reloads and shows only the notifications that match your choices.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The options under <strong>Show Notifications<\/strong> are loaded for your account; the labels include <strong>All<\/strong> <strong><mark class=\"confirm\">[CONFIRM exact list, expected: All, last 7 days, last 24 hours]<\/mark><\/strong>.<\/li><li>The table has no search box, no sorting, and no mark-as-read or delete options. Notifications are not marked read or unread.<\/li><li><strong>Refresh<\/strong> also clears the pop-ups and the bell panel list.<\/li><li>If many notifications arrive quickly, a banner shows \"N new notifications received\" with a <strong>show<\/strong> button. Click <strong>show<\/strong> to reload the list.<\/li><li>The table loads up to 500 notifications at a time <strong><mark class=\"confirm\">[CONFIRM paging behaviour beyond this]<\/mark><\/strong>.<\/li><li>Risk values come from PurpleTRAC Auto-Screening <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>. Tooltips say auto-screening is currently only available for Port Area Arrival and Zone Entry events, and not for tug and push-boat vessels.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>The page says \"Your notifications will appear here\"<\/td><td>Configure notifications on items in your library, or change the <strong>Show Notifications<\/strong> option.<\/td><\/tr><tr><td>The newest notification is missing<\/td><td>Click <strong>Refresh<\/strong>.<\/td><\/tr><tr><td>Times look wrong<\/td><td>Check your time zone setting. The column heading shows <strong>Date/Time (UTC)<\/strong> or <strong>Date/Time (System)<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Narrow the Notifications page to ports or zones, refresh it, export it, and choose how far back it looks. Before you begin Open Notifications in the sidebar, then click View All , or go to the Notifications page directly. You will see the Notifications tab and the Downloads tab at the top. Stay on Notifications . Steps Choose All , Ports or Zones to filter the list by type. Ports shows port arrival, departure, area arrival and area departure notifications. Zones shows zone entry and exit notifications. 📷 Screenshot 1: All, Ports and Zones tabs above the table Read the table. Columns are Date/Time (shown as UTC or System, depending on your time zone setting), Zone/Port Name ( Zone Name or Port Name on the other tabs), Event Type , Vessel Name , Vessel IMO , Vessel Type and Risk . 📷 Screenshot 2: Notifications table with columns Click a port, zone, vessel name or IMO to open its details page. Hover over Risk or Event Type to see a tooltip. Click Refresh to reload the list. Click Export to download the rows shown on the current page as a CSV file. The file is named after the tab, for example \"All-Notifications\". To change how far back notifications are shown, click the three-dot menu at the top right. Under Show Notifications , choose one option from the list. The selected option has a tick. 📷 Screenshot 3: Three-dot menu with Show Notifications options Expected result The table reloads and shows only the notifications that match your choices. Good to know The options under Show Notifications are loaded for your account; the labels include All [CONFIRM exact list, expected: All, last 7 days, last 24 hours] . The table has no search box, no sorting, and no mark-as-read or delete options. Notifications are not marked read or unread. Refresh also clears the pop-ups and the bell panel list. If many notifications arrive quickly, a banner shows \"N new notifications received\" with a show button. Click show to reload the list. The table loads up to 500 notifications at a time [CONFIRM paging behaviour beyond this] . Risk values come from PurpleTRAC Auto-Screening [CONFIRM] . Tooltips say auto-screening is currently only available for Port Area Arrival and Zone Entry events, and not for tug and push-boat vessels. Troubleshooting Problem What to do The page says \"Your notifications will appear here\" Configure notifications on items in your library, or change the Show Notifications option. The newest notification is missing Click Refresh . Times look wrong Check your time zone setting. The column heading shows Date/Time (UTC) or Date/Time (System) . "}, "09-Notifications/03-how-to-turn-notifications-on-for-a-port-or-zone": {"t": "How to turn notifications on for a port or zone", "j": "09-Notifications", "h": "<p>Choose which events trigger notifications, and whether you also get emails.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>The notification settings button is on <strong>port<\/strong> and <strong>zone<\/strong> pages. It is not shown on vessel or fleet pages.<\/li><li>Turning notifications on adds the item to your library if it is not already there.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open a port or zone page.<\/li><li>Click the bell-with-gear button labelled <strong>Manage Notifications<\/strong> in the top toolbar. It is orange when notifications are on and grey when off.<div class=\"shot\"><b>Screenshot 1<\/b> – Manage Notifications button in the toolbar<\/div><\/li><li>Turn on <strong>Enable Live Notifications<\/strong>.<ul><li>If the item is not in your library, a message says \"This item will be added to your library if notifications are enabled\".<\/li><\/ul><div class=\"shot\"><b>Screenshot 2<\/b> – Settings panel with Enable Live Notifications on<\/div><\/li><li>Turn on the events you want.<ul><li>Ports: <strong>Area Arrivals<\/strong>, <strong>Arrivals<\/strong>, <strong>Departures<\/strong>, <strong>Area Departures<\/strong>.<\/li><li>Zones: <strong>Entries<\/strong>, <strong>Exits<\/strong>.<\/li><\/ul><\/li><li>To screen vessels automatically, turn on <strong>PurpleTRAC Auto-Screening<\/strong>. It appears under <strong>Area Arrivals<\/strong> (ports) or <strong>Entries<\/strong> (zones) once that event is on.<\/li><li>Under <strong>SEVERITY<\/strong>, turn on the levels you want: <strong>Critical<\/strong>, <strong>Warning<\/strong>, <strong>OK<\/strong>, <strong>Unscored<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – PurpleTRAC Auto-Screening and Severity toggles<\/div><\/li><li>To get emails, turn on <strong>Email Notifications<\/strong>.<\/li><li>Next to <strong>Timing<\/strong>, choose <strong>Immediately<\/strong> or <strong>Scheduled<\/strong>.<\/li><li>If you chose <strong>Scheduled<\/strong>, pick <strong>Emails per day<\/strong> (<strong>1<\/strong>, <strong>2<\/strong>, <strong>3<\/strong>, <strong>4<\/strong> or <strong>Hourly<\/strong>).<\/li><li>Set <strong>Send at<\/strong> to the time of day the first email is sent.<div class=\"shot\"><b>Screenshot 4<\/b> – Email Notifications, Timing and Send at<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The button turns orange and your changes save automatically after a moment. There is no Save button.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Turning <strong>Enable Live Notifications<\/strong> on switches on all events for that item <strong><mark class=\"confirm\">[CONFIRM defaults]<\/mark><\/strong>. Turning it off switches off all events and email.<\/li><li>If you switch off all port events, or both zone events, <strong>Enable Live Notifications<\/strong> turns off.<\/li><li>Turning <strong>PurpleTRAC Auto-Screening<\/strong> on selects all four severity levels. Severity applies to email alerts, and only when PurpleTRAC Auto-Screening is on.<\/li><li><strong>Immediately<\/strong> on large zones and ports may trigger a large amount of emails.<\/li><li><strong>Send at<\/strong> is the first email time; later emails follow the <strong>Emails per day<\/strong> interval. It is shown in your local time.<\/li><li>If your account does not include PurpleTRAC Auto-Screening, it shows a lock icon and a greyed-out toggle. Hover the info icon for \"Contact your account manager to enable PurpleTRAC Auto-Screening for compliance and sanctions risks.\"<\/li><li>Which accounts see the lock vs. the toggle depends on account permissions <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>I cannot find the button<\/td><td>Make sure you are on a port or zone page, not a vessel or fleet page.<\/td><\/tr><tr><td>PurpleTRAC Auto-Screening is greyed out<\/td><td>Contact your account manager.<\/td><\/tr><tr><td>I do not see PurpleTRAC Auto-Screening<\/td><td>Turn on <strong>Area Arrivals<\/strong> or <strong>Entries<\/strong> first.<\/td><\/tr><tr><td>Nothing appears in Notifications<\/td><td>Check <strong>Enable Live Notifications<\/strong> is on and an event is selected.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Choose which events trigger notifications, and whether you also get emails. Before you begin The notification settings button is on port and zone pages. It is not shown on vessel or fleet pages. Turning notifications on adds the item to your library if it is not already there. Steps Open a port or zone page. Click the bell-with-gear button labelled Manage Notifications in the top toolbar. It is orange when notifications are on and grey when off. 📷 Screenshot 1: Manage Notifications button in the toolbar Turn on Enable Live Notifications . If the item is not in your library, a message says \"This item will be added to your library if notifications are enabled\". 📷 Screenshot 2: Settings panel with Enable Live Notifications on Turn on the events you want. Ports: Area Arrivals , Arrivals , Departures , Area Departures . Zones: Entries , Exits . To screen vessels automatically, turn on PurpleTRAC Auto-Screening . It appears under Area Arrivals (ports) or Entries (zones) once that event is on. Under SEVERITY , turn on the levels you want: Critical , Warning , OK , Unscored . 📷 Screenshot 3: PurpleTRAC Auto-Screening and Severity toggles To get emails, turn on Email Notifications . Next to Timing , choose Immediately or Scheduled . If you chose Scheduled , pick Emails per day ( 1 , 2 , 3 , 4 or Hourly ). Set Send at to the time of day the first email is sent. 📷 Screenshot 4: Email Notifications, Timing and Send at Expected result The button turns orange and your changes save automatically after a moment. There is no Save button. Good to know Turning Enable Live Notifications on switches on all events for that item [CONFIRM defaults] . Turning it off switches off all events and email. If you switch off all port events, or both zone events, Enable Live Notifications turns off. Turning PurpleTRAC Auto-Screening on selects all four severity levels. Severity applies to email alerts, and only when PurpleTRAC Auto-Screening is on. Immediately on large zones and ports may trigger a large amount of emails. Send at is the first email time; later emails follow the Emails per day interval. It is shown in your local time. If your account does not include PurpleTRAC Auto-Screening, it shows a lock icon and a greyed-out toggle. Hover the info icon for \"Contact your account manager to enable PurpleTRAC Auto-Screening for compliance and sanctions risks.\" Which accounts see the lock vs. the toggle depends on account permissions [CONFIRM] . Troubleshooting Problem What to do I cannot find the button Make sure you are on a port or zone page, not a vessel or fleet page. PurpleTRAC Auto-Screening is greyed out Contact your account manager. I do not see PurpleTRAC Auto-Screening Turn on Area Arrivals or Entries first. Nothing appears in Notifications Check Enable Live Notifications is on and an event is selected. "}, "09-Notifications/04-how-to-download-your-exports": {"t": "How to download your exports", "j": "09-Notifications", "h": "<p>Find exports you requested and download them as CSV files.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Request an export from a port, zone, vessel or fleet page first <strong><mark class=\"confirm\">[CONFIRM where export is requested]<\/mark><\/strong>.<\/li><li>Exports are available to download for 24 hours after they're generated.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Click <strong>Notifications<\/strong> in the sidebar.<\/li><li>Click the <strong>Downloads<\/strong> tab in the panel to see recent exports. Alternatively, click <strong>View All<\/strong> and then the <strong>Downloads<\/strong> tab on the Notifications page.<div class=\"shot\"><b>Screenshot 1<\/b> – Downloads tab in the Notifications panel<\/div><\/li><li>On the <strong>Downloads<\/strong> tab, find your export. Columns are <strong>Export<\/strong>, <strong>Type<\/strong>, <strong>Requested On<\/strong>, <strong>Status<\/strong> and <strong>Expires<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Downloads table<\/div><\/li><li>Check the <strong>Status<\/strong>: <strong>Processing<\/strong>, <strong>Completed<\/strong>, <strong>Failed<\/strong> or <strong>Expired<\/strong>.<\/li><li>When it is <strong>Completed<\/strong>, click <strong>Download CSV<\/strong>.<\/li><li>A message \"CSV downloaded successfully!\" appears.<\/li><li>To narrow the list, open <strong>Type<\/strong> and tick <strong>Port<\/strong>, <strong>Zone<\/strong>, <strong>Vessel<\/strong> or <strong>Fleet<\/strong>.<\/li><li>To search, type in <strong>Search exports...<\/strong>.<\/li><li>Click <strong>Refresh<\/strong> (next to \"Updated ... ago\") to update the list.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The CSV file downloads to your computer.<\/p>\n<h2>Good to know<\/h2>\n<ul><li><strong>Expires<\/strong> counts down, for example \"Expires in 3h\".<\/li><li>Failed exports show <strong>Retry<\/strong>. Expired exports show <strong>Request again<\/strong>.<\/li><li>The panel only lists exports requested recently in this browser. The page lists recent exports <strong><mark class=\"confirm\">[CONFIRM how many]<\/mark><\/strong>.<\/li><li>The panel shows <strong>No downloads available<\/strong> if there are none.<\/li><li>If an export is still running, a message says \"Export is still processing...\".<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Status is <strong>Failed<\/strong><\/td><td>Click <strong>Retry<\/strong>. The panel shows \"Export failed — please try again.\"<\/td><\/tr><tr><td>Status is <strong>Expired<\/strong><\/td><td>Click <strong>Request again<\/strong>.<\/td><\/tr><tr><td>A message says \"Export completed but download URL is missing\"<\/td><td>Click <strong>Refresh<\/strong>, then try again.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Find exports you requested and download them as CSV files. Before you begin Request an export from a port, zone, vessel or fleet page first [CONFIRM where export is requested] . Exports are available to download for 24 hours after they're generated. Steps Click Notifications in the sidebar. Click the Downloads tab in the panel to see recent exports. Alternatively, click View All and then the Downloads tab on the Notifications page. 📷 Screenshot 1: Downloads tab in the Notifications panel On the Downloads tab, find your export. Columns are Export , Type , Requested On , Status and Expires . 📷 Screenshot 2: Downloads table Check the Status : Processing , Completed , Failed or Expired . When it is Completed , click Download CSV . A message \"CSV downloaded successfully!\" appears. To narrow the list, open Type and tick Port , Zone , Vessel or Fleet . To search, type in Search exports... . Click Refresh (next to \"Updated ... ago\") to update the list. Expected result The CSV file downloads to your computer. Good to know Expires counts down, for example \"Expires in 3h\". Failed exports show Retry . Expired exports show Request again . The panel only lists exports requested recently in this browser. The page lists recent exports [CONFIRM how many] . The panel shows No downloads available if there are none. If an export is still running, a message says \"Export is still processing...\". Troubleshooting Problem What to do Status is Failed Click Retry . The panel shows \"Export failed — please try again.\" Status is Expired Click Request again . A message says \"Export completed but download URL is missing\" Click Refresh , then try again. "}, "10-Meridia-IQ/01-how-to-start-a-chat-with-meridia-iq": {"t": "How to start a chat with Meridia IQ", "j": "10-Meridia-IQ", "h": "<p>Open Meridia IQ, type a question and read the answer in a chat.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Meridia IQ appears only for users whose account has access to it. If you do not see <strong>Meridia IQ<\/strong> in the left sidebar, ask your administrator. <strong><mark class=\"confirm\">[CONFIRM: wording for how access is granted]<\/mark><\/strong><\/li><li>Expand the left sidebar if it is minimised (use the <strong>Expand<\/strong> button at the top).<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the left sidebar, find the <strong>Meridia IQ<\/strong> section.<div class=\"shot\"><b>Screenshot 1<\/b> – Left sidebar with the Meridia IQ heading and New Chat button<\/div><\/li><li>Click <strong>New Chat<\/strong>. The Meridia IQ page opens with the heading \"Turn Maritime Data Into Actionable Insights\".<ul><li>If the sidebar is minimised, click the <strong>New Chat<\/strong> icon instead.<\/li><\/ul><\/li><li>Read the examples under <strong>I can help you with things like:<\/strong> for ideas. They are examples only and are not clickable.<div class=\"shot\"><b>Screenshot 2<\/b> – Welcome screen with the six example questions<\/div><\/li><li>Click the message box at the bottom. It shows \"Ask anything about vessels, ports or zones\".<\/li><li>Type your question.<ul><li>Press <strong>Shift + Enter<\/strong> to start a new line.<\/li><\/ul><\/li><li>Press <strong>Enter<\/strong>, or click the round arrow button, to send.<div class=\"shot\"><b>Screenshot 3<\/b> – Message box with typed question and arrow send button<\/div><\/li><li>Wait for the answer. A \"Thinking...\" message appears, followed by changing messages such as \"Hoisting the data...\" and \"Plotting the voyage...\".<\/li><li>To ask a follow-up, type in the same box (it now shows \"Reply...\") and send again.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>Your question appears on the right and the answer appears below it. The chat is added to the chat list in the sidebar.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>You can also start a chat from an <strong>Ask IQ<\/strong> button on a vessel, port or zone. See \"How to ask Meridia IQ about a vessel, port or zone\".<\/li><li>While an answer is loading, the message box is locked. There is no stop or regenerate button.<\/li><li>The small circle next to the send button shows how much of your daily token limit you have used. Hover over it to see \"% used\" and the reset time (UTC).<\/li><li>A note under the box says: \"Meridia IQ offers insights based on available maritime data. We recommend verifying key information.\"<\/li><li>What Meridia IQ can and cannot answer, and which data it uses. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li>The example questions mention vessels by IMO number, ports and zones such as the Strait of Hormuz. <strong><mark class=\"confirm\">[CONFIRM: whether these examples are guaranteed to return results]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Send arrow is greyed out<\/td><td>Type a message first. If you opened an existing chat, wait a moment for the connection.<\/td><\/tr><tr><td>\"Connection not ready. Please try again shortly.\"<\/td><td>Wait a few seconds and send again.<\/td><\/tr><tr><td>\"Failed to send message. Please try again.\"<\/td><td>Send the message again.<\/td><\/tr><tr><td>\"Daily token limit reached. Resets at ...\" (box shows \"Token limit reached\")<\/td><td>You cannot send until the reset time shown.<\/td><\/tr><tr><td>\"Your daily token quota has been reached. It will reset automatically at ... Please contact your administrator if you require immediate access.\"<\/td><td>Wait for the reset, or contact your administrator.<\/td><\/tr><tr><td>A message starting \"Error:\" appears instead of an answer<\/td><td>Try asking again. <strong><mark class=\"confirm\">[CONFIRM: recommended action]<\/mark><\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "x": " Open Meridia IQ, type a question and read the answer in a chat. Before you begin Meridia IQ appears only for users whose account has access to it. If you do not see Meridia IQ in the left sidebar, ask your administrator. [CONFIRM: wording for how access is granted] Expand the left sidebar if it is minimised (use the Expand button at the top). Steps In the left sidebar, find the Meridia IQ section. 📷 Screenshot 1: Left sidebar with the Meridia IQ heading and New Chat button Click New Chat . The Meridia IQ page opens with the heading \"Turn Maritime Data Into Actionable Insights\". If the sidebar is minimised, click the New Chat icon instead. Read the examples under I can help you with things like: for ideas. They are examples only and are not clickable. 📷 Screenshot 2: Welcome screen with the six example questions Click the message box at the bottom. It shows \"Ask anything about vessels, ports or zones\". Type your question. Press Shift + Enter to start a new line. Press Enter , or click the round arrow button, to send. 📷 Screenshot 3: Message box with typed question and arrow send button Wait for the answer. A \"Thinking...\" message appears, followed by changing messages such as \"Hoisting the data...\" and \"Plotting the voyage...\". To ask a follow-up, type in the same box (it now shows \"Reply...\") and send again. Expected result Your question appears on the right and the answer appears below it. The chat is added to the chat list in the sidebar. Good to know You can also start a chat from an Ask IQ button on a vessel, port or zone. See \"How to ask Meridia IQ about a vessel, port or zone\". While an answer is loading, the message box is locked. There is no stop or regenerate button. The small circle next to the send button shows how much of your daily token limit you have used. Hover over it to see \"% used\" and the reset time (UTC). A note under the box says: \"Meridia IQ offers insights based on available maritime data. We recommend verifying key information.\" What Meridia IQ can and cannot answer, and which data it uses. [CONFIRM] The example questions mention vessels by IMO number, ports and zones such as the Strait of Hormuz. [CONFIRM: whether these examples are guaranteed to return results] Troubleshooting Problem What to do Send arrow is greyed out Type a message first. If you opened an existing chat, wait a moment for the connection. \"Connection not ready. Please try again shortly.\" Wait a few seconds and send again. \"Failed to send message. Please try again.\" Send the message again. \"Daily token limit reached. Resets at ...\" (box shows \"Token limit reached\") You cannot send until the reset time shown. \"Your daily token quota has been reached. It will reset automatically at ... Please contact your administrator if you require immediate access.\" Wait for the reset, or contact your administrator. A message starting \"Error:\" appears instead of an answer Try asking again. [CONFIRM: recommended action] "}, "10-Meridia-IQ/02-how-to-read-meridia-iq-answers-and-maps": {"t": "How to read Meridia IQ answers, maps and score tables", "j": "10-Meridia-IQ", "h": "<p>Understand the text, map, chart and MTI score displays that can appear in a Meridia IQ answer.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Send a question in a chat first. See \"How to start a chat with Meridia IQ\".<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Read the text answer. It can include headings, lists, bold text and tables.<div class=\"shot\"><b>Screenshot 1<\/b> – Answer with text and a table<\/div><\/li><li>If the answer includes a map, find the bar labelled <strong>Map Visualization<\/strong>.<\/li><li>Click the arrows icon (tooltip <strong>Expand<\/strong>) to enlarge the map. Click it again (<strong>Collapse<\/strong>), or click outside the map, to shrink it.<div class=\"shot\"><b>Screenshot 2<\/b> – Embedded map with Legend panel at top left<\/div><\/li><li>Click the arrow next to <strong>Legend<\/strong> (top left of the map) to open or close it.<\/li><li>Under <strong>Positions<\/strong>, choose <strong>Blended<\/strong>, <strong>Separate<\/strong> or <strong>None<\/strong>.<\/li><li>Under <strong>Events<\/strong>, tick or untick event types, or use <strong>Show/Hide All<\/strong>. Items include Zone Entry, Zone Exit, Port Arrival, Port Departure, Positional Discrepancy, AIS Gap Start, AIS Gap End, STS Pairings and <strong>AIS Gap Track<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Legend open with Positions and Events options<\/div><\/li><li>Hover over a vessel marker to see its details (for example Name, IMO, MMSI, Flag, Reported Dest, Reported ETA, Speed/Course).<\/li><li>Click a vessel marker to open that vessel's page.<\/li><li>Click a port marker to zoom in. A number on the marker shows how many berths it has. Hover over a port or berth to see its details.<\/li><li>If the answer includes a chart or table, find the bar labelled <strong>Chart/Table Visualization<\/strong> and use the same expand arrows.<div class=\"shot\"><b>Screenshot 4<\/b> – Chart/Table Visualization panel<\/div><\/li><li>For MTI scores of one vessel, read the gauge and the <strong>Vessel Score<\/strong>, <strong>Reporting Score<\/strong> and <strong>Voyages Score<\/strong> badges.<\/li><li>For several vessels, read the table with columns <strong>IMO<\/strong>, <strong>Rating<\/strong>, <strong>MTI Score<\/strong>, <strong>Vessel<\/strong>, <strong>Reporting<\/strong> and <strong>Voyages<\/strong>.<ul><li>Click a column heading to sort. Click it again to reverse the order.<\/li><li>Click <strong>Next →<\/strong> or <strong>← Prev<\/strong> to change page (5 vessels per page).<\/li><\/ul><div class=\"shot\"><b>Screenshot 5<\/b> – MTI score table with sorting arrows and paging<\/div><\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>Score cells are green, amber or red. Colour thresholds seen in the app: 3.5 and above is green, 2.0 and above is amber, below 2.0 is red. <strong><mark class=\"confirm\">[CONFIRM: meaning of the scores and colours]<\/mark><\/strong><\/li><li>A dash (—) means no value. \"MTI data unavailable for this vessel\" means no score came back.<\/li><li>Markers hovered show \"Click for more details\". Not every marker opens a page; vessel markers do (when they have an IMO).<\/li><li>Meaning of each event type and marker colour. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li>There are no like/dislike, copy or share buttons on answers.<\/li><li>Accuracy of answers. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> The app itself advises: \"We recommend verifying key information.\"<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Map is blank<\/td><td>Collapse and expand it again, or refresh the page. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>A map marker does not open a page<\/td><td>Only vessel markers open pages.<\/td><\/tr><tr><td>Answer shows \"No response text\"<\/td><td>Ask the question again. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "x": " Understand the text, map, chart and MTI score displays that can appear in a Meridia IQ answer. Before you begin Send a question in a chat first. See \"How to start a chat with Meridia IQ\". Steps Read the text answer. It can include headings, lists, bold text and tables. 📷 Screenshot 1: Answer with text and a table If the answer includes a map, find the bar labelled Map Visualization . Click the arrows icon (tooltip Expand ) to enlarge the map. Click it again ( Collapse ), or click outside the map, to shrink it. 📷 Screenshot 2: Embedded map with Legend panel at top left Click the arrow next to Legend (top left of the map) to open or close it. Under Positions , choose Blended , Separate or None . Under Events , tick or untick event types, or use Show/Hide All . Items include Zone Entry, Zone Exit, Port Arrival, Port Departure, Positional Discrepancy, AIS Gap Start, AIS Gap End, STS Pairings and AIS Gap Track . 📷 Screenshot 3: Legend open with Positions and Events options Hover over a vessel marker to see its details (for example Name, IMO, MMSI, Flag, Reported Dest, Reported ETA, Speed/Course). Click a vessel marker to open that vessel's page. Click a port marker to zoom in. A number on the marker shows how many berths it has. Hover over a port or berth to see its details. If the answer includes a chart or table, find the bar labelled Chart/Table Visualization and use the same expand arrows. 📷 Screenshot 4: Chart/Table Visualization panel For MTI scores of one vessel, read the gauge and the Vessel Score , Reporting Score and Voyages Score badges. For several vessels, read the table with columns IMO , Rating , MTI Score , Vessel , Reporting and Voyages . Click a column heading to sort. Click it again to reverse the order. Click Next → or ← Prev to change page (5 vessels per page). 📷 Screenshot 5: MTI score table with sorting arrows and paging Good to know Score cells are green, amber or red. Colour thresholds seen in the app: 3.5 and above is green, 2.0 and above is amber, below 2.0 is red. [CONFIRM: meaning of the scores and colours] A dash (—) means no value. \"MTI data unavailable for this vessel\" means no score came back. Markers hovered show \"Click for more details\". Not every marker opens a page; vessel markers do (when they have an IMO). Meaning of each event type and marker colour. [CONFIRM] There are no like/dislike, copy or share buttons on answers. Accuracy of answers. [CONFIRM] The app itself advises: \"We recommend verifying key information.\" Troubleshooting Problem What to do Map is blank Collapse and expand it again, or refresh the page. [CONFIRM] A map marker does not open a page Only vessel markers open pages. Answer shows \"No response text\" Ask the question again. [CONFIRM] "}, "10-Meridia-IQ/03-how-to-ask-iq-about-a-vessel-port-or-zone": {"t": "How to ask Meridia IQ about a vessel, port or zone", "j": "10-Meridia-IQ", "h": "<p>Use an <strong>Ask IQ<\/strong> button to open Meridia IQ and send a ready-made question about the item you are viewing.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li><strong>Ask IQ<\/strong> buttons appear only if your account has access to Meridia IQ.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the Library search window (the <strong>Search<\/strong> item in the sidebar, or the search on the <strong>Library<\/strong> page).<\/li><li>Choose the <strong>Vessels<\/strong>, <strong>Ports<\/strong> or <strong>Zones<\/strong> tab and search for the item.<\/li><li>In the result row, click <strong>Ask IQ<\/strong> (next to <strong>Add to Library<\/strong>).<div class=\"shot\"><b>Screenshot 1<\/b> – Search result row with Ask IQ and Add to Library buttons<\/div><\/li><li>Meridia IQ opens and the question is sent automatically. Wait for the answer.<div class=\"shot\"><b>Screenshot 2<\/b> – Meridia IQ chat showing the sent question and Thinking...<\/div><\/li><\/ol>\n<p>Other places to click <strong>Ask IQ<\/strong>:<\/p>\n<ol><li>On a vessel, port or zone page, click <strong>Ask IQ<\/strong> at the top right of the tabs bar.<div class=\"shot\"><b>Screenshot 3<\/b> – Vessel page with Ask IQ button<\/div><\/li><li>On a fleet page, open a vessel, port or zone side panel and click <strong>Ask IQ<\/strong> in the panel header.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>A new chat opens with one of these questions already sent:<\/p>\n<ul><li>Vessel: \"Summarise [name] (IMO: [number]) over the last 30 days: current voyage status, port calls, zone events, AIS gaps, and anything else that is notable.\"<\/li><li>Port: \"Show me the activity for port [name] in the last 24 hours.\"<\/li><li>Zone: \"Show me the activity for zone [name] in the last 24 hours.\"<\/li><\/ul>\n<h2>Good to know<\/h2>\n<ul><li>The question is sent straight away. You cannot edit it first. Ask a follow-up in the same chat to refine it.<\/li><li>The question uses up part of your daily token limit.<\/li><li>Ask IQ is not available on the fleet page itself or the fleet event panel.<\/li><li>Quality and coverage of these summaries. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>No <strong>Ask IQ<\/strong> button<\/td><td>Your account may not have Meridia IQ access. Contact your administrator.<\/td><\/tr><tr><td>Nothing is sent<\/td><td>Wait a few seconds; the chat sends once the connection is ready. If you see \"Connection not ready. Please try again shortly.\", ask again.<\/td><\/tr><tr><td>\"Your daily token quota has been reached...\"<\/td><td>Wait until the reset time shown.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use an Ask IQ button to open Meridia IQ and send a ready-made question about the item you are viewing. Before you begin Ask IQ buttons appear only if your account has access to Meridia IQ. Steps Open the Library search window (the Search item in the sidebar, or the search on the Library page). Choose the Vessels , Ports or Zones tab and search for the item. In the result row, click Ask IQ (next to Add to Library ). 📷 Screenshot 1: Search result row with Ask IQ and Add to Library buttons Meridia IQ opens and the question is sent automatically. Wait for the answer. 📷 Screenshot 2: Meridia IQ chat showing the sent question and Thinking... Other places to click Ask IQ : On a vessel, port or zone page, click Ask IQ at the top right of the tabs bar. 📷 Screenshot 3: Vessel page with Ask IQ button On a fleet page, open a vessel, port or zone side panel and click Ask IQ in the panel header. Expected result A new chat opens with one of these questions already sent: Vessel: \"Summarise [name] (IMO: [number]) over the last 30 days: current voyage status, port calls, zone events, AIS gaps, and anything else that is notable.\" Port: \"Show me the activity for port [name] in the last 24 hours.\" Zone: \"Show me the activity for zone [name] in the last 24 hours.\" Good to know The question is sent straight away. You cannot edit it first. Ask a follow-up in the same chat to refine it. The question uses up part of your daily token limit. Ask IQ is not available on the fleet page itself or the fleet event panel. Quality and coverage of these summaries. [CONFIRM] Troubleshooting Problem What to do No Ask IQ button Your account may not have Meridia IQ access. Contact your administrator. Nothing is sent Wait a few seconds; the chat sends once the connection is ready. If you see \"Connection not ready. Please try again shortly.\", ask again. \"Your daily token quota has been reached...\" Wait until the reset time shown. "}, "10-Meridia-IQ/04-how-to-manage-your-chat-history": {"t": "How to manage your Meridia IQ chat history", "j": "10-Meridia-IQ", "h": "<p>Reopen, review and delete your past Meridia IQ chats from the sidebar.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Expand the left sidebar. The chat list is hidden when the sidebar is minimised.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the left sidebar, scroll to the <strong>Meridia IQ<\/strong> section. Your chats are listed under it.<div class=\"shot\"><b>Screenshot 1<\/b> – Sidebar chat list grouped by Today, Last 7 Days, Last 30 Days, Older<\/div><\/li><li>Find the chat under its group: <strong>Today<\/strong>, <strong>Last 7 Days<\/strong>, <strong>Last 30 Days<\/strong> or <strong>Older<\/strong>.<ul><li>Click a group name to collapse or expand it.<\/li><\/ul><\/li><li>Click a chat title to open it. The earlier messages load, then you can continue with <strong>Reply...<\/strong>.<\/li><li>To delete a chat, hover over it and click the <strong>...<\/strong> icon (<strong>Chat options<\/strong>).<div class=\"shot\"><b>Screenshot 2<\/b> – Chat options menu showing Delete<\/div><\/li><li>Click <strong>Delete<\/strong>.<\/li><li>In the <strong>Delete Chat?<\/strong> window, click <strong>Delete<\/strong> to confirm, or <strong>Cancel<\/strong> to keep it.<div class=\"shot\"><b>Screenshot 3<\/b> – Delete Chat? confirmation<\/div><\/li><li>To start a fresh chat at any time, click <strong>New Chat<\/strong> above the list.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>A message confirms that the chat was \"deleted successfully\" and it disappears from the list. If you deleted the chat you were viewing, the next chat in the list opens, or a new empty chat if none remain.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Chats are named after your first message. Long titles are shortened with \"...\".<\/li><li>Each chat has its own web address ending in the chat's ID. You can bookmark it to return to the chat later. <strong><mark class=\"confirm\">[CONFIRM: whether others can open a shared link]<\/mark><\/strong><\/li><li>Deleting cannot be undone.<\/li><li>There is no search, rename or pin for chats.<\/li><li>The list loads the 20 most recent chats. <strong><mark class=\"confirm\">[CONFIRM: how to reach older chats]<\/mark><\/strong><\/li><li>How long chats are kept. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Chat list shows grey loading bars<\/td><td>Wait for the list to load.<\/td><\/tr><tr><td>\"Failed to load chat history. Please try again.\"<\/td><td>Click the chat again or refresh the page.<\/td><\/tr><tr><td>No chat list in the sidebar<\/td><td>Expand the sidebar; check you have Meridia IQ access.<\/td><\/tr><tr><td>A new chat is not listed yet<\/td><td>Send your first message; the chat is added after that.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Reopen, review and delete your past Meridia IQ chats from the sidebar. Before you begin Expand the left sidebar. The chat list is hidden when the sidebar is minimised. Steps In the left sidebar, scroll to the Meridia IQ section. Your chats are listed under it. 📷 Screenshot 1: Sidebar chat list grouped by Today, Last 7 Days, Last 30 Days, Older Find the chat under its group: Today , Last 7 Days , Last 30 Days or Older . Click a group name to collapse or expand it. Click a chat title to open it. The earlier messages load, then you can continue with Reply... . To delete a chat, hover over it and click the ... icon ( Chat options ). 📷 Screenshot 2: Chat options menu showing Delete Click Delete . In the Delete Chat? window, click Delete to confirm, or Cancel to keep it. 📷 Screenshot 3: Delete Chat? confirmation To start a fresh chat at any time, click New Chat above the list. Expected result A message confirms that the chat was \"deleted successfully\" and it disappears from the list. If you deleted the chat you were viewing, the next chat in the list opens, or a new empty chat if none remain. Good to know Chats are named after your first message. Long titles are shortened with \"...\". Each chat has its own web address ending in the chat's ID. You can bookmark it to return to the chat later. [CONFIRM: whether others can open a shared link] Deleting cannot be undone. There is no search, rename or pin for chats. The list loads the 20 most recent chats. [CONFIRM: how to reach older chats] How long chats are kept. [CONFIRM] Troubleshooting Problem What to do Chat list shows grey loading bars Wait for the list to load. \"Failed to load chat history. Please try again.\" Click the chat again or refresh the page. No chat list in the sidebar Expand the sidebar; check you have Meridia IQ access. A new chat is not listed yet Send your first message; the chat is added after that. "}}, "built": "2026-10-05"}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var A = D.articles, J = D.journeys;
  var order = []; J.forEach(function(j){ order = order.concat(j.articles); });
  var $ = function(s){ return document.querySelector(s); };
  var main = $("#main"), nav = $("#nav"), q = $("#q");

  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  /* ---------- navigation tree ---------- */
  function buildNav(){
    var h = "";
    J.forEach(function(j){
      h += '<details data-j="'+j.id+'"><summary>'+esc(j.id.split("-")[0])+" · "+esc(j.title)+'</summary>';
      j.articles.forEach(function(id){ h += '<a class="item" href="#/'+id+'" data-id="'+id+'">'+esc(A[id].t)+'</a>'; });
      h += "</details>";
    });
    nav.innerHTML = h;
  }
  function markActive(id){
    nav.querySelectorAll("a.item").forEach(function(a){ a.classList.toggle("active", a.dataset.id===id); });
    if(id){ var a = nav.querySelector('a.item[data-id="'+id+'"]'); if(a){ a.parentNode.open = true; if(a.scrollIntoView) a.scrollIntoView({block:"nearest"}); } }
  }

  /* ---------- views ---------- */
  var BANNER = '<div class="banner"><b>Draft edition.</b> Highlighted notes like <mark class="confirm">[CONFIRM]</mark> mark details still being verified, and dashed boxes mark where screenshots will be added.</div>';
  function home(){
    var h = BANNER+"<h1>Meridia User Guide</h1><p>Step-by-step help for using Meridia. Pick a topic below, or search above. This page works offline.</p><div class=\"cards\">";
    J.forEach(function(j){
      h += '<div class="card"><h3><a href="#/'+j.articles[0]+'">'+esc(j.id.split("-")[0])+" · "+esc(j.title)+"</a></h3><ul>";
      j.articles.forEach(function(id){ h += '<li><a href="#/'+id+'">'+esc(A[id].t)+"</a></li>"; });
      h += "</ul></div>";
    });
    h += '</div><footer>Built '+esc(D.built)+" · "+order.length+" articles</footer>";
    main.innerHTML = h; document.title = "Meridia User Guide"; markActive(null);
  }
  function article(id){
    var a = A[id]; if(!a){ home(); return; }
    var j = J.filter(function(x){ return x.id===a.j; })[0], i = order.indexOf(id);
    var prev = i>0 ? order[i-1] : null, next = i<order.length-1 ? order[i+1] : null;
    var h = '<div class="crumb"><a href="#/">Guide</a> › '+esc(j.id.split("-")[0])+" · "+esc(j.title)+"</div>"+BANNER;
    h += "<article>"+a.h.replace(/^<!--[^>]*-->\n?/,"").replace(/^/,"<h1>"+esc(a.t)+"</h1>")+"</article>";
    h += '<div class="pager">'+(prev?'<a class="prev" href="#/'+prev+'"><small>← Previous</small>'+esc(A[prev].t)+"</a>":"<span></span>")
       + (next?'<a class="next" href="#/'+next+'"><small>Next →</small>'+esc(A[next].t)+"</a>":"<span></span>")+"</div>";
    main.innerHTML = h; document.title = a.t+" – Meridia User Guide"; markActive(id);
  }
  function search(term){
    var words = term.toLowerCase().split(/\s+/).filter(function(w){ return w.length>1; });
    if(!words.length){ route(); return; }
    var res = [];
    order.forEach(function(id){
      var a = A[id], t = a.t.toLowerCase(), x = a.x.toLowerCase(), score = 0, ok = true;
      words.forEach(function(w){
        var inT = t.indexOf(w)>-1, c = x.split(w).length-1;
        if(!inT && !c){ ok = false; }
        score += (inT?10:0) + Math.min(c,10);
      });
      if(ok) res.push({id:id,score:score});
    });
    res.sort(function(a,b){ return b.score-a.score; });
    var h = "<h1>Search results</h1><p>"+res.length+" result"+(res.length===1?"":"s")+" for “"+esc(term)+"”.</p><div class=\"hits\">";
    var re = new RegExp("("+words.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }).join("|")+")","ig");
    res.slice(0,40).forEach(function(r){
      var a = A[r.id], pos = a.x.toLowerCase().indexOf(words[0]);
      var s = pos>-1 ? a.x.substr(Math.max(0,pos-70),180) : a.x.substr(0,160);
      h += '<div class="hit"><a href="#/'+r.id+'">'+esc(a.t)+"</a><small>"+esc(J.filter(function(j){return j.id===a.j;})[0].title)+"</small><p>…"+esc(s).replace(re,"<b>$1</b>")+"…</p></div>";
    });
    main.innerHTML = h+"</div>"; document.title = "Search – Meridia User Guide"; markActive(null);
  }
  function route(){
    var h = location.hash.replace(/^#\/?/,"");
    if(!h) home(); else article(decodeURIComponent(h));
    document.body.classList.remove("navopen");
    window.scrollTo(0,0); main.focus({preventScroll:true});
  }

  /* ---------- controls ---------- */
  var timer; q.addEventListener("input", function(){ clearTimeout(timer); timer = setTimeout(function(){ search(q.value.trim()); }, 150); });
  q.addEventListener("keydown", function(e){ if(e.key==="Escape"){ q.value=""; route(); } });
  document.addEventListener("keydown", function(e){ if(e.key==="/" && document.activeElement!==q){ e.preventDefault(); q.focus(); } });
  $("#menu").addEventListener("click", function(){ document.body.classList.toggle("navopen"); });
  $("#print").addEventListener("click", function(){ window.print(); });
  var shotsBtn = $("#shots");
  function applyShots(hide){ document.body.classList.toggle("noshots", hide); shotsBtn.textContent = hide ? "Show screenshot notes" : "Hide screenshot notes"; }
  shotsBtn.addEventListener("click", function(){ var hide = !document.body.classList.contains("noshots"); applyShots(hide); safeSet("mg-hideshots", hide?"1":"0"); });
  applyShots(safeGet("mg-hideshots")==="1");
  var root = document.documentElement, th = safeGet("mg-theme"); if(th) root.setAttribute("data-theme", th);
  $("#theme").addEventListener("click", function(){
    var dark = root.getAttribute("data-theme")==="dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var n = dark ? "light" : "dark"; root.setAttribute("data-theme", n); safeSet("mg-theme", n);
  });
  window.addEventListener("hashchange", function(){ q.value=""; route(); });
  buildNav(); route();
})();
</script>
</body>
</html>

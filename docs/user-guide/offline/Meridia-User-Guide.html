<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridia User Guide</title>
<meta name="description" content="Step-by-step help for Meridia. Works offline.">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1f2933; --muted:#616e7c; --line:#dde1e6;
  --accent:#d9480f; --accent-soft:#fff1e8; --link:#1c64f2; --code:#eef1f4;
  --shot-bg:#fff7ed; --shot-line:#ea580c; --shot-text:#9a3412; --mark:#fff3bf; --mark-text:#5f3b00;
  --th:#f1f3f5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#1a1f26; --text:#e6e9ee; --muted:#9aa5b1; --line:#2c333c;
    --accent:#ff8a4c; --accent-soft:#2a1d14; --link:#7aa7ff; --code:#252c35;
    --shot-bg:#2a1d14; --shot-line:#ff8a4c; --shot-text:#ffb98a; --mark:#4a3b00; --mark-text:#ffe08a; --th:#232a33;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1a1f26; --text:#e6e9ee; --muted:#9aa5b1; --line:#2c333c;
  --accent:#ff8a4c; --accent-soft:#2a1d14; --link:#7aa7ff; --code:#252c35;
  --shot-bg:#2a1d14; --shot-line:#ff8a4c; --shot-text:#ffb98a; --mark:#4a3b00; --mark-text:#ffe08a; --th:#232a33;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;white-space:nowrap}
header h1 a{color:var(--text);text-decoration:none}
header h1 span{color:var(--accent)}
#menu{display:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
#q{flex:1;max-width:520px;margin-left:auto;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100% - 56px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px 8px 40px;overflow:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
nav details{margin:2px 0}
nav summary{cursor:pointer;padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;list-style:none}
nav summary::-webkit-details-marker{display:none}
nav summary::before{content:"▸";display:inline-block;width:1.1em;color:var(--muted)}
nav details[open] summary::before{content:"▾"}
nav summary:hover{background:var(--bg)}
nav a.item{display:block;padding:6px 10px 6px 30px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;line-height:1.35}
nav a.item:hover{background:var(--bg)}
nav a.item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:28px 32px 80px;max-width:900px;width:100%}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px}
.crumb a{color:var(--muted)}
article h1{font-size:28px;line-height:1.25;margin:0 0 12px}
article h2{font-size:20px;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
article h3{font-size:17px;margin:20px 0 6px}
article p{margin:8px 0}
article ol,article ul{padding-left:1.4em}
article li{margin:6px 0}
article li>ul{margin:4px 0}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--th)}
.shot{background:var(--shot-bg);border:1px dashed var(--shot-line);color:var(--shot-text);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
body.noshots .shot{display:none}
mark.confirm{background:var(--mark);color:var(--mark-text);padding:0 4px;border-radius:4px;font-size:.88em;font-weight:600}
a.xref{text-decoration:none;border-bottom:1px dotted var(--link)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
.pager a{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--text)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted)}
.pager .next{text-align:right}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:16px}
.card h3 a{color:var(--text);text-decoration:none}
.card ul{margin:6px 0 0;padding-left:1.1em;font-size:14px}
.card li{margin:3px 0}
.hits .hit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.hits .hit a{font-weight:600;text-decoration:none}
.hits .hit small{display:block;color:var(--muted)}
.hits .hit p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.hits b{background:var(--mark);color:var(--mark-text);border-radius:3px;padding:0 2px}
footer{color:var(--muted);font-size:12px;margin-top:40px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  #menu{display:inline-block}
  nav{display:none;position:fixed;left:0;top:56px;width:86%;max-width:340px;height:calc(100vh - 56px);z-index:30;box-shadow:4px 0 20px rgba(0,0,0,.25)}
  body.navopen nav{display:block}
  main{padding:20px 16px 60px}
  header h1 span.long{display:none}
  .tools .btn.hide-sm{display:none}
}
@media print{
  header,nav,.pager,.tools,#menu,.banner{display:none!important}
  .layout{display:block}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .shot{break-inside:avoid}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Open menu">☰</button>
  <h1><a href="#/">Meridia <span class="long">User Guide</span></a></h1>
  <input id="q" type="search" placeholder="Search the guide…" aria-label="Search the guide" autocomplete="off">
  <div class="tools">
    <button class="btn hide-sm" id="shots" title="Hide or show the screenshot placeholders">Hide screenshot notes</button>
    <button class="btn hide-sm" id="theme" title="Switch light / dark">◐ Theme</button>
    <button class="btn hide-sm" id="print" title="Print or save as PDF">Print</button>
  </div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Guide contents"></nav>
  <main id="main" tabindex="-1"></main>
</div>

/08-how-to-view-vessel-occupancy-at-a-berth"]}, {"id": "06-Zones", "title": "Research a zone", "articles": ["06-Zones/01-how-to-open-and-read-a-zone-page", "06-Zones/02-how-to-view-live-zone-traffic-on-the-map", "06-Zones/03-how-to-read-zone-traffic-charts", "06-Zones/04-how-to-read-the-zone-events-table"]}, {"id": "07-Custom-zones", "title": "Create and manage your own zones", "articles": ["07-Custom-zones/01-how-to-create-custom-zone-shortcut", "07-Custom-zones/02-how-to-view-and-manage-custom-zones", "07-Custom-zones/03-how-to-create-a-custom-zone", "07-Custom-zones/04-how-to-upload-a-zone-shape-file-or-geojson", "07-Custom-zones/05-how-to-edit-a-custom-zone"]}, {"id": "08-Fleets", "title": "Create and monitor fleets", "articles": ["08-Fleets/01-how-to-manage-fleets-in-library", "08-Fleets/02-how-to-create-a-fleet", "08-Fleets/03-how-to-open-and-read-a-fleet-page", "08-Fleets/04-how-to-view-your-fleet-on-the-map", "08-Fleets/05-how-to-read-fleet-composition", "08-Fleets/06-how-to-view-fleet-events", "08-Fleets/07-how-to-edit-or-delete-a-fleet"]}, {"id": "09-Notifications", "title": "Stay informed", "articles": ["09-Notifications/01-how-to-open-and-read-your-notifications", "09-Notifications/02-how-to-filter-and-manage-notifications-page", "09-Notifications/03-how-to-turn-notifications-on-for-a-port-or-zone", "09-Notifications/04-how-to-download-your-exports"]}, {"id": "10-Meridia-IQ", "title": "Ask Meridia IQ", "articles": ["10-Meridia-IQ/01-how-to-start-a-chat-with-meridia-iq", "10-Meridia-IQ/02-how-to-read-meridia-iq-answers-and-maps", "10-Meridia-IQ/03-how-to-ask-iq-about-a-vessel-port-or-zone", "10-Meridia-IQ/04-how-to-manage-your-chat-history"]}], "articles": {"01-Getting-started/01-how-to-log-in": {"t": "How to log in to Meridia", "j": "01-Getting-started", "h": "<p>Sign in to Meridia with your email address and password.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>You need a Meridia account (email address and password).<\/li><li>If you have forgotten your password, see <a class=\"xref\" href=\"#/01-Getting-started/03-how-to-reset-password\">How to reset your password<\/a>.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the Meridia login page in your browser.<div class=\"shot\"><b>Screenshot 1<\/b> – Login page – Meridia logo, Email, Password, \"Keep me signed in\", Sign in<\/div><\/li><li>In the <strong>Email<\/strong> field, type your email address.<\/li><li>In the <strong>Password<\/strong> field, type your password.<div class=\"shot\"><b>Screenshot 2<\/b> – Login form filled in (blur the email)<\/div><\/li><li><em>(Optional)<\/em> Tick <strong>Keep me signed in<\/strong> to stay signed in on this device. Leave it unticked on shared computers.<\/li><li>Click <strong>Sign in<\/strong>. The button reads \"Signing in...\" while your details are checked.<ul><li>The <strong>Sign in<\/strong> button stays disabled until both Email and Password are filled in.<\/li><\/ul><\/li><li><strong>If your account has two-step verification (MFA)<\/strong>, the <strong>Verify your identity<\/strong> screen appears. Continue with <a class=\"xref\" href=\"#/01-Getting-started/02-how-to-log-in-with-verification-code-mfa\">How to log in with a verification code<\/a>. Otherwise go to step 7.<\/li><li>You are taken to the Meridia home page (Library).<div class=\"shot\"><b>Screenshot 3<\/b> – Home page after login<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You are signed in and see the Meridia home page.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Without <strong>Keep me signed in<\/strong>, Meridia signs you out after <strong>60 minutes of inactivity<\/strong> and shows: \"Your session has expired. Please log in again.\"<\/li><li>By signing in you agree to Meridia's Terms and Conditions (link at the bottom of the form).<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A red message appears at the top after clicking Sign in<\/td><td>The email or password was not accepted. Re-enter them carefully (check Caps Lock). The message text comes from the server <strong><mark class=\"confirm\">[CONFIRM exact wording]<\/mark><\/strong>.<\/td><\/tr><tr><td>Sign in button is greyed out<\/td><td>Fill in both Email and Password.<\/td><\/tr><tr><td>Forgot your password<\/td><td>Click <strong>Forgotten Password?<\/strong> under the Sign in button and follow <a class=\"xref\" href=\"#/01-Getting-started/03-how-to-reset-password\">How to reset your password<\/a>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Sign in to Meridia with your email address and password. Before you begin You need a Meridia account (email address and password). If you have forgotten your password, see How to reset your password . Steps Open the Meridia login page in your browser. 📷 Screenshot 1: Login page – Meridia logo, Email, Password, \"Keep me signed in\", Sign in In the Email field, type your email address. In the Password field, type your password. 📷 Screenshot 2: Login form filled in (blur the email) (Optional) Tick Keep me signed in to stay signed in on this device. Leave it unticked on shared computers. Click Sign in . The button reads \"Signing in...\" while your details are checked. The Sign in button stays disabled until both Email and Password are filled in. If your account has two-step verification (MFA) , the Verify your identity screen appears. Continue with How to log in with a verification code . Otherwise go to step 7. You are taken to the Meridia home page (Library). 📷 Screenshot 3: Home page after login Expected result You are signed in and see the Meridia home page. Good to know Without Keep me signed in , Meridia signs you out after 60 minutes of inactivity and shows: \"Your session has expired. Please log in again.\" By signing in you agree to Meridia's Terms and Conditions (link at the bottom of the form). Troubleshooting Problem What to do A red message appears at the top after clicking Sign in The email or password was not accepted. Re-enter them carefully (check Caps Lock). The message text comes from the server [CONFIRM exact wording] . Sign in button is greyed out Fill in both Email and Password. Forgot your password Click Forgotten Password? under the Sign in button and follow How to reset your password . "}, "01-Getting-started/02-how-to-log-in-with-verification-code-mfa": {"t": "How to log in with a verification code (MFA)", "j": "01-Getting-started", "h": "<p>If two-step verification is turned on for your account, you must enter a one-time code after your password.<\/p>\n<h2>Before you begin<\/h2>\n<p>Complete steps 1–5 of <a class=\"xref\" href=\"#/01-Getting-started/01-how-to-log-in\">How to log in<\/a>. The MFA screen appears automatically after <strong>Sign in<\/strong>.<\/p>\n<h2>Steps<\/h2>\n<ol><li>On the <strong>Verify your identity<\/strong> screen, check your email for a 6-digit code. <strong><mark class=\"confirm\">[CONFIRM: delivery is email per the screen text \"Enter the code sent to your email\"]<\/mark><\/strong><div class=\"shot\"><b>Screenshot 1<\/b> – Verify your identity screen<\/div><\/li><li>Type the code in <strong>Verification Code<\/strong> (digits only, 6 characters).<\/li><li>Click <strong>Sign in<\/strong>.<\/li><li>You are taken to the Meridia home page.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>The code is valid for <strong>10 minutes<\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Code invalid. Please try again or <strong>Send a new code<\/strong>\"<\/td><td>Re-check the digits or click <strong>Send a new code<\/strong>.<\/td><\/tr><tr><td>\"Code expired.\"<\/td><td>Click <strong>Send a new code<\/strong> and use the latest email.<\/td><\/tr><tr><td>No email received<\/td><td>Check spam/junk, then click <strong>Send a new code<\/strong> under the field.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " If two-step verification is turned on for your account, you must enter a one-time code after your password. Before you begin Complete steps 1–5 of How to log in . The MFA screen appears automatically after Sign in . Steps On the Verify your identity screen, check your email for a 6-digit code. [CONFIRM: delivery is email per the screen text \"Enter the code sent to your email\"] 📷 Screenshot 1: Verify your identity screen Type the code in Verification Code (digits only, 6 characters). Click Sign in . You are taken to the Meridia home page. Good to know The code is valid for 10 minutes . Troubleshooting Problem What to do \"Code invalid. Please try again or Send a new code \" Re-check the digits or click Send a new code . \"Code expired.\" Click Send a new code and use the latest email. No email received Check spam/junk, then click Send a new code under the field. "}, "01-Getting-started/03-how-to-reset-password": {"t": "How to reset your password", "j": "01-Getting-started", "h": "<p>Reset a forgotten password using a one-time code sent to your email.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>You need access to the email inbox registered with your Meridia account.<\/li><li>Plan to finish within <strong>10 minutes<\/strong> – the code expires after that.<\/li><\/ul>\n<h2>Steps<\/h2>\n<h3>Part 1 – Request a code<\/h3>\n<ol><li>On the login page, click <strong>Forgotten Password?<\/strong> (below the Sign in button).<div class=\"shot\"><b>Screenshot 1<\/b> – Login page with \"Forgotten Password?\" link highlighted<\/div><\/li><li>On <strong>Reset your password<\/strong>, type your registered email in <strong>Email Address<\/strong>.<ul><li>The <strong>Continue<\/strong> button stays disabled until the address is valid (\"Invalid email address\" appears if not).<\/li><\/ul><div class=\"shot\"><b>Screenshot 2<\/b> – Reset your password – email entry<\/div><\/li><li>Click <strong>Continue<\/strong>. A message \"OTP sent successfully\" appears and you move to the next screen.<\/li><\/ol>\n<h3>Part 2 – Verify and set a new password<\/h3>\n<ol><li>Open the email and copy the 6-digit code.<\/li><li>On <strong>Verify your identity<\/strong>, enter the code in <strong>Verification Code<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Verify your identity – code and password fields<\/div><\/li><li>In <strong>New Password<\/strong>, enter your new password. Hover the (i) icon to see the requirements:<ul><li>At least 8 characters<\/li><li>At least 1 number<\/li><li>At least 1 special character<\/li><li>At least 1 uppercase letter<\/li><li>At least 1 lowercase letter<\/li><\/ul><div class=\"shot\"><b>Screenshot 4<\/b> – Password requirements tooltip<\/div><\/li><li>In <strong>Confirm New Password<\/strong>, re-enter the same password.<\/li><li>Click <strong>Continue<\/strong>.<\/li><li>You return to the login page with \"Password reset successfully\". Sign in with your new password (see <a class=\"xref\" href=\"#/01-Getting-started/01-how-to-log-in\">How to log in<\/a>).<div class=\"shot\"><b>Screenshot 5<\/b> – Login page with success message<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>Your password is changed and you can sign in with the new one.<\/p>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Code invalid. Please try again or Send a new code\"<\/td><td>Check the 6 digits or click <strong>Send a new code<\/strong>.<\/td><\/tr><tr><td>\"Code expired.\"<\/td><td>Click <strong>Send a new code<\/strong>, then use the newest email.<\/td><\/tr><tr><td>\"OTP already sent\"<\/td><td>A code was requested in the last 10 minutes. Use that email; a new one can be requested after 10 minutes.<\/td><\/tr><tr><td>\"Password invalid. Password requirements: …\"<\/td><td>Update the password to meet all five rules.<\/td><\/tr><tr><td>\"This Password does not match.\"<\/td><td>Make Confirm New Password identical to New Password.<\/td><\/tr><tr><td>Continue button greyed out<\/td><td>Complete every field correctly.<\/td><\/tr><tr><td>No email arrives<\/td><td>Check spam/junk; confirm you used your registered email.<\/td><\/tr><tr><td>Want to leave<\/td><td>Click <strong>Back to Sign in<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Reset a forgotten password using a one-time code sent to your email. Before you begin You need access to the email inbox registered with your Meridia account. Plan to finish within 10 minutes – the code expires after that. Steps Part 1 – Request a code On the login page, click Forgotten Password? (below the Sign in button). 📷 Screenshot 1: Login page with \"Forgotten Password?\" link highlighted On Reset your password , type your registered email in Email Address . The Continue button stays disabled until the address is valid (\"Invalid email address\" appears if not). 📷 Screenshot 2: Reset your password – email entry Click Continue . A message \"OTP sent successfully\" appears and you move to the next screen. Part 2 – Verify and set a new password Open the email and copy the 6-digit code. On Verify your identity , enter the code in Verification Code . 📷 Screenshot 3: Verify your identity – code and password fields In New Password , enter your new password. Hover the (i) icon to see the requirements: At least 8 characters At least 1 number At least 1 special character At least 1 uppercase letter At least 1 lowercase letter 📷 Screenshot 4: Password requirements tooltip In Confirm New Password , re-enter the same password. Click Continue . You return to the login page with \"Password reset successfully\". Sign in with your new password (see How to log in ). 📷 Screenshot 5: Login page with success message Expected result Your password is changed and you can sign in with the new one. Troubleshooting Problem What to do \"Code invalid. Please try again or Send a new code\" Check the 6 digits or click Send a new code . \"Code expired.\" Click Send a new code , then use the newest email. \"OTP already sent\" A code was requested in the last 10 minutes. Use that email; a new one can be requested after 10 minutes. \"Password invalid. Password requirements: …\" Update the password to meet all five rules. \"This Password does not match.\" Make Confirm New Password identical to New Password. Continue button greyed out Complete every field correctly. No email arrives Check spam/junk; confirm you used your registered email. Want to leave Click Back to Sign in . "}, "01-Getting-started/04-how-to-sign-out": {"t": "How to sign out of Meridia", "j": "01-Getting-started", "h": "<h2>Steps<\/h2>\n<ol><li>At the bottom of the left sidebar, click your <strong>name<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – User menu with Sign Out<\/div><\/li><li>Click <strong>Sign Out<\/strong>. \"Logging out...\" appears and you return to the login page.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>Meridia also signs you out automatically after <strong>60 minutes of inactivity<\/strong> unless you ticked <strong>Keep me signed in<\/strong> at login.<\/li><li>Use Sign Out on shared computers.<\/li><\/ul>", "x": " Steps At the bottom of the left sidebar, click your name . 📷 Screenshot 1: User menu with Sign Out Click Sign Out . \"Logging out...\" appears and you return to the login page. Good to know Meridia also signs you out automatically after 60 minutes of inactivity unless you ticked Keep me signed in at login. Use Sign Out on shared computers. "}, "02-Your-account/01-how-to-view-your-profile": {"t": "How to view your profile and account details", "j": "02-Your-account", "h": "<p>See the personal details linked to your Meridia account.<\/p>\n<h2>Steps<\/h2>\n<ol><li>At the bottom of the left sidebar, click your <strong>name<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Sidebar user menu open – email, My Profile, Sign Out<\/div><\/li><li>Click <strong>My Profile<\/strong>.<\/li><li>Scroll to the <strong>Personal<\/strong> section (\"Your personal account details\").<div class=\"shot\"><b>Screenshot 2<\/b> – Personal section<\/div><\/li><li>You can see: <strong>Username<\/strong>, <strong>Full Name<\/strong>, <strong>Email<\/strong>, <strong>Role<\/strong> and <strong>Account ID<\/strong>.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>These details are read-only. To change your name, email or role, contact your Meridia account administrator or support. <strong><mark class=\"confirm\">[CONFIRM: admin/support process]<\/mark><\/strong><\/li><li>Your <strong>Role<\/strong> and <strong>Account ID<\/strong> are useful to quote when contacting support.<\/li><li>Meridia content (such as the Library) is visible only to accounts and users that have the <strong>Meridia<\/strong> feature enabled. If it isn't enabled for you, contact your account administrator or Pole Star.<\/li><\/ul>", "x": " See the personal details linked to your Meridia account. Steps At the bottom of the left sidebar, click your name . 📷 Screenshot 1: Sidebar user menu open – email, My Profile, Sign Out Click My Profile . Scroll to the Personal section (\"Your personal account details\"). 📷 Screenshot 2: Personal section You can see: Username , Full Name , Email , Role and Account ID . Good to know These details are read-only. To change your name, email or role, contact your Meridia account administrator or support. [CONFIRM: admin/support process] Your Role and Account ID are useful to quote when contacting support. Meridia content (such as the Library) is visible only to accounts and users that have the Meridia feature enabled. If it isn't enabled for you, contact your account administrator or Pole Star. "}, "02-Your-account/02-how-to-change-time-zone-and-theme": {"t": "How to change the time zone and theme", "j": "02-Your-account", "h": "<p>Choose how dates and times are shown, and whether Meridia uses light or dark mode.<\/p>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>My Profile<\/strong> (click your name at the bottom of the sidebar, then <strong>My Profile<\/strong>).<\/li><li>In the <strong>General<\/strong> section, under <strong>Time Zone<\/strong>, choose:<ul><li><strong>System<\/strong> – times follow your device's time zone.<\/li><li><strong>UTC<\/strong> – all times are shown in UTC.<\/li><\/ul><div class=\"shot\"><b>Screenshot 1<\/b> – General section – Time Zone and Theme options<\/div><\/li><li>Under <strong>Theme<\/strong>, choose <strong>System<\/strong>, <strong>Light<\/strong> or <strong>Dark<\/strong>. The page previews your choice immediately.<\/li><li>Click <strong>Save Changes<\/strong> to keep your choices.<ul><li>To undo unsaved changes, click <strong>Reset<\/strong>.<\/li><\/ul><\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li><strong>Save Changes<\/strong> and <strong>Reset<\/strong> are greyed out until you change something.<\/li><li>If you leave the page without clicking <strong>Save Changes<\/strong>, the theme goes back to your last saved setting.<\/li><li><strong>System<\/strong> theme follows your device's light/dark setting.<\/li><\/ul>", "x": " Choose how dates and times are shown, and whether Meridia uses light or dark mode. Steps Open My Profile (click your name at the bottom of the sidebar, then My Profile ). In the General section, under Time Zone , choose: System – times follow your device's time zone. UTC – all times are shown in UTC. 📷 Screenshot 1: General section – Time Zone and Theme options Under Theme , choose System , Light or Dark . The page previews your choice immediately. Click Save Changes to keep your choices. To undo unsaved changes, click Reset . Good to know Save Changes and Reset are greyed out until you change something. If you leave the page without clicking Save Changes , the theme goes back to your last saved setting. System theme follows your device's light/dark setting. "}, "02-Your-account/03-how-to-manage-notification-popups": {"t": "How to turn notification pop-ups on or off", "j": "02-Your-account", "h": "<p>Control whether Meridia shows pop-ups when new notifications arrive.<\/p>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>My Profile<\/strong>.<\/li><li>In the <strong>Notifications<\/strong> section, find <strong>Show Notification Pop-ups<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Notifications section with toggle<\/div><\/li><li>Switch the toggle <strong>on<\/strong> to see pop-ups in the bottom-left corner of the screen, or <strong>off<\/strong> to hide them.<\/li><li>Click <strong>Save Changes<\/strong>. (<strong>Reset<\/strong> reverts an unsaved change.)<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>Turning pop-ups off dismisses any pop-ups currently showing.<\/li><li>Notifications still appear on the <strong>Notifications<\/strong> page either way.<\/li><\/ul>", "x": " Control whether Meridia shows pop-ups when new notifications arrive. Steps Open My Profile . In the Notifications section, find Show Notification Pop-ups . 📷 Screenshot 1: Notifications section with toggle Switch the toggle on to see pop-ups in the bottom-left corner of the screen, or off to hide them. Click Save Changes . ( Reset reverts an unsaved change.) Good to know Turning pop-ups off dismisses any pop-ups currently showing. Notifications still appear on the Notifications page either way. "}, "02-Your-account/04-how-to-change-password-from-my-profile": {"t": "How to change your password (while signed in)", "j": "02-Your-account", "h": "<p>Change your password from My Profile using a one-time code sent to your email.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>You need access to the email inbox registered with your account.<\/li><li>The code is valid for <strong>10 minutes<\/strong>.<\/li><li>You will be signed out when the change is complete.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>My Profile<\/strong>.<\/li><li>Scroll to <strong>Security<\/strong> → <strong>Password Reset<\/strong> and click <strong>Reset Password<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Security section – Reset Password button<\/div><\/li><li>Meridia emails you a code (\"OTP sent successfully\") and shows <strong>Verify your identity<\/strong>.<\/li><li>Enter the 6-digit code in <strong>Verification Code<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Verify your identity form<\/div><\/li><li>Enter a <strong>New Password<\/strong> that meets all rules (hover the (i) icon):at least 8 characters, 1 number, 1 special character, 1 uppercase and 1 lowercase letter.<\/li><li>Re-enter it in <strong>Confirm New Password<\/strong>.<\/li><li>Click <strong>Reset Password<\/strong> (the button is enabled once all fields are valid).<\/li><li>\"Password reset successfully. Logging you out...\" appears. Sign in again with the new password.<\/li><\/ol>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Code invalid. Please try again or Send a new code\"<\/td><td>Check the digits, or click <strong>Send a new code<\/strong>.<\/td><\/tr><tr><td>\"Code expired.\"<\/td><td>Click <strong>Send a new code<\/strong>.<\/td><\/tr><tr><td>\"OTP already sent\"<\/td><td>You requested a code in the last 10 minutes – use that email.<\/td><\/tr><tr><td>\"This Password does not match.\"<\/td><td>Make both password fields identical.<\/td><\/tr><tr><td>Changed your mind<\/td><td>Click <strong>Cancel<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Change your password from My Profile using a one-time code sent to your email. Before you begin You need access to the email inbox registered with your account. The code is valid for 10 minutes . You will be signed out when the change is complete. Steps Open My Profile . Scroll to Security → Password Reset and click Reset Password . 📷 Screenshot 1: Security section – Reset Password button Meridia emails you a code (\"OTP sent successfully\") and shows Verify your identity . Enter the 6-digit code in Verification Code . 📷 Screenshot 2: Verify your identity form Enter a New Password that meets all rules (hover the (i) icon):at least 8 characters, 1 number, 1 special character, 1 uppercase and 1 lowercase letter. Re-enter it in Confirm New Password . Click Reset Password (the button is enabled once all fields are valid). \"Password reset successfully. Logging you out...\" appears. Sign in again with the new password. Troubleshooting Problem What to do \"Code invalid. Please try again or Send a new code\" Check the digits, or click Send a new code . \"Code expired.\" Click Send a new code . \"OTP already sent\" You requested a code in the last 10 minutes – use that email. \"This Password does not match.\" Make both password fields identical. Changed your mind Click Cancel . "}, "03-Library/01-how-to-navigate-the-library": {"t": "Getting started with the Library", "j": "03-Library", "h": "<p>The Library is your Meridia home page. It holds the vessels, ports, zones and (if enabled for you) fleets you have saved, so you can open them in one click.<\/p>\n<h2>Steps<\/h2>\n<ol><li>Sign in. Meridia opens the <strong>Library<\/strong> (<code>/analytics/library<\/code>).<div class=\"shot\"><b>Screenshot 1<\/b> – Library page – header, tabs, search box, item count, List/Grid switch<\/div><\/li><li>Use the tabs under the header to switch between <strong>Vessels<\/strong>, <strong>Ports<\/strong> and <strong>Zones<\/strong>. A <strong>Fleets<\/strong> tab also appears if fleet management is enabled for your account.<\/li><li>Check the item count next to the search box (for example \"12 items\").<\/li><li>Click any card or row to open that vessel, port, zone or fleet.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>The Library only shows items you have added. A new account shows <strong>No items – Add items to your library to get started<\/strong> with a <strong>+ Add items<\/strong> button. See <a class=\"xref\" href=\"#/03-Library/02-how-to-add-to-library\">How to add a vessel, port or zone to your Library<\/a>.<\/li><li>The Library is available only to accounts and users that have the <strong>Meridia<\/strong> feature enabled. If it isn't enabled for you, you won't be able to see Meridia content. Contact your account administrator or Pole Star.<\/li><li>The selected tab is kept in the page address (<code>?tab=Vessels<\/code>), so you can bookmark a tab.<\/li><\/ul>", "x": " The Library is your Meridia home page. It holds the vessels, ports, zones and (if enabled for you) fleets you have saved, so you can open them in one click. Steps Sign in. Meridia opens the Library ( /analytics/library ). 📷 Screenshot 1: Library page – header, tabs, search box, item count, List/Grid switch Use the tabs under the header to switch between Vessels , Ports and Zones . A Fleets tab also appears if fleet management is enabled for your account. Check the item count next to the search box (for example \"12 items\"). Click any card or row to open that vessel, port, zone or fleet. Good to know The Library only shows items you have added. A new account shows No items – Add items to your library to get started with a + Add items button. See How to add a vessel, port or zone to your Library . The Library is available only to accounts and users that have the Meridia feature enabled. If it isn't enabled for you, you won't be able to see Meridia content. Contact your account administrator or Pole Star. The selected tab is kept in the page address ( ?tab=Vessels ), so you can bookmark a tab. "}, "03-Library/02-how-to-add-to-library": {"t": "How to add a vessel, port or zone to your Library", "j": "03-Library", "h": "<p>Find an item in Meridia and save it so it appears in your Library.<\/p>\n<h2>Steps<\/h2>\n<ol><li>On the <strong>Library<\/strong> page, click <strong>Add<\/strong> (top right). A menu opens.<div class=\"shot\"><b>Screenshot 1<\/b> – Add menu – Find and add: Vessel, Port, Zone / Create new: Fleet, Custom zone<\/div><\/li><li>Under <strong>Find and add<\/strong>, choose <strong>Vessel<\/strong>, <strong>Port<\/strong> or <strong>Zone<\/strong>. The search window opens.<ul><li>Shortcut: on an empty tab, click <strong>+ Add items<\/strong>.<\/li><\/ul><\/li><li>Check the correct tab is selected at the top of the window (<strong>Vessels<\/strong>, <strong>Ports<\/strong> or <strong>Zones<\/strong>).<div class=\"shot\"><b>Screenshot 2<\/b> – Search window – tabs, search-by dropdown, search box, Filters button<\/div><\/li><li><em>(Vessels and Ports only)<\/em> Choose what to search by in the dropdown to the left of the box:<ul><li><strong>Vessels:<\/strong> Name or IMO, MMSI, Call Sign<\/li><li><strong>Ports:<\/strong> Name, UN/LOCODE, WPI Number<\/li><\/ul><\/li><li>Type at least <strong>3 characters<\/strong> in the search box (zones search by name).<\/li><li>Click <strong>Add to Library<\/strong> next to the result you want. The button changes to <strong>Added to Library<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Result row with Add to Library button<\/div><\/li><li>Repeat for more items, then press <strong>Esc<\/strong> or click outside the window to close it. The item now appears in the Library.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>Clicking the result row itself (not the button) opens that vessel, port or zone page instead.<\/li><li>Results load as you scroll down the list.<\/li><li>To remove an item, open the same search, find it, and click <strong>Added to Library<\/strong> again. <strong><mark class=\"confirm\">[CONFIRM: other ways to remove]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"Enter a search term or select a filter\"<\/td><td>Type at least 3 characters or pick a country/flag filter.<\/td><\/tr><tr><td>\"No results found for …\"<\/td><td>Check spelling, try another search-by option, or clear filters.<\/td><\/tr><tr><td>Button shows a spinner<\/td><td>Wait a moment – the item is being saved.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Find an item in Meridia and save it so it appears in your Library. Steps On the Library page, click Add (top right). A menu opens. 📷 Screenshot 1: Add menu – Find and add: Vessel, Port, Zone / Create new: Fleet, Custom zone Under Find and add , choose Vessel , Port or Zone . The search window opens. Shortcut: on an empty tab, click + Add items . Check the correct tab is selected at the top of the window ( Vessels , Ports or Zones ). 📷 Screenshot 2: Search window – tabs, search-by dropdown, search box, Filters button (Vessels and Ports only) Choose what to search by in the dropdown to the left of the box: Vessels: Name or IMO, MMSI, Call Sign Ports: Name, UN/LOCODE, WPI Number Type at least 3 characters in the search box (zones search by name). Click Add to Library next to the result you want. The button changes to Added to Library . 📷 Screenshot 3: Result row with Add to Library button Repeat for more items, then press Esc or click outside the window to close it. The item now appears in the Library. Good to know Clicking the result row itself (not the button) opens that vessel, port or zone page instead. Results load as you scroll down the list. To remove an item, open the same search, find it, and click Added to Library again. [CONFIRM: other ways to remove] Troubleshooting Problem What to do \"Enter a search term or select a filter\" Type at least 3 characters or pick a country/flag filter. \"No results found for …\" Check spelling, try another search-by option, or clear filters. Button shows a spinner Wait a moment – the item is being saved. "}, "03-Library/03-how-to-use-search-filters": {"t": "How to narrow down search results with filters", "j": "03-Library", "h": "<p>Use filters in the Add window to find the right vessel, port or zone faster.<\/p>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Add<\/strong> → <strong>Vessel<\/strong>, <strong>Port<\/strong> or <strong>Zone<\/strong> (see <strong>How to add to your Library<\/strong>).<\/li><li>Click <strong>Filters<\/strong> next to the search box. The panel opens, and a number badge shows how many filters are active.<div class=\"shot\"><b>Screenshot 1<\/b> – Filters panel open for Vessels<\/div><\/li><li>Choose the filters you need:<ul><li><strong>Vessels:<\/strong> Flag, Type, Status, Deadweight (mt), Draught (m), Build Year (sliders)<\/li><li><strong>Ports:<\/strong> Country, Type, Sub Type<\/li><li><strong>Zones:<\/strong> Country, Type, Sub Type<\/li><\/ul><\/li><li>Review the results list – it updates as you change filters.<\/li><li>Click <strong>Reset All<\/strong> to clear every filter.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>Picking a <strong>Flag<\/strong> (vessels) or <strong>Country<\/strong> (ports, zones) is enough to show results without typing a search term.<\/li><li>Use the <strong>×<\/strong> in the search box to clear the text.<\/li><\/ul>", "x": " Use filters in the Add window to find the right vessel, port or zone faster. Steps Open Add → Vessel , Port or Zone (see How to add to your Library ). Click Filters next to the search box. The panel opens, and a number badge shows how many filters are active. 📷 Screenshot 1: Filters panel open for Vessels Choose the filters you need: Vessels: Flag, Type, Status, Deadweight (mt), Draught (m), Build Year (sliders) Ports: Country, Type, Sub Type Zones: Country, Type, Sub Type Review the results list – it updates as you change filters. Click Reset All to clear every filter. Good to know Picking a Flag (vessels) or Country (ports, zones) is enough to show results without typing a search term. Use the × in the search box to clear the text. "}, "03-Library/04-how-to-search-and-filter-your-library": {"t": "How to search your Library and change the view", "j": "03-Library", "h": "<h2>Search inside your Library<\/h2>\n<ol><li>Open the <strong>Library<\/strong> and select a tab.<\/li><li>Type in the search box. Matches are by:<ul><li><strong>Vessels:<\/strong> name or IMO<\/li><li><strong>Ports:<\/strong> name or UN/LOCODE<\/li><li><strong>Zones:<\/strong> name, sub type or type<\/li><li><strong>Fleets:<\/strong> name, number of vessels or description<\/li><\/ul><\/li><li>The item count updates. If nothing matches you'll see <strong>No matches – No entities match your search or filter<\/strong>.<\/li><\/ol>\n<h2>Switch between Grid and List<\/h2>\n<ol><li>Click <strong>Grid<\/strong> or <strong>List<\/strong> (top right of the Library).<div class=\"shot\"><b>Screenshot 1<\/b> – Grid view<\/div><div class=\"shot\"><b>Screenshot 2<\/b> – List view with columns<\/div><\/li><li>Your choice is remembered next time.<\/li><\/ol>\n<h2>What you'll see<\/h2>\n<ul><li><strong>Grid cards:<\/strong> name, country flag, IMO (vessels) / UN/LOCODE (ports) / sub type (zones), and a bell icon when notifications are active.<\/li><li><strong>List columns:<\/strong><\/li><\/ul>\n<p>- Vessels: Name, IMO Number, MMSI, Type, Flag<\/p>\n<p>- Ports: Name, Country, UNLOCODE, Sub Type, Notifications Enabled<\/p>\n<p>- Zones: Name, Country, Type, Sub Type, Notifications Enabled<\/p>\n<ul><li><strong>Pagination:<\/strong> use the page controls under the grid to change page or items per page (default 10).<\/li><\/ul>", "x": " Search inside your Library Open the Library and select a tab. Type in the search box. Matches are by: Vessels: name or IMO Ports: name or UN/LOCODE Zones: name, sub type or type Fleets: name, number of vessels or description The item count updates. If nothing matches you'll see No matches – No entities match your search or filter . Switch between Grid and List Click Grid or List (top right of the Library). 📷 Screenshot 1: Grid view 📷 Screenshot 2: List view with columns Your choice is remembered next time. What you'll see Grid cards: name, country flag, IMO (vessels) / UN/LOCODE (ports) / sub type (zones), and a bell icon when notifications are active. List columns: - Vessels: Name, IMO Number, MMSI, Type, Flag - Ports: Name, Country, UNLOCODE, Sub Type, Notifications Enabled - Zones: Name, Country, Type, Sub Type, Notifications Enabled Pagination: use the page controls under the grid to change page or items per page (default 10). "}, "04-Vessels/01-how-to-open-and-read-a-vessel-page": {"t": "How to open and read a vessel page", "j": "04-Vessels", "h": "<p>Open a vessel in Meridia to see its details, recent movements on a map, and its events.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>You need the vessel's IMO number or name, or the vessel must already be in your Library.<\/li><li>Some sections in the vessel details panel depend on your access. See Good to know.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Library<\/strong> from the main navigation.<\/li><li>Select the <strong>Vessels<\/strong> tab. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how a vessel is found or selected from this tab (search box, list rows) because that screen is outside this page's code.<div class=\"shot\"><b>Screenshot 1<\/b> – Library page with the Vessels tab selected<\/div><\/li><li>Select the vessel you want. The vessel page opens (its address ends with the vessel's IMO number).<div class=\"shot\"><b>Screenshot 2<\/b> – Vessel page showing the header, tabs and map<\/div><\/li><li>Check the header. It shows a flag, the vessel name, and a line with the IMO, flag country and vessel type.<\/li><li>Use the breadcrumbs <strong>Library<\/strong> &gt; <strong>Vessels<\/strong> above the name to go back.<\/li><li>Select the <strong>Overview<\/strong> tab to see the vessel details panel, the map, the replay bar and the toolbar.<\/li><li>In the vessel details panel, select a section heading to expand it. Sections are <strong>Next Port<\/strong>, <strong>PurpleTRAC screening<\/strong>, <strong>MTI score<\/strong>, <strong>Dimensions<\/strong>, <strong>Registry<\/strong> and <strong>Ownership<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Vessel details panel with the Dimensions section expanded<\/div><\/li><li>Select the <strong>Events<\/strong> tab to see the vessel's events in a table.<div class=\"shot\"><b>Screenshot 4<\/b> – Events tab showing event type groups<\/div><\/li><li>On the <strong>Events<\/strong> tab, choose an event type. The types are <strong>Area Arrival<\/strong>, <strong>Arrival<\/strong>, <strong>Departure<\/strong>, <strong>Area Departure<\/strong> (Port Events), <strong>Zone Entry<\/strong>, <strong>Zone Exit<\/strong> (Zone Events), and <strong>AIS Gap<\/strong>, <strong>STS Pairing<\/strong>, <strong>Positional Discrepancy<\/strong>, <strong>Port State Control<\/strong> (Other Events).<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You see the vessel's identity, its details, and its recent track and events.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The top section of the details panel always shows <strong>Type<\/strong>, <strong>IMO<\/strong>, <strong>MMSI<\/strong>, <strong>Flag<\/strong>, <strong>Callsign<\/strong> and <strong>Status<\/strong>. <strong>Flag since<\/strong> appears only when a date is available.<\/li><li>A dash (-) means no value is available for that field.<\/li><li><strong>Dimensions<\/strong> shows <strong>LOA<\/strong>, <strong>Beam<\/strong>, <strong>Draught<\/strong>, <strong>Gross tonnage<\/strong>, <strong>Deadweight<\/strong>, <strong>Displacement<\/strong> and <strong>Service speed<\/strong>.<\/li><li><strong>Registry<\/strong> shows <strong>Built<\/strong>, <strong>Shipbuilder<\/strong>, <strong>Country of build<\/strong>, <strong>Hull type<\/strong>, <strong>Port of registry<\/strong>, <strong>Classification<\/strong>, <strong>P&amp;I Club<\/strong> and <strong>DOC company<\/strong>.<\/li><li><strong>Ownership<\/strong> shows <strong>Operator<\/strong>, <strong>Registered owner<\/strong>, <strong>Technical manager<\/strong>, <strong>Ship manager<\/strong> and <strong>Group beneficial owner<\/strong>. A company search icon appears next to a company name.<\/li><li><strong>Next Port<\/strong> shows <strong>Destination<\/strong> and <strong>ETA<\/strong>. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the source and freshness of this data.<\/li><li><strong>PurpleTRAC screening<\/strong> and <strong>MTI score<\/strong> show an \"Unlock\" message with \"Available on request.\" if your account or user is not entitled to them. Hover over it and select <strong>More about PurpleTRAC<\/strong> or <strong>More about MTI<\/strong> for details and contact information. <strong><mark class=\"confirm\">[CONFIRM: the app shows a hover card with these links, not a Contact us box]<\/mark><\/strong><\/li><li>Open the three-dot menu in the header to choose <strong>Add to Library<\/strong> or <strong>Remove from Library<\/strong>.<\/li><li><strong>Ask IQ<\/strong> appears next to the tabs only if your account or user is entitled to Ask IQ.<\/li><li>The header shows a refresh control. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> its label; it reloads the date range used for the map.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A loading placeholder stays on screen<\/td><td>Wait a moment, then reload the page.<\/td><\/tr><tr><td>An error page appears instead of the vessel<\/td><td>Check the IMO number in the address, then try again. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exact error text.<\/td><\/tr><tr><td>A field shows a dash (-)<\/td><td>No value is held for that field.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Open a vessel in Meridia to see its details, recent movements on a map, and its events. Before you begin You need the vessel's IMO number or name, or the vessel must already be in your Library. Some sections in the vessel details panel depend on your access. See Good to know. Steps Open Library from the main navigation. Select the Vessels tab. [CONFIRM] how a vessel is found or selected from this tab (search box, list rows) because that screen is outside this page's code. 📷 Screenshot 1: Library page with the Vessels tab selected Select the vessel you want. The vessel page opens (its address ends with the vessel's IMO number). 📷 Screenshot 2: Vessel page showing the header, tabs and map Check the header. It shows a flag, the vessel name, and a line with the IMO, flag country and vessel type. Use the breadcrumbs Library > Vessels above the name to go back. Select the Overview tab to see the vessel details panel, the map, the replay bar and the toolbar. In the vessel details panel, select a section heading to expand it. Sections are Next Port , PurpleTRAC screening , MTI score , Dimensions , Registry and Ownership . 📷 Screenshot 3: Vessel details panel with the Dimensions section expanded Select the Events tab to see the vessel's events in a table. 📷 Screenshot 4: Events tab showing event type groups On the Events tab, choose an event type. The types are Area Arrival , Arrival , Departure , Area Departure (Port Events), Zone Entry , Zone Exit (Zone Events), and AIS Gap , STS Pairing , Positional Discrepancy , Port State Control (Other Events). Expected result You see the vessel's identity, its details, and its recent track and events. Good to know The top section of the details panel always shows Type , IMO , MMSI , Flag , Callsign and Status . Flag since appears only when a date is available. A dash (-) means no value is available for that field. Dimensions shows LOA , Beam , Draught , Gross tonnage , Deadweight , Displacement and Service speed . Registry shows Built , Shipbuilder , Country of build , Hull type , Port of registry , Classification , P&I Club and DOC company . Ownership shows Operator , Registered owner , Technical manager , Ship manager and Group beneficial owner . A company search icon appears next to a company name. Next Port shows Destination and ETA . [CONFIRM] the source and freshness of this data. PurpleTRAC screening and MTI score show an \"Unlock\" message with \"Available on request.\" if your account or user is not entitled to them. Hover over it and select More about PurpleTRAC or More about MTI for details and contact information. [CONFIRM: the app shows a hover card with these links, not a Contact us box] Open the three-dot menu in the header to choose Add to Library or Remove from Library . Ask IQ appears next to the tabs only if your account or user is entitled to Ask IQ. The header shows a refresh control. [CONFIRM] its label; it reloads the date range used for the map. Troubleshooting Problem What to do A loading placeholder stays on screen Wait a moment, then reload the page. An error page appears instead of the vessel Check the IMO number in the address, then try again. [CONFIRM] exact error text. A field shows a dash (-) No value is held for that field. "}, "04-Vessels/02-how-to-switch-between-vessels": {"t": "How to switch between vessels", "j": "04-Vessels", "h": "<p>Change to another vessel without going back to the Library.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open any vessel page first. See \"How to open and read a vessel page\".<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the vessel name at the top of the page, next to the up-and-down arrows icon.<div class=\"shot\"><b>Screenshot 1<\/b> – Vessel name button in the page header<\/div><\/li><li>In the box that opens, the <strong>Recent<\/strong> tab is shown first. Select a vessel from the list to open it.<div class=\"shot\"><b>Screenshot 2<\/b> – Switcher open with the Recent tab<\/div><\/li><li>To find a vessel not in the list, type in the <strong>Search vessels…<\/strong> box. Enter at least two characters of a name or IMO number.<\/li><li>Wait about one second. Matching vessels appear under <strong>Results<\/strong>.<\/li><li>Select a result to open that vessel.<div class=\"shot\"><b>Screenshot 3<\/b> – Search results under Results<\/div><\/li><li>To pick from your saved vessels, select the <strong>Library<\/strong> tab.<\/li><li>Type in the <strong>Filter saved…<\/strong> box to narrow the list, then select a vessel.<div class=\"shot\"><b>Screenshot 4<\/b> – Library tab with saved vessels<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The page opens the selected vessel, and the map and replay start fresh for it.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Each entry shows a flag, the vessel name, the vessel type and its IMO number.<\/li><li><strong>Recent<\/strong> keeps your last 6 vessels, most recent first. The list is stored in your browser, so it is not shared across browsers or devices.<\/li><li>The vessel you are viewing is highlighted in <strong>Recent<\/strong> and <strong>Library<\/strong>, and is left out of search results.<\/li><li>The <strong>Library<\/strong> tab shows up to 20 vessels you have added to your Library. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> whether vessels beyond 20 are expected to be listed.<\/li><li>Press <strong>Esc<\/strong> or click outside the box to close it without switching.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"No recent vessels\"<\/td><td>Open a few vessels first; they are added automatically.<\/td><\/tr><tr><td>\"No vessels found\"<\/td><td>Check the spelling or try the IMO number.<\/td><\/tr><tr><td>\"No saved vessels\"<\/td><td>Add vessels to your Library with <strong>Add to Library<\/strong> from the three-dot menu in the header.<\/td><\/tr><tr><td>No results appear while typing<\/td><td>Enter at least two characters and wait a moment.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Change to another vessel without going back to the Library. Before you begin Open any vessel page first. See \"How to open and read a vessel page\". Steps Select the vessel name at the top of the page, next to the up-and-down arrows icon. 📷 Screenshot 1: Vessel name button in the page header In the box that opens, the Recent tab is shown first. Select a vessel from the list to open it. 📷 Screenshot 2: Switcher open with the Recent tab To find a vessel not in the list, type in the Search vessels… box. Enter at least two characters of a name or IMO number. Wait about one second. Matching vessels appear under Results . Select a result to open that vessel. 📷 Screenshot 3: Search results under Results To pick from your saved vessels, select the Library tab. Type in the Filter saved… box to narrow the list, then select a vessel. 📷 Screenshot 4: Library tab with saved vessels Expected result The page opens the selected vessel, and the map and replay start fresh for it. Good to know Each entry shows a flag, the vessel name, the vessel type and its IMO number. Recent keeps your last 6 vessels, most recent first. The list is stored in your browser, so it is not shared across browsers or devices. The vessel you are viewing is highlighted in Recent and Library , and is left out of search results. The Library tab shows up to 20 vessels you have added to your Library. [CONFIRM] whether vessels beyond 20 are expected to be listed. Press Esc or click outside the box to close it without switching. Troubleshooting Problem What to do \"No recent vessels\" Open a few vessels first; they are added automatically. \"No vessels found\" Check the spelling or try the IMO number. \"No saved vessels\" Add vessels to your Library with Add to Library from the three-dot menu in the header. No results appear while typing Enter at least two characters and wait a moment. "}, "04-Vessels/03-how-to-view-vessel-details-and-save-a-vessel": {"t": "How to view vessel details, save a vessel and use Ask IQ", "j": "04-Vessels", "h": "<p>Use the vessel page to see a vessel's particulars, switch to another vessel, save it to your Library and start an Ask IQ question.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a vessel from the Library (<strong>Library<\/strong> &gt; <strong>Vessels<\/strong>) or by searching. The page is at an address ending in /analytics/vessel/ followed by the vessel ID.<\/li><li><strong>Ask IQ<\/strong> appears only if your account or user is entitled to it.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the vessel. The header shows the vessel name, and below it the IMO, flag and vessel type.<div class=\"shot\"><b>Screenshot 1<\/b> – Vessel page header with breadcrumbs, name and subtitle<\/div><\/li><li>Make sure the <strong>Overview<\/strong> tab is selected. The other tab is <strong>Events<\/strong>.<\/li><li>In the left-hand panel, read the top rows: <strong>Type<\/strong>, <strong>IMO<\/strong>, <strong>MMSI<\/strong>, <strong>Flag<\/strong>, <strong>Flag since<\/strong> (only when known), <strong>Callsign<\/strong> and <strong>Status<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Vessel details panel identity rows<\/div><\/li><li>Select a section name to expand it: <strong>Next Port<\/strong>, <strong>Dimensions<\/strong>, <strong>Registry<\/strong> or <strong>Ownership<\/strong>. Select it again to collapse.<\/li><li>In <strong>Next Port<\/strong>, read <strong>Destination<\/strong> and <strong>ETA<\/strong>.<\/li><li>In <strong>Dimensions<\/strong>, read <strong>LOA<\/strong>, <strong>Beam<\/strong>, <strong>Draught<\/strong>, <strong>Gross tonnage<\/strong>, <strong>Deadweight<\/strong>, <strong>Displacement<\/strong> and <strong>Service speed<\/strong>.<\/li><li>In <strong>Registry<\/strong>, read <strong>Built<\/strong>, <strong>Shipbuilder<\/strong>, <strong>Country of build<\/strong>, <strong>Hull type<\/strong>, <strong>Port of registry<\/strong>, <strong>Classification<\/strong>, <strong>P&amp;I Club<\/strong> and <strong>DOC company<\/strong>.<\/li><li>In <strong>Ownership<\/strong>, read <strong>Operator<\/strong>, <strong>Registered owner<\/strong>, <strong>Technical manager<\/strong>, <strong>Ship manager<\/strong> and <strong>Group beneficial owner<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Ownership section expanded<\/div><\/li><li>To switch vessel, select the vessel name at the top. Use the search box (<strong>Search vessels…<\/strong>) or the <strong>Recent<\/strong> and <strong>Library<\/strong> tabs, then select a vessel.<\/li><li>To save the vessel, select the three-dot menu at the top right and choose <strong>Add to Library<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Three-dot menu showing Add to Library<\/div><\/li><li>To remove it, open the same menu and choose <strong>Remove from Library<\/strong>.<\/li><li>To start a question about the vessel, select <strong>Ask IQ<\/strong> next to the tabs.<div class=\"shot\"><b>Screenshot 5<\/b> – Ask IQ button beside the Overview and Events tabs<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>After saving or removing, a message confirms the change, for example \"[vessel name] added to bookmarks\" or \"removed from bookmarks\". Ask IQ opens with a ready-made prompt asking for a 30-day summary of the vessel: voyage status, port calls, zone events, AIS gaps and anything notable.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Empty values show a dash (-). Hover over a value to see the full text.<\/li><li>Next to each ownership name is a company search icon. <strong><mark class=\"confirm\">[CONFIRM: what the company search shows]<\/mark><\/strong><\/li><li>Hide or show the left panel with the ship icon (<strong>Hide Vessel Details<\/strong> / <strong>Show Vessel Details<\/strong>) in the map toolbar.<\/li><li>No notification or subscription setting is shown on the vessel page. <strong><mark class=\"confirm\">[CONFIRM: whether vessel alerts exist elsewhere]<\/mark><\/strong><\/li><li>No export button appears on the vessel page in this code. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li>Data sources and refresh frequency for these fields are not shown. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Error page instead of the vessel<\/td><td>Refresh the page or return to the <strong>Library<\/strong> and reopen the vessel.<\/td><\/tr><tr><td><strong>Ask IQ<\/strong> is missing<\/td><td>Your account may not include it. Contact your administrator.<\/td><\/tr><tr><td>Add or remove does not work<\/td><td>Wait for the menu button to finish loading, then try again.<\/td><\/tr><tr><td>A field shows -<\/td><td>No data is held for that field.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the vessel page to see a vessel's particulars, switch to another vessel, save it to your Library and start an Ask IQ question. Before you begin Open a vessel from the Library ( Library > Vessels ) or by searching. The page is at an address ending in /analytics/vessel/ followed by the vessel ID. Ask IQ appears only if your account or user is entitled to it. Steps Open the vessel. The header shows the vessel name, and below it the IMO, flag and vessel type. 📷 Screenshot 1: Vessel page header with breadcrumbs, name and subtitle Make sure the Overview tab is selected. The other tab is Events . In the left-hand panel, read the top rows: Type , IMO , MMSI , Flag , Flag since (only when known), Callsign and Status . 📷 Screenshot 2: Vessel details panel identity rows Select a section name to expand it: Next Port , Dimensions , Registry or Ownership . Select it again to collapse. In Next Port , read Destination and ETA . In Dimensions , read LOA , Beam , Draught , Gross tonnage , Deadweight , Displacement and Service speed . In Registry , read Built , Shipbuilder , Country of build , Hull type , Port of registry , Classification , P&I Club and DOC company . In Ownership , read Operator , Registered owner , Technical manager , Ship manager and Group beneficial owner . 📷 Screenshot 3: Ownership section expanded To switch vessel, select the vessel name at the top. Use the search box ( Search vessels… ) or the Recent and Library tabs, then select a vessel. To save the vessel, select the three-dot menu at the top right and choose Add to Library . 📷 Screenshot 4: Three-dot menu showing Add to Library To remove it, open the same menu and choose Remove from Library . To start a question about the vessel, select Ask IQ next to the tabs. 📷 Screenshot 5: Ask IQ button beside the Overview and Events tabs Expected result After saving or removing, a message confirms the change, for example \"[vessel name] added to bookmarks\" or \"removed from bookmarks\". Ask IQ opens with a ready-made prompt asking for a 30-day summary of the vessel: voyage status, port calls, zone events, AIS gaps and anything notable. Good to know Empty values show a dash (-). Hover over a value to see the full text. Next to each ownership name is a company search icon. [CONFIRM: what the company search shows] Hide or show the left panel with the ship icon ( Hide Vessel Details / Show Vessel Details ) in the map toolbar. No notification or subscription setting is shown on the vessel page. [CONFIRM: whether vessel alerts exist elsewhere] No export button appears on the vessel page in this code. [CONFIRM] Data sources and refresh frequency for these fields are not shown. [CONFIRM] Troubleshooting Problem What to do Error page instead of the vessel Refresh the page or return to the Library and reopen the vessel. Ask IQ is missing Your account may not include it. Contact your administrator. Add or remove does not work Wait for the menu button to finish loading, then try again. A field shows - No data is held for that field. "}, "04-Vessels/04-how-to-view-a-vessels-track-on-the-map": {"t": "How to view a vessel's track on the map", "j": "04-Vessels", "h": "<p>See where a vessel has been and what happened along the way, for a period you choose.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open the vessel page and stay on the <strong>Overview<\/strong> tab.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Look at the map. The vessel's track is drawn as a coloured line and events appear as round markers.<div class=\"shot\"><b>Screenshot 1<\/b> – Overview map with track and event markers<\/div><\/li><li>Select the date button in the toolbar above the map. It shows <strong>Previous 30 days<\/strong> by default.<\/li><li>Choose <strong>Previous 7 days<\/strong>, <strong>Previous 14 days<\/strong>, <strong>Previous 30 days<\/strong> or <strong>Previous 90 days<\/strong>.<\/li><li>For your own dates, choose <strong>Custom range...<\/strong> instead.<\/li><li>Pick a <strong>Start date<\/strong> and an <strong>End date<\/strong>.<\/li><li>Select <strong>Apply<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Date menu with Custom range open<\/div><\/li><li>Open the <strong>Legend<\/strong> box at the top left of the map.<\/li><li>Under <strong>Track<\/strong>, choose <strong>Nav<\/strong> or <strong>Speed<\/strong> to change how the line is coloured.<\/li><li>Under <strong>Events<\/strong>, tick or untick event types, or use <strong>Show / Hide All<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Legend open showing Events and Track<\/div><\/li><li>Hover over a marker to see its details. Click it to keep the details open.<\/li><li>Select the map style button at the top right (<strong>Toggle Map Styles<\/strong>) to open <strong>Map Style<\/strong>.<\/li><li>Choose <strong>Simple<\/strong>, <strong>Satellite<\/strong> or <strong>C-MAP<\/strong>, and switch <strong>Grid / Graticules<\/strong> on or off.<div class=\"shot\"><b>Screenshot 4<\/b> – Map Style panel<\/div><\/li><li>Use the toolbar's ship icon (<strong>Hide Vessel Details<\/strong> / <strong>Show Vessel Details<\/strong>) to hide or show the left panel.<\/li><li>Use the list icon (<strong>Show Event Timeline<\/strong> / <strong>Hide Event Timeline<\/strong>) to open the event list on the right.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The map shows the track and events for your chosen dates.<\/p>\n<h2>Good to know<\/h2>\n<ul><li><strong>Nav<\/strong> colours: <strong>Underway<\/strong>, <strong>Moored / Anchored<\/strong>, <strong>Other<\/strong>. <strong>Speed<\/strong> colours: <strong>Stopped (&lt; 0.1 kn)<\/strong>, <strong>Slow (0.1–5 kn)<\/strong>, <strong>Medium (5–15 kn)<\/strong>, <strong>Fast (≥ 15 kn)<\/strong>. A dashed line is <strong>AIS Gap<\/strong>.<\/li><li>Event types: <strong>Port Arrival<\/strong>, <strong>Port Departure<\/strong>, <strong>Zone Entry<\/strong>, <strong>Zone Exit<\/strong>, <strong>AIS Gap<\/strong>, <strong>STS Pairing<\/strong>, <strong>Discrepancy<\/strong>, <strong>PSC<\/strong>. A type with no events in the period is greyed out (\"events not available\").<\/li><li>Custom dates must lie within the last two years and cannot span more than two years. <strong>Apply<\/strong> stays off until they are valid.<\/li><li>The toolbar shows the vessel's next port and <strong>ETA<\/strong> when available. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> data source.<\/li><li><strong>Enter focus mode<\/strong> (the expand icon, or Ctrl+/ or Cmd+/) hides panels so the map fills the page.<\/li><li>The <strong>Event Timeline<\/strong> panel has a <strong>Search events...<\/strong> box.<\/li><li>A <strong>Loading<\/strong> / <strong>Loaded<\/strong> note appears near the Legend while data loads. The <strong>Draught<\/strong> colour option is greyed out (\"Coming soon\").<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>No track appears<\/td><td>Try a longer period. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how vessels with no positions are shown.<\/td><\/tr><tr><td>The replay bar says \"No data available for selected range\"<\/td><td>Choose a different date range.<\/td><\/tr><tr><td>Date message \"Date range cannot exceed two years from current date.\"<\/td><td>Pick dates within two years.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " See where a vessel has been and what happened along the way, for a period you choose. Before you begin Open the vessel page and stay on the Overview tab. Steps Look at the map. The vessel's track is drawn as a coloured line and events appear as round markers. 📷 Screenshot 1: Overview map with track and event markers Select the date button in the toolbar above the map. It shows Previous 30 days by default. Choose Previous 7 days , Previous 14 days , Previous 30 days or Previous 90 days . For your own dates, choose Custom range... instead. Pick a Start date and an End date . Select Apply . 📷 Screenshot 2: Date menu with Custom range open Open the Legend box at the top left of the map. Under Track , choose Nav or Speed to change how the line is coloured. Under Events , tick or untick event types, or use Show / Hide All . 📷 Screenshot 3: Legend open showing Events and Track Hover over a marker to see its details. Click it to keep the details open. Select the map style button at the top right ( Toggle Map Styles ) to open Map Style . Choose Simple , Satellite or C-MAP , and switch Grid / Graticules on or off. 📷 Screenshot 4: Map Style panel Use the toolbar's ship icon ( Hide Vessel Details / Show Vessel Details ) to hide or show the left panel. Use the list icon ( Show Event Timeline / Hide Event Timeline ) to open the event list on the right. Expected result The map shows the track and events for your chosen dates. Good to know Nav colours: Underway , Moored / Anchored , Other . Speed colours: Stopped (< 0.1 kn) , Slow (0.1–5 kn) , Medium (5–15 kn) , Fast (≥ 15 kn) . A dashed line is AIS Gap . Event types: Port Arrival , Port Departure , Zone Entry , Zone Exit , AIS Gap , STS Pairing , Discrepancy , PSC . A type with no events in the period is greyed out (\"events not available\"). Custom dates must lie within the last two years and cannot span more than two years. Apply stays off until they are valid. The toolbar shows the vessel's next port and ETA when available. [CONFIRM] data source. Enter focus mode (the expand icon, or Ctrl+/ or Cmd+/) hides panels so the map fills the page. The Event Timeline panel has a Search events... box. A Loading / Loaded note appears near the Legend while data loads. The Draught colour option is greyed out (\"Coming soon\"). Troubleshooting Problem What to do No track appears Try a longer period. [CONFIRM] how vessels with no positions are shown. The replay bar says \"No data available for selected range\" Choose a different date range. Date message \"Date range cannot exceed two years from current date.\" Pick dates within two years. "}, "04-Vessels/05-how-to-replay-a-vessels-movements": {"t": "How to replay a vessel's movements", "j": "04-Vessels", "h": "<p>Play back the vessel's journey over your chosen dates and see events as they happen.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open the vessel's <strong>Overview<\/strong> tab and choose a date range. See \"How to view a vessel's track on the map\".<\/li><li>The replay bar is only active when there are events in the period.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Find the replay bar under the map.<div class=\"shot\"><b>Screenshot 1<\/b> – Replay bar under the map<\/div><\/li><li>Select <strong>Play<\/strong> to start the replay. The vessel marker moves along the track.<\/li><li>Select <strong>Pause<\/strong> to stop.<\/li><li>Select a speed: <strong>1×<\/strong>, <strong>2×<\/strong>, <strong>5×<\/strong> or <strong>10×<\/strong>.<\/li><li>Drag the slider to jump to any time. The current date and time show beside the controls.<div class=\"shot\"><b>Screenshot 2<\/b> – Slider with event tick marks<\/div><\/li><li>Select <strong>Skip to start<\/strong> or <strong>Skip to end<\/strong> to go to either end.<\/li><li>Select <strong>Follow vessel<\/strong> to keep the map centred on the vessel.<\/li><li>Select <strong>Pause at events<\/strong> so the replay stops when it reaches an event.<\/li><li>When it pauses, read the event card beside the Legend. It lists the event type, description and time.<div class=\"shot\"><b>Screenshot 3<\/b> – Event card during a replay pause<\/div><\/li><li>Select <strong>Pause countdown<\/strong> to hold the card open, or <strong>Dismiss<\/strong> to close it and continue.<\/li><li>Select <strong>Show detailed timeline<\/strong> to open a timeline under the bar. Select <strong>Hide detailed timeline<\/strong> to close it.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The replay runs through the period and, with <strong>Pause at events<\/strong> on, stops briefly at each event.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>Small marks on the slider show events. Marks turn bolder once passed.<\/li><li>The event card closes by itself after about 4.5 seconds and the replay resumes.<\/li><li>Keyboard: Space plays or pauses, Left and Right arrows step, Home and End jump to start or end, Esc resets.<\/li><li>Only event types ticked in the <strong>Legend<\/strong> pause the replay.<\/li><li>Dragging the slider pauses playback. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> whether the replay restarts from the dragged point.<\/li><li>Changing the date range resets the replay.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Controls are greyed out<\/td><td>There are no events in the period. Choose a longer date range.<\/td><\/tr><tr><td>Replay does not stop at events<\/td><td>Turn on <strong>Pause at events<\/strong> and tick event types in the <strong>Legend<\/strong>.<\/td><\/tr><tr><td>Replay seems stuck<\/td><td>Select <strong>Play<\/strong> again, or <strong>Skip to start<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Play back the vessel's journey over your chosen dates and see events as they happen. Before you begin Open the vessel's Overview tab and choose a date range. See \"How to view a vessel's track on the map\". The replay bar is only active when there are events in the period. Steps Find the replay bar under the map. 📷 Screenshot 1: Replay bar under the map Select Play to start the replay. The vessel marker moves along the track. Select Pause to stop. Select a speed: 1× , 2× , 5× or 10× . Drag the slider to jump to any time. The current date and time show beside the controls. 📷 Screenshot 2: Slider with event tick marks Select Skip to start or Skip to end to go to either end. Select Follow vessel to keep the map centred on the vessel. Select Pause at events so the replay stops when it reaches an event. When it pauses, read the event card beside the Legend. It lists the event type, description and time. 📷 Screenshot 3: Event card during a replay pause Select Pause countdown to hold the card open, or Dismiss to close it and continue. Select Show detailed timeline to open a timeline under the bar. Select Hide detailed timeline to close it. Expected result The replay runs through the period and, with Pause at events on, stops briefly at each event. Good to know Small marks on the slider show events. Marks turn bolder once passed. The event card closes by itself after about 4.5 seconds and the replay resumes. Keyboard: Space plays or pauses, Left and Right arrows step, Home and End jump to start or end, Esc resets. Only event types ticked in the Legend pause the replay. Dragging the slider pauses playback. [CONFIRM] whether the replay restarts from the dragged point. Changing the date range resets the replay. Troubleshooting Problem What to do Controls are greyed out There are no events in the period. Choose a longer date range. Replay does not stop at events Turn on Pause at events and tick event types in the Legend . Replay seems stuck Select Play again, or Skip to start . "}, "04-Vessels/06-how-to-read-the-event-timeline": {"t": "How to read the event timeline and Gantt chart", "j": "04-Vessels", "h": "<p>Use the <strong>Events Timeline<\/strong> list and the detailed Gantt chart on a vessel's <strong>Overview<\/strong> tab to see what a vessel did, and when, across the date range you choose.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a vessel page (<code>/analytics/vessel/:id<\/code>) and stay on the <strong>Overview<\/strong> tab. Both views sit beside and below the map.<\/li><li>Both views show the same events and use the same date range. Events come from port calls, zone events, AIS gaps, STS pairings, positional discrepancies and Port State Control inspections. <strong><mark class=\"confirm\">[CONFIRM: exact event sources and how often they refresh]<\/mark><\/strong><\/li><li>Times in both views are shown in UTC.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the toolbar above the map, open the date-range button (it reads, for example, <strong>Previous 30 days<\/strong>, or <strong>Custom range<\/strong>) and choose <strong>Previous 7 days<\/strong>, <strong>Previous 14 days<\/strong>, <strong>Previous 30 days<\/strong>, <strong>Previous 90 days<\/strong> or <strong>Custom range...<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Date range menu open in the vessel toolbar<\/div><\/li><li>For a custom range, pick a <strong>Start date<\/strong> and an <strong>End date<\/strong>, then select <strong>Apply<\/strong>.<\/li><li>To show or hide the event list, select the list icon at the right of the toolbar (tooltip <strong>Show Event Timeline<\/strong> or <strong>Hide Event Timeline<\/strong>).<div class=\"shot\"><b>Screenshot 2<\/b> – Events Timeline panel beside the map<\/div><\/li><li>In the <strong>Events Timeline<\/strong> panel, events are grouped under a date heading with a count. Select a date heading to collapse or expand that day.<\/li><li>To collapse every day at once, select the double-arrow button beside the search box (tooltip <strong>Collapse<\/strong> or <strong>Expand<\/strong>).<\/li><li>To change the order, select the arrow button at the top of the panel (tooltip <strong>Oldest first<\/strong> or <strong>Newest first<\/strong>).<\/li><li>To find an event, type in <strong>Search events...<\/strong>. It matches the event name and its type.<\/li><li>Select an event in the list to highlight it. Select it again to clear the highlight.<div class=\"shot\"><b>Screenshot 3<\/b> – A highlighted event in the list<\/div><\/li><li>To open the Gantt chart, select the chart icon at the rig

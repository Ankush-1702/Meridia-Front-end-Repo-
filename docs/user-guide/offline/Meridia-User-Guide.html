ht end of the bar below the map (tooltip <strong>Show detailed timeline<\/strong>). Select it again (<strong>Hide detailed timeline<\/strong>) to close it.<div class=\"shot\"><b>Screenshot 4<\/b> – Gantt chart open below the map<\/div><\/li><li>In the left-hand column, choose <strong>Group by<\/strong> <strong>Type<\/strong> or <strong>Location<\/strong> to change how the rows are organised.<\/li><li>Select a group heading (for example <strong>PORT<\/strong> or <strong>ZONE EVENTS<\/strong>) to collapse its rows. A collapsed heading shows the number of rows inside it.<\/li><li>Hover over a bar to see a pop-up with the event category, name, <strong>Started<\/strong>, <strong>Ended<\/strong> and <strong>Duration<\/strong>.<div class=\"shot\"><b>Screenshot 5<\/b> – Hover pop-up on a Gantt bar<\/div><\/li><li>Select a bar to highlight it. The same event is highlighted in the <strong>Events Timeline<\/strong> list, and the reverse. Select it again to clear.<\/li><li>To make the chart taller or shorter, drag the thin bar above the replay controls (labelled <strong>Resize Gantt panel<\/strong>). With the keyboard, use the Up and Down arrow keys.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<ul><li>The list shows one entry per event: a coloured round icon, the event type, the place or label, and the UTC time. Between entries, a grey strip shows the time gap when it is longer than one minute.<\/li><li>The Gantt chart draws one row per place or event type, with time running left to right along the top.<\/li><\/ul>\n<h2>Good to know<\/h2>\n<ul><li>Colours (same in both views and the map <strong>Legend<\/strong>): Port Arrival and Port Departure are teal, Zone Entry and Zone Exit are dark blue, STS Pairing is purple, Discrepancy is yellow, PSC is pink and AIS Gap is red.<\/li><li>A long bar is a period of time. A thin vertical mark is a single moment, or an event shorter than one minute. Wide bars show their duration (for example 6.5h or 2.0d) and, if wide enough, the place name.<\/li><li>Arrival and departure events at the same place are joined into one bar, and so are zone entry and exit. An arrival with no matching departure appears as a thin mark. <strong><mark class=\"confirm\">[CONFIRM: how an arrival still in progress is intended to look]<\/mark><\/strong><\/li><li>With <strong>Group by Type<\/strong>, rows are organised as PORT AREA, PORT and BERTH, then ZONE EVENTS, AIS GAP, STS PAIRING, DISCREPANCY and PSC. With <strong>Group by Location<\/strong>, each place gets its own heading with Port Area, Port, Berth or Zone rows underneath.<\/li><li>Which events appear is controlled by the checkboxes in the map <strong>Legend<\/strong> (<strong>Events<\/strong>, with <strong>Show / Hide All<\/strong>). Hidden types disappear from the list and the chart. An event type with no events in the range is greyed out.<\/li><li>A dashed amber line labelled <strong>ETA<\/strong> shows the vessel's reported arrival time and destination, when it falls inside the visible range.<\/li><li>When you play a replay, an orange line marks the replay position. Events that have not happened yet are faded, and the list shows <strong>Replay active. Events will appear here as they occur.<\/strong> until the first one occurs.<\/li><li>There are no zoom buttons. The chart spaces days automatically for the range you choose (a short range is stretched out, a long range is compressed). Scroll sideways and up or down to move around. <strong><mark class=\"confirm\">[CONFIRM: whether zoom controls are planned]<\/mark><\/strong><\/li><li>Long place names are shortened in the left-hand column. Hover over the name to see it in full.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>The Gantt chart area says <strong>No events to display<\/strong><\/td><td>Widen the date range or turn event types back on in the <strong>Legend<\/strong>.<\/td><\/tr><tr><td>The list says <strong>No events in selected range<\/strong><\/td><td>Choose a longer period, for example <strong>Previous 90 days<\/strong>.<\/td><\/tr><tr><td>The list says <strong>No matching events<\/strong><\/td><td>Clear the <strong>Search events...<\/strong> box.<\/td><\/tr><tr><td>I cannot select a <strong>Custom range<\/strong><\/td><td>The range cannot start more than two years ago or end in the future, and the end must not be before the start. The menu shows <strong>Date range cannot exceed two years from current date.<\/strong><\/td><\/tr><tr><td>The <strong>Apply<\/strong> button is greyed out<\/td><td>Both a start and an end date are needed and must be valid.<\/td><\/tr><tr><td>An event type is greyed out in the <strong>Legend<\/strong><\/td><td>There are no events of that type in the selected range.<\/td><\/tr><tr><td>The Gantt chart button is greyed or does nothing<\/td><td>The replay bar is disabled when the vessel has no events in the range. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Events Timeline list and the detailed Gantt chart on a vessel's Overview tab to see what a vessel did, and when, across the date range you choose. Before you begin Open a vessel page ( /analytics/vessel/:id ) and stay on the Overview tab. Both views sit beside and below the map. Both views show the same events and use the same date range. Events come from port calls, zone events, AIS gaps, STS pairings, positional discrepancies and Port State Control inspections. [CONFIRM: exact event sources and how often they refresh] Times in both views are shown in UTC. Steps In the toolbar above the map, open the date-range button (it reads, for example, Previous 30 days , or Custom range ) and choose Previous 7 days , Previous 14 days , Previous 30 days , Previous 90 days or Custom range... . 📷 Screenshot 1: Date range menu open in the vessel toolbar For a custom range, pick a Start date and an End date , then select Apply . To show or hide the event list, select the list icon at the right of the toolbar (tooltip Show Event Timeline or Hide Event Timeline ). 📷 Screenshot 2: Events Timeline panel beside the map In the Events Timeline panel, events are grouped under a date heading with a count. Select a date heading to collapse or expand that day. To collapse every day at once, select the double-arrow button beside the search box (tooltip Collapse or Expand ). To change the order, select the arrow button at the top of the panel (tooltip Oldest first or Newest first ). To find an event, type in Search events... . It matches the event name and its type. Select an event in the list to highlight it. Select it again to clear the highlight. 📷 Screenshot 3: A highlighted event in the list To open the Gantt chart, select the chart icon at the right end of the bar below the map (tooltip Show detailed timeline ). Select it again ( Hide detailed timeline ) to close it. 📷 Screenshot 4: Gantt chart open below the map In the left-hand column, choose Group by Type or Location to change how the rows are organised. Select a group heading (for example PORT or ZONE EVENTS ) to collapse its rows. A collapsed heading shows the number of rows inside it. Hover over a bar to see a pop-up with the event category, name, Started , Ended and Duration . 📷 Screenshot 5: Hover pop-up on a Gantt bar Select a bar to highlight it. The same event is highlighted in the Events Timeline list, and the reverse. Select it again to clear. To make the chart taller or shorter, drag the thin bar above the replay controls (labelled Resize Gantt panel ). With the keyboard, use the Up and Down arrow keys. Expected result The list shows one entry per event: a coloured round icon, the event type, the place or label, and the UTC time. Between entries, a grey strip shows the time gap when it is longer than one minute. The Gantt chart draws one row per place or event type, with time running left to right along the top. Good to know Colours (same in both views and the map Legend ): Port Arrival and Port Departure are teal, Zone Entry and Zone Exit are dark blue, STS Pairing is purple, Discrepancy is yellow, PSC is pink and AIS Gap is red. A long bar is a period of time. A thin vertical mark is a single moment, or an event shorter than one minute. Wide bars show their duration (for example 6.5h or 2.0d) and, if wide enough, the place name. Arrival and departure events at the same place are joined into one bar, and so are zone entry and exit. An arrival with no matching departure appears as a thin mark. [CONFIRM: how an arrival still in progress is intended to look] With Group by Type , rows are organised as PORT AREA, PORT and BERTH, then ZONE EVENTS, AIS GAP, STS PAIRING, DISCREPANCY and PSC. With Group by Location , each place gets its own heading with Port Area, Port, Berth or Zone rows underneath. Which events appear is controlled by the checkboxes in the map Legend ( Events , with Show / Hide All ). Hidden types disappear from the list and the chart. An event type with no events in the range is greyed out. A dashed amber line labelled ETA shows the vessel's reported arrival time and destination, when it falls inside the visible range. When you play a replay, an orange line marks the replay position. Events that have not happened yet are faded, and the list shows Replay active. Events will appear here as they occur. until the first one occurs. There are no zoom buttons. The chart spaces days automatically for the range you choose (a short range is stretched out, a long range is compressed). Scroll sideways and up or down to move around. [CONFIRM: whether zoom controls are planned] Long place names are shortened in the left-hand column. Hover over the name to see it in full. Troubleshooting Problem What to do The Gantt chart area says No events to display Widen the date range or turn event types back on in the Legend . The list says No events in selected range Choose a longer period, for example Previous 90 days . The list says No matching events Clear the Search events... box. I cannot select a Custom range The range cannot start more than two years ago or end in the future, and the end must not be before the start. The menu shows Date range cannot exceed two years from current date. The Apply button is greyed out Both a start and an end date are needed and must be valid. An event type is greyed out in the Legend There are no events of that type in the selected range. The Gantt chart button is greyed or does nothing The replay bar is disabled when the vessel has no events in the range. [CONFIRM] "}, "04-Vessels/07-how-to-view-and-filter-vessel-events": {"t": "How to view and filter vessel events", "j": "04-Vessels", "h": "<p>Use the <strong>Events<\/strong> tab on a vessel page to see a table of that vessel's recent port, zone and other events, and to filter, search, sort and export them.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a vessel page (<code>/analytics/vessel/:id<\/code>).<\/li><li>The table covers the last 90 days only. It has no date picker. Use <strong>Export<\/strong> for other periods.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Events<\/strong> tab, next to <strong>Overview<\/strong>.<div class=\"shot\"><b>Screenshot 1<\/b> – Events tab selected on a vessel page<\/div><\/li><li>Wait for the table to load. A spinner shows while data is loading.<\/li><li>Select <strong>Event Type<\/strong> above the table to open the list of event types.<div class=\"shot\"><b>Screenshot 2<\/b> – Event Type dropdown showing grouped options<\/div><\/li><li>Tick or untick the types you want. They are grouped as <strong>Port Events<\/strong> (<strong>Area Arrival<\/strong>, <strong>Arrival<\/strong>, <strong>Departure<\/strong>, <strong>Area Departure<\/strong>), <strong>Zone Events<\/strong> (<strong>Zone Entry<\/strong>, <strong>Zone Exit<\/strong>) and <strong>Other Events<\/strong> (<strong>AIS Gap<\/strong>, <strong>STS Pairing<\/strong>, <strong>Positional Discrepancy<\/strong>, <strong>Port State Control<\/strong>).<\/li><li>To tick or untick everything at once, use the select-all option at the top of the list.<\/li><li>Type in <strong>Search...<\/strong> to narrow the rows. It matches any value in the row, including the dates as you see them.<\/li><li>Select a column heading to sort by that column. Select it again to reverse the order.<\/li><li>To see more columns, open the <strong>Columns<\/strong> panel on the side of the table and tick the columns you want. <strong><mark class=\"confirm\">[CONFIRM: where the Columns tab appears on screen]<\/mark><\/strong><div class=\"shot\"><b>Screenshot 3<\/b> – Columns panel with optional columns<\/div><\/li><li>To go back to the standard columns, select <strong>Reset columns<\/strong>. It is greyed out until you change the columns.<\/li><li>Select a row to open the related port or zone page, if the row has one.<\/li><li>To get the data in a file, select <strong>Export<\/strong> (see Good to know).<div class=\"shot\"><b>Screenshot 4<\/b> – Export window<\/div><\/li><li>To reload the data, select <strong>Refresh<\/strong> at the top right (next to <strong>Updated ... ago<\/strong>).<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The table lists matching events with the newest first. The text beside the search box says, for example, \"Showing most recent 120 events\".<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The table shows at most the 500 most recent events. For the full dataset, use <strong>Export<\/strong>. Export times are in UTC.<\/li><li>Pages of 100 rows are used; you can change the page size at the bottom of the table.<\/li><li>The standard columns are <strong>TimeStamp<\/strong>, <strong>Event<\/strong>, <strong>Location<\/strong>, <strong>Country<\/strong>, <strong>UN/LOCODE<\/strong>, <strong>Zone Type<\/strong>, <strong>Speed<\/strong>, <strong>Course<\/strong> and <strong>Duration (hours)<\/strong>. The <strong>TimeStamp<\/strong> header shows <strong>(UTC)<\/strong> or <strong>(System)<\/strong>, following your time-zone setting. See \"How to read the events tables\" for what each column means.<\/li><li>Not every column applies to every event type. A dash (-) means no value. A tooltip beside the table says the same.<\/li><li>Hover over a cell to see its full value.<\/li><li>Clicking a <strong>Zone Entry<\/strong> or <strong>Zone Exit<\/strong> row opens that zone's page. Clicking a port event row opens that port's page. Other event types do nothing when clicked. <strong><mark class=\"confirm\">[CONFIRM: that Area Arrival and Area Departure rows open the port page]<\/mark><\/strong><\/li><li>The data refreshes by itself every 5 minutes. <strong>Updated ... ago<\/strong> shows the age of the data.<\/li><li>In <strong>Export<\/strong>, you choose <strong>Event type<\/strong> and <strong>Date range<\/strong> (<strong>Today<\/strong>, <strong>Yesterday<\/strong>, <strong>Last 7 Days<\/strong>, <strong>Last 30 Days<\/strong>, <strong>Last 90 Days<\/strong> or a custom range) and select <strong>Request export<\/strong>. When the file is ready it appears in Notifications or Downloads. <strong><mark class=\"confirm\">[CONFIRM: file format and whether the export covers other columns]<\/mark><\/strong><\/li><li>Berth events appear on the timeline and map but are not in this table's <strong>Event Type<\/strong> list.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>The table says <strong>No data available<\/strong><\/td><td>Tick more event types, clear <strong>Search...<\/strong>, or check again later.<\/td><\/tr><tr><td>A type seems missing<\/td><td>Each type is fetched separately. If one request fails, only that type is left out. Select <strong>Refresh<\/strong>. <strong><mark class=\"confirm\">[CONFIRM: no error message is shown for a failed type]<\/mark><\/strong><\/td><\/tr><tr><td>I need data older than 90 days<\/td><td>Use <strong>Export<\/strong> and pick a longer <strong>Date range<\/strong>.<\/td><\/tr><tr><td><strong>Refresh<\/strong> is greyed out<\/td><td>A refresh is already running.<\/td><\/tr><tr><td>Clicking a row does nothing<\/td><td>That event has no linked port or zone page.<\/td><\/tr><tr><td><strong>Request export<\/strong> is greyed out<\/td><td>Choose at least one event type and a valid date range.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the Events tab on a vessel page to see a table of that vessel's recent port, zone and other events, and to filter, search, sort and export them. Before you begin Open a vessel page ( /analytics/vessel/:id ). The table covers the last 90 days only. It has no date picker. Use Export for other periods. Steps Select the Events tab, next to Overview . 📷 Screenshot 1: Events tab selected on a vessel page Wait for the table to load. A spinner shows while data is loading. Select Event Type above the table to open the list of event types. 📷 Screenshot 2: Event Type dropdown showing grouped options Tick or untick the types you want. They are grouped as Port Events ( Area Arrival , Arrival , Departure , Area Departure ), Zone Events ( Zone Entry , Zone Exit ) and Other Events ( AIS Gap , STS Pairing , Positional Discrepancy , Port State Control ). To tick or untick everything at once, use the select-all option at the top of the list. Type in Search... to narrow the rows. It matches any value in the row, including the dates as you see them. Select a column heading to sort by that column. Select it again to reverse the order. To see more columns, open the Columns panel on the side of the table and tick the columns you want. [CONFIRM: where the Columns tab appears on screen] 📷 Screenshot 3: Columns panel with optional columns To go back to the standard columns, select Reset columns . It is greyed out until you change the columns. Select a row to open the related port or zone page, if the row has one. To get the data in a file, select Export (see Good to know). 📷 Screenshot 4: Export window To reload the data, select Refresh at the top right (next to Updated ... ago ). Expected result The table lists matching events with the newest first. The text beside the search box says, for example, \"Showing most recent 120 events\". Good to know The table shows at most the 500 most recent events. For the full dataset, use Export . Export times are in UTC. Pages of 100 rows are used; you can change the page size at the bottom of the table. The standard columns are TimeStamp , Event , Location , Country , UN/LOCODE , Zone Type , Speed , Course and Duration (hours) . The TimeStamp header shows (UTC) or (System) , following your time-zone setting. See \"How to read the events tables\" for what each column means. Not every column applies to every event type. A dash (-) means no value. A tooltip beside the table says the same. Hover over a cell to see its full value. Clicking a Zone Entry or Zone Exit row opens that zone's page. Clicking a port event row opens that port's page. Other event types do nothing when clicked. [CONFIRM: that Area Arrival and Area Departure rows open the port page] The data refreshes by itself every 5 minutes. Updated ... ago shows the age of the data. In Export , you choose Event type and Date range ( Today , Yesterday , Last 7 Days , Last 30 Days , Last 90 Days or a custom range) and select Request export . When the file is ready it appears in Notifications or Downloads. [CONFIRM: file format and whether the export covers other columns] Berth events appear on the timeline and map but are not in this table's Event Type list. Troubleshooting Problem What to do The table says No data available Tick more event types, clear Search... , or check again later. A type seems missing Each type is fetched separately. If one request fails, only that type is left out. Select Refresh . [CONFIRM: no error message is shown for a failed type] I need data older than 90 days Use Export and pick a longer Date range . Refresh is greyed out A refresh is already running. Clicking a row does nothing That event has no linked port or zone page. Request export is greyed out Choose at least one event type and a valid date range. "}, "04-Vessels/08-how-to-read-the-events-tables": {"t": "How to read the events tables", "j": "04-Vessels", "h": "<p>Use this guide to understand each column in the <strong>Events<\/strong> tab of a vessel page, event type by event type.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a vessel page, select the <strong>Events<\/strong> tab and use <strong>Event Type<\/strong> to choose the events you want (see \"How to view and filter vessel events\").<\/li><li>The <strong>Events<\/strong> tab uses one combined table. The first nine columns (under the <strong>Overview<\/strong> heading) are shown by default. The others are hidden until you add them in the <strong>Columns<\/strong> panel.<\/li><li>A dash (-) means the value is not available for that event type.<\/li><li>The <strong>TimeStamp<\/strong>, <strong>Reported ETA<\/strong>, <strong>Inspection Date<\/strong>, <strong>Release Date<\/strong>, <strong>STS Ended<\/strong>, <strong>Gap Stopped<\/strong>, <strong>Gap Resumed<\/strong> and <strong>Stopped Timestamp<\/strong> headers end in <strong>(UTC)<\/strong> or <strong>(System)<\/strong>, following your time-zone setting.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Events<\/strong> tab.<\/li><li>Open <strong>Event Type<\/strong> and tick the event type you want to read.<div class=\"shot\"><b>Screenshot 1<\/b> – Event Type dropdown with one type selected<\/div><\/li><li>Find the matching section below to see which columns carry information for that type.<\/li><li>Open the <strong>Columns<\/strong> panel to show the extra columns listed in each section.<div class=\"shot\"><b>Screenshot 2<\/b> – Columns panel with grouped columns<\/div><\/li><\/ol>\n<h2>Columns shown for every event type<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TimeStamp<\/td><td>When the event happened (for a span, when it started).<\/td><\/tr><tr><td>Event<\/td><td>A coloured label with the event type, for example Arrival or AIS Gap. Hover to see the full name.<\/td><\/tr><tr><td>Vessel, IMO, MMSI, Call Sign, Flag, Type<\/td><td>Hidden by default. The vessel's identity, repeated on each row.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Port events<\/h3>\n<p>Event types: <strong>Area Arrival<\/strong>, <strong>Arrival<\/strong>, <strong>Departure<\/strong>, <strong>Area Departure<\/strong>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Location<\/td><td>Name of the port or port area.<\/td><\/tr><tr><td>Country<\/td><td>Country of the port, with its flag.<\/td><\/tr><tr><td>UN/LOCODE<\/td><td>The port's UN/LOCODE.<\/td><\/tr><tr><td>Zone Type<\/td><td>The kind of area the event relates to. <strong><mark class=\"confirm\">[CONFIRM: values shown]<\/mark><\/strong><\/td><\/tr><tr><td>Speed<\/td><td>Vessel speed at the event, in knots (kn).<\/td><\/tr><tr><td>Course<\/td><td>Direction of travel over the ground, in degrees.<\/td><\/tr><tr><td>Duration (hours)<\/td><td>Not filled in for port events (shows -).<\/td><\/tr><tr><td>Heading<\/td><td>Hidden. Direction the bow points, in degrees.<\/td><\/tr><tr><td>Draught<\/td><td>Hidden. Depth of the vessel in the water, in metres.<\/td><\/tr><tr><td>Navigational Status (Status)<\/td><td>Hidden. The status the vessel reported, such as at anchor. <strong><mark class=\"confirm\">[CONFIRM: wording]<\/mark><\/strong><\/td><\/tr><tr><td>Reported Destination<\/td><td>Hidden. Destination typed in by the crew.<\/td><\/tr><tr><td>Reported ETA<\/td><td>Hidden. Arrival time reported by the vessel.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Row click: opens the port page.<\/p>\n<h3>Zone events<\/h3>\n<p>Event types: <strong>Zone Entry<\/strong>, <strong>Zone Exit<\/strong>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Location<\/td><td>Name of the zone entered or left.<\/td><\/tr><tr><td>Country<\/td><td>Country the zone is in, with its flag.<\/td><\/tr><tr><td>UN/LOCODE<\/td><td>Always blank (-) for zone events.<\/td><\/tr><tr><td>Zone Type<\/td><td>The type of zone.<\/td><\/tr><tr><td>Speed, Course<\/td><td>Speed (kn) and course (degrees) at the event.<\/td><\/tr><tr><td>Heading, Draught, Navigational Status (Status), Reported Destination, Reported ETA<\/td><td>Hidden. Same meaning as for port events.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Row click: opens the zone page.<\/p>\n<h3>STS (ship-to-ship) pairings<\/h3>\n<p>Event type: <strong>STS Pairing<\/strong>. A pairing is a period when this vessel was close to another vessel, which may indicate a ship-to-ship transfer. <strong><mark class=\"confirm\">[CONFIRM: definition used by the data provider]<\/mark><\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TimeStamp<\/td><td>When the pairing started.<\/td><\/tr><tr><td>Duration (hours)<\/td><td>How long the pairing lasted.<\/td><\/tr><tr><td>STS Type<\/td><td>Hidden. The category of pairing. <strong><mark class=\"confirm\">[CONFIRM: possible values]<\/mark><\/strong><\/td><\/tr><tr><td>Paired Vessel<\/td><td>Hidden. Name of the other vessel.<\/td><\/tr><tr><td>Paired IMO<\/td><td>Hidden. IMO number of the other vessel.<\/td><\/tr><tr><td>STS Ended (UTC/System)<\/td><td>Hidden. When the pairing ended.<\/td><\/tr><tr><td>Location, Country, UN/LOCODE, Zone Type<\/td><td>Not filled in for STS pairings (-).<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>AIS gaps<\/h3>\n<p>Event type: <strong>AIS Gap<\/strong>. A period when the vessel's AIS transmissions stopped and then resumed.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TimeStamp<\/td><td>When the vessel stopped transmitting.<\/td><\/tr><tr><td>Speed<\/td><td>Speed (kn) in the last report before the gap.<\/td><\/tr><tr><td>Course<\/td><td>Course (degrees) in the last report before the gap.<\/td><\/tr><tr><td>Duration (hours)<\/td><td>Length of the gap.<\/td><\/tr><tr><td>Gap Stopped (UTC/System)<\/td><td>Hidden. When the signal stopped.<\/td><\/tr><tr><td>Gap Resumed (UTC/System)<\/td><td>Hidden. When the signal came back.<\/td><\/tr><tr><td>Draught Change<\/td><td>Hidden. Difference in reported draught across the gap, in metres. Can hint at loading or unloading. <strong><mark class=\"confirm\">[CONFIRM: sign convention]<\/mark><\/strong><\/td><\/tr><tr><td>Navigational Status (Status), Navigational Status (Code)<\/td><td>Hidden. Status reported when the signal stopped.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Positional discrepancies<\/h3>\n<p>Event type: <strong>Positional Discrepancy<\/strong>. A period when the vessel's reported position disagreed with other evidence of where it was. <strong><mark class=\"confirm\">[CONFIRM: how discrepancies are detected]<\/mark><\/strong><\/p>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TimeStamp<\/td><td>When the discrepancy started.<\/td><\/tr><tr><td>Duration (hours)<\/td><td>How long it lasted.<\/td><\/tr><tr><td>Has Ended<\/td><td>Hidden. Yes if it is over, No if still ongoing.<\/td><\/tr><tr><td>Started Latitude, Started Longitude<\/td><td>Hidden. Position when it began, in degrees.<\/td><\/tr><tr><td>Stopped Timestamp (UTC/System)<\/td><td>Hidden. When it ended.<\/td><\/tr><tr><td>Stopped Latitude, Stopped Longitude<\/td><td>Hidden. Position when it ended.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The kind of discrepancy (shown on the timeline) is not a column in this table.<\/p>\n<h3>Port State Control<\/h3>\n<p>Event type: <strong>Port State Control<\/strong>. An inspection of the vessel by a port authority.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TimeStamp<\/td><td>The inspection date.<\/td><\/tr><tr><td>Location<\/td><td>The port where the inspection took place.<\/td><\/tr><tr><td>Country<\/td><td>The port's country, with its flag.<\/td><\/tr><tr><td>Authority<\/td><td>Hidden. The inspecting authority.<\/td><\/tr><tr><td>Inspection Type<\/td><td>Hidden. The kind of inspection.<\/td><\/tr><tr><td>Inspection Date (UTC/System)<\/td><td>Hidden. Same date as <strong>TimeStamp<\/strong>.<\/td><\/tr><tr><td>Detained<\/td><td>Hidden. Yes or No.<\/td><\/tr><tr><td>Days Detained<\/td><td>Hidden. Number of days held.<\/td><\/tr><tr><td>No. Defects<\/td><td>Hidden. Number of defects found.<\/td><\/tr><tr><td>Release Date (UTC/System)<\/td><td>Hidden. When the vessel was released.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Expected result<\/h2>\n<p>You can tell, for each event type, which columns to read and which to ignore.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The code also contains separate, longer column sets for each event type. They include <strong>Port Name<\/strong>, <strong>Sub Type<\/strong>, <strong>Zone Name<\/strong>, <strong>Started At<\/strong>, <strong>Stopped At<\/strong>, <strong>Stopped Reporting At<\/strong>, <strong>Resumed Reporting At<\/strong>, <strong>Gap Duration (hours)<\/strong>, <strong>Expanded Inspection<\/strong>, <strong>Follow up Inspection<\/strong> and similar. They are not used in the vessel <strong>Events<\/strong> tab. <strong><mark class=\"confirm\">[CONFIRM: whether they appear anywhere else]<\/mark><\/strong><\/li><li><strong>Speed<\/strong>, <strong>Course<\/strong>, <strong>Heading<\/strong> and <strong>Draught<\/strong> can show 0 when the data source gave no value. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li>Export files include all available columns and use UTC times. <strong><mark class=\"confirm\">[CONFIRM: export column list]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A column is empty (-)<\/td><td>That column does not apply to this event type.<\/td><\/tr><tr><td>I cannot see <strong>Paired Vessel<\/strong> or <strong>Authority<\/strong><\/td><td>Open the <strong>Columns<\/strong> panel and tick it.<\/td><\/tr><tr><td>Times look different from the Overview tab<\/td><td>The table follows your time-zone setting. The timeline shows UTC.<\/td><\/tr><tr><td>Columns are in a mess<\/td><td>Select <strong>Reset columns<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use this guide to understand each column in the Events tab of a vessel page, event type by event type. Before you begin Open a vessel page, select the Events tab and use Event Type to choose the events you want (see \"How to view and filter vessel events\"). The Events tab uses one combined table. The first nine columns (under the Overview heading) are shown by default. The others are hidden until you add them in the Columns panel. A dash (-) means the value is not available for that event type. The TimeStamp , Reported ETA , Inspection Date , Release Date , STS Ended , Gap Stopped , Gap Resumed and Stopped Timestamp headers end in (UTC) or (System) , following your time-zone setting. Steps Select the Events tab. Open Event Type and tick the event type you want to read. 📷 Screenshot 1: Event Type dropdown with one type selected Find the matching section below to see which columns carry information for that type. Open the Columns panel to show the extra columns listed in each section. 📷 Screenshot 2: Columns panel with grouped columns Columns shown for every event type Column Meaning TimeStamp When the event happened (for a span, when it started). Event A coloured label with the event type, for example Arrival or AIS Gap. Hover to see the full name. Vessel, IMO, MMSI, Call Sign, Flag, Type Hidden by default. The vessel's identity, repeated on each row. Port events Event types: Area Arrival , Arrival , Departure , Area Departure . Column Meaning Location Name of the port or port area. Country Country of the port, with its flag. UN/LOCODE The port's UN/LOCODE. Zone Type The kind of area the event relates to. [CONFIRM: values shown] Speed Vessel speed at the event, in knots (kn). Course Direction of travel over the ground, in degrees. Duration (hours) Not filled in for port events (shows -). Heading Hidden. Direction the bow points, in degrees. Draught Hidden. Depth of the vessel in the water, in metres. Navigational Status (Status) Hidden. The status the vessel reported, such as at anchor. [CONFIRM: wording] Reported Destination Hidden. Destination typed in by the crew. Reported ETA Hidden. Arrival time reported by the vessel. Row click: opens the port page. Zone events Event types: Zone Entry , Zone Exit . Column Meaning Location Name of the zone entered or left. Country Country the zone is in, with its flag. UN/LOCODE Always blank (-) for zone events. Zone Type The type of zone. Speed, Course Speed (kn) and course (degrees) at the event. Heading, Draught, Navigational Status (Status), Reported Destination, Reported ETA Hidden. Same meaning as for port events. Row click: opens the zone page. STS (ship-to-ship) pairings Event type: STS Pairing . A pairing is a period when this vessel was close to another vessel, which may indicate a ship-to-ship transfer. [CONFIRM: definition used by the data provider] Column Meaning TimeStamp When the pairing started. Duration (hours) How long the pairing lasted. STS Type Hidden. The category of pairing. [CONFIRM: possible values] Paired Vessel Hidden. Name of the other vessel. Paired IMO Hidden. IMO number of the other vessel. STS Ended (UTC/System) Hidden. When the pairing ended. Location, Country, UN/LOCODE, Zone Type Not filled in for STS pairings (-). AIS gaps Event type: AIS Gap . A period when the vessel's AIS transmissions stopped and then resumed. Column Meaning TimeStamp When the vessel stopped transmitting. Speed Speed (kn) in the last report before the gap. Course Course (degrees) in the last report before the gap. Duration (hours) Length of the gap. Gap Stopped (UTC/System) Hidden. When the signal stopped. Gap Resumed (UTC/System) Hidden. When the signal came back. Draught Change Hidden. Difference in reported draught across the gap, in metres. Can hint at loading or unloading. [CONFIRM: sign convention] Navigational Status (Status), Navigational Status (Code) Hidden. Status reported when the signal stopped. Positional discrepancies Event type: Positional Discrepancy . A period when the vessel's reported position disagreed with other evidence of where it was. [CONFIRM: how discrepancies are detected] Column Meaning TimeStamp When the discrepancy started. Duration (hours) How long it lasted. Has Ended Hidden. Yes if it is over, No if still ongoing. Started Latitude, Started Longitude Hidden. Position when it began, in degrees. Stopped Timestamp (UTC/System) Hidden. When it ended. Stopped Latitude, Stopped Longitude Hidden. Position when it ended. The kind of discrepancy (shown on the timeline) is not a column in this table. Port State Control Event type: Port State Control . An inspection of the vessel by a port authority. Column Meaning TimeStamp The inspection date. Location The port where the inspection took place. Country The port's country, with its flag. Authority Hidden. The inspecting authority. Inspection Type Hidden. The kind of inspection. Inspection Date (UTC/System) Hidden. Same date as TimeStamp . Detained Hidden. Yes or No. Days Detained Hidden. Number of days held. No. Defects Hidden. Number of defects found. Release Date (UTC/System) Hidden. When the vessel was released. Expected result You can tell, for each event type, which columns to read and which to ignore. Good to know The code also contains separate, longer column sets for each event type. They include Port Name , Sub Type , Zone Name , Started At , Stopped At , Stopped Reporting At , Resumed Reporting At , Gap Duration (hours) , Expanded Inspection , Follow up Inspection and similar. They are not used in the vessel Events tab. [CONFIRM: whether they appear anywhere else] Speed , Course , Heading and Draught can show 0 when the data source gave no value. [CONFIRM] Export files include all available columns and use UTC times. [CONFIRM: export column list] Troubleshooting Problem What to do A column is empty (-) That column does not apply to this event type. I cannot see Paired Vessel or Authority Open the Columns panel and tick it. Times look different from the Overview tab The table follows your time-zone setting. The timeline shows UTC. Columns are in a mess Select Reset columns . "}, "04-Vessels/09-how-to-understand-the-mti-score": {"t": "How to understand the MTI score for a vessel", "j": "04-Vessels", "h": "<p>Use the <strong>MTI score<\/strong> section on a vessel's page to see a 0-5 transparency and compliance score at a glance.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>The MTI score is available only to accounts and users that are entitled to MTI. Without access, the section shows <strong>Unlock MTI Score<\/strong> and <strong>Available on request.<\/strong><\/li><li>Open a vessel from the Library or by searching, so you are on its <strong>Overview<\/strong> tab.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open the vessel you want to review. The page opens on the <strong>Overview<\/strong> tab.<\/li><li>In the left-hand vessel details panel, find the <strong>MTI score<\/strong> section.<div class=\"shot\"><b>Screenshot 1<\/b> – Vessel details panel with the collapsed MTI score section<\/div><\/li><li>Select <strong>MTI score<\/strong> to expand it.<\/li><li>Wait for the loading placeholder to finish.<\/li><li>Read the semicircular gauge. The large number is the vessel's score, shown to two decimal places, with <strong>0<\/strong> on the left end and <strong>5<\/strong> on the right end.<div class=\"shot\"><b>Screenshot 2<\/b> – MTI score gauge showing a score<\/div><\/li><li>Check where the round marker sits on the arc. The arc runs from red (left) to green (right).<\/li><li>To learn more about the index, select <strong>More about MTI<\/strong>. It opens in a new browser tab.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>A gauge shows the vessel's score between 0 and 5. Below it, a box titled <strong>See what's behind the score<\/strong> appears. It describes a full score profile across vessel, voyage, reporting and sanctions, and how the vessel ranks against its class and the global fleet. That box is marked <strong>Available on request.<\/strong><\/p>\n<h2>Good to know<\/h2>\n<ul><li>Hover over the small help icon next to <strong>MTI score<\/strong> (while the section is collapsed) to see the tooltip: a 0-5 score of how transparent and compliant the vessel's operations are. The higher the score, the lower the risk. It is powered by the Maritime Transparency Index (MTI).<\/li><li>The gauge colours run red, orange, yellow, light green and green from low to high. The screen shows no named risk bands or thresholds. <strong><mark class=\"confirm\">[CONFIRM: any official score bands or what counts as a good or poor score]<\/mark><\/strong><\/li><li>How the score is calculated, and how often it is refreshed, is not shown on screen. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/li><li>If a vessel has no score, you see an <strong>Unscored<\/strong> label and the text \"No MTI score is available for this vessel yet.\" and \"Scores appear once there is enough activity data to assess it.\"<\/li><li>The breakdown and ranking comparison are not shown in the app. The box says they are <strong>Available on request<\/strong> – select <strong>More about MTI<\/strong> to learn more and find contact details <strong><mark class=\"confirm\">[CONFIRM: the app shows a hover card with a More about MTI link, not a Contact us box]<\/mark><\/strong>.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>Unlock MTI Score<\/strong> appears instead of a gauge<\/td><td>Your account does not have MTI access. Select <strong>More about MTI<\/strong> or contact your account team.<\/td><\/tr><tr><td>\"MTI score is temporarily unavailable.\"<\/td><td>Select <strong>Retry<\/strong>. If it keeps failing, try again later.<\/td><\/tr><tr><td><strong>Unscored<\/strong> is shown<\/td><td>No score exists for this vessel yet. Check again later.<\/td><\/tr><tr><td>The section is hard to find<\/td><td>Scroll the left-hand panel. If the panel is hidden, select the ship icon (<strong>Show Vessel Details<\/strong>) in the map toolbar.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the MTI score section on a vessel's page to see a 0-5 transparency and compliance score at a glance. Before you begin The MTI score is available only to accounts and users that are entitled to MTI. Without access, the section shows Unlock MTI Score and Available on request. Open a vessel from the Library or by searching, so you are on its Overview tab. Steps Open the vessel you want to review. The page opens on the Overview tab. In the left-hand vessel details panel, find the MTI score section. 📷 Screenshot 1: Vessel details panel with the collapsed MTI score section Select MTI score to expand it. Wait for the loading placeholder to finish. Read the semicircular gauge. The large number is the vessel's score, shown to two decimal places, with 0 on the left end and 5 on the right end. 📷 Screenshot 2: MTI score gauge showing a score Check where the round marker sits on the arc. The arc runs from red (left) to green (right). To learn more about the index, select More about MTI . It opens in a new browser tab. Expected result A gauge shows the vessel's score between 0 and 5. Below it, a box titled See what's behind the score appears. It describes a full score profile across vessel, voyage, reporting and sanctions, and how the vessel ranks against its class and the global fleet. That box is marked Available on request. Good to know Hover over the small help icon next to MTI score (while the section is collapsed) to see the tooltip: a 0-5 score of how transparent and compliant the vessel's operations are. The higher the score, the lower the risk. It is powered by the Maritime Transparency Index (MTI). The gauge colours run red, orange, yellow, light green and green from low to high. The screen shows no named risk bands or thresholds. [CONFIRM: any official score bands or what counts as a good or poor score] How the score is calculated, and how often it is refreshed, is not shown on screen. [CONFIRM] If a vessel has no score, you see an Unscored label and the text \"No MTI score is available for this vessel yet.\" and \"Scores appear once there is enough activity data to assess it.\" The breakdown and ranking comparison are not shown in the app. The box says they are Available on request – select More about MTI to learn more and find contact details [CONFIRM: the app shows a hover card with a More about MTI link, not a Contact us box] . Troubleshooting Problem What to do Unlock MTI Score appears instead of a gauge Your account does not have MTI access. Select More about MTI or contact your account team. \"MTI score is temporarily unavailable.\" Select Retry . If it keeps failing, try again later. Unscored is shown No score exists for this vessel yet. Check again later. The section is hard to find Scroll the left-hand panel. If the panel is hidden, select the ship icon ( Show Vessel Details ) in the map toolbar. "}, "04-Vessels/10-how-to-run-ptrac-screening": {"t": "How to run PurpleTRAC screening on a vessel", "j": "04-Vessels", "h": "<p>Use the <strong>PurpleTRAC screening<\/strong> section to check a vessel against global sanctions watchlists and see an overall result.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>This feature is available only to accounts and users that are entitled to PurpleTRAC screening. Without access, the section shows <strong>Unlock PurpleTRAC Screening<\/strong> and <strong>Available on request.<\/strong><\/li><li>Open the vessel's page and stay on the <strong>Overview<\/strong> tab.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the left-hand vessel details panel, find the <strong>PurpleTRAC screening<\/strong> section.<div class=\"shot\"><b>Screenshot 1<\/b> – Vessel details panel with the PurpleTRAC screening section collapsed<\/div><\/li><li>Select <strong>PurpleTRAC screening<\/strong> to expand it. The screening starts automatically.<\/li><li>Watch the progress messages, for example \"Screening in progress...\", \"Checking sanctions watchlists...\" and \"Compiling compliance results...\".<div class=\"shot\"><b>Screenshot 2<\/b> – Screening in progress with spinner and message<\/div><\/li><li>If the check takes longer than a few seconds, you will see \"You can leave this page - results will be saved.\"<\/li><li>When it finishes, read the badge next to <strong>Overall<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – Overall result badge<\/div><\/li><li>To read more about the service, select <strong>More about PurpleTRAC<\/strong>. It opens in a new browser tab.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>The <strong>Overall<\/strong> row shows one badge: <strong>Ok<\/strong> (green), <strong>Warning<\/strong> (amber), <strong>Critical<\/strong> (red) or <strong>Unscored<\/strong> (grey). <strong><mark class=\"confirm\">[CONFIRM: exact meaning of each result and what triggers Warning or Critical]<\/mark><\/strong><\/p>\n<h2>Good to know<\/h2>\n<ul><li>Hover over the help icon beside the section name for the tooltip: sanctions and compliance screening against global watchlists, powered by PurpleTRAC.<\/li><li>There are no settings or filters for the screening in this section.<\/li><li>The screening runs again each time you expand the section for a vessel that has no screening currently running. <strong><mark class=\"confirm\">[CONFIRM: whether each run is saved or counted against a screening allowance]<\/mark><\/strong><\/li><li>The code behind the screen says results are kept if you navigate away. <strong><mark class=\"confirm\">[CONFIRM: how long results are retained and where to find them later]<\/mark><\/strong><\/li><li>A box named <strong>Get the full breakdown<\/strong> says you can see every check behind the result (sanctions, PSC history, ship movement and more). It is marked <strong>Available on request<\/strong> – select <strong>More about PurpleTRAC<\/strong> to learn more and find contact details <strong><mark class=\"confirm\">[CONFIRM: the app shows a hover card with a More about PurpleTRAC link, not a Contact us box]<\/mark><\/strong>.<\/li><li>If no result arrives within about 2.5 minutes, the section shows an error.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td><strong>Unlock PurpleTRAC Screening<\/strong> appears<\/td><td>Your account lacks access. Select <strong>More about PurpleTRAC<\/strong> or contact your account team.<\/td><\/tr><tr><td>\"PurpleTRAC screening is temporarily unavailable.\"<\/td><td>Select <strong>Retry<\/strong> to run the screening again.<\/td><\/tr><tr><td>Screening seems slow<\/td><td>Wait, or leave the page; the screen says results will be saved.<\/td><\/tr><tr><td>Result is <strong>Unscored<\/strong><\/td><td>The screen gives no reason. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the PurpleTRAC screening section to check a vessel against global sanctions watchlists and see an overall result. Before you begin This feature is available only to accounts and users that are entitled to PurpleTRAC screening. Without access, the section shows Unlock PurpleTRAC Screening and Available on request. Open the vessel's page and stay on the Overview tab. Steps In the left-hand vessel details panel, find the PurpleTRAC screening section. 📷 Screenshot 1: Vessel details panel with the PurpleTRAC screening section collapsed Select PurpleTRAC screening to expand it. The screening starts automatically. Watch the progress messages, for example \"Screening in progress...\", \"Checking sanctions watchlists...\" and \"Compiling compliance results...\". 📷 Screenshot 2: Screening in progress with spinner and message If the check takes longer than a few seconds, you will see \"You can leave this page - results will be saved.\" When it finishes, read the badge next to Overall . 📷 Screenshot 3: Overall result badge To read more about the service, select More about PurpleTRAC . It opens in a new browser tab. Expected result The Overall row shows one badge: Ok (green), Warning (amber), Critical (red) or Unscored (grey). [CONFIRM: exact meaning of each result and what triggers Warning or Critical] Good to know Hover over the help icon beside the section name for the tooltip: sanctions and compliance screening against global watchlists, powered by PurpleTRAC. There are no settings or filters for the screening in this section. The screening runs again each time you expand the section for a vessel that has no screening currently running. [CONFIRM: whether each run is saved or counted against a screening allowance] The code behind the screen says results are kept if you navigate away. [CONFIRM: how long results are retained and where to find them later] A box named Get the full breakdown says you can see every check behind the result (sanctions, PSC history, ship movement and more). It is marked Available on request – select More about PurpleTRAC to learn more and find contact details [CONFIRM: the app shows a hover card with a More about PurpleTRAC link, not a Contact us box] . If no result arrives within about 2.5 minutes, the section shows an error. Troubleshooting Problem What to do Unlock PurpleTRAC Screening appears Your account lacks access. Select More about PurpleTRAC or contact your account team. \"PurpleTRAC screening is temporarily unavailable.\" Select Retry to run the screening again. Screening seems slow Wait, or leave the page; the screen says results will be saved. Result is Unscored The screen gives no reason. [CONFIRM] "}, "04-Vessels/11-how-to-open-company-search-from-a-vessel-page": {"t": "How to search for company details from a vessel page", "j": "04-Vessels", "h": "<p>Use the company icon beside an ownership name on a vessel page to run a Beta AI search for that company's contact details.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a vessel page on the <strong>Overview<\/strong> tab and keep the left-hand vessel details panel open.<\/li><li>The icon only appears beside a company name that is filled in. Rows showing a dash (-) have no icon.<\/li><li>This is a Beta feature. Results are produced with AI and web search and may be incomplete or inaccurate.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>In the vessel details panel, open the <strong>Ownership<\/strong> section.<div class=\"shot\"><b>Screenshot 1<\/b> – Ownership section expanded in the vessel details panel<\/div><\/li><li>Find the company you want, listed under <strong>Operator<\/strong>, <strong>Registered owner<\/strong>, <strong>Technical manager<\/strong>, <strong>Ship manager<\/strong> or <strong>Group beneficial owner<\/strong>.<\/li><li>Select the small icon to the right of the company name, next to the <strong>Beta<\/strong> tag. Its tooltip reads <strong>Search Company Details<\/strong>.<div class=\"shot\"><b>Screenshot 2<\/b> – Company icon and Beta tag beside an ownership name<\/div><\/li><li>Wait while the search runs. The icon turns into a spinner and its tooltip reads \"AI searching ... \". The icon is disabled during this time.<\/li><li>When the search finishes, the company details window opens by itself.<div class=\"shot\"><b>Screenshot 3<\/b> – Company details window after a completed search<\/div><\/li><li>Select <strong>Close<\/strong> (the X at the top right) to return to the vessel page.<\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>A window opens with the company name, your chosen role for this vessel (for example \"Operator for &lt;vessel name&gt; (IMO ...)\"), and the details found. See \"How to read company details\".<\/p>\n<h2>Good to know<\/h2>\n<ul><li>After a search is done, the icon changes to an eye. Its tooltip reads <strong>View company details<\/strong>, and selecting it reopens the result without a new search.<\/li><li>If the same company appears in more than one ownership row on this vessel, the other rows switch to the eye icon when the first search finishes.<\/li><li>Results are kept for the current browser session for up to 24 hours. Use <strong>Refresh<\/strong> inside the window to search again.<\/li><li>If you closed the window while a search was running, the result is saved and the eye icon appears when it completes. <strong><mark class=\"confirm\">[CONFIRM: whether the window then opens automatically or only the icon changes]<\/mark><\/strong><\/li><li>A search that takes too long stops after about 2 and a half minutes.<\/li><li>This search starts from a vessel's ownership rows only. The <strong>Search<\/strong> item in the main sidebar searches vessels, ports and zones, not companies.<\/li><li><strong><mark class=\"confirm\">[CONFIRM: whether this feature is limited to certain accounts or subscriptions. Nothing in the page limits it.]<\/mark><\/strong><\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>There is no icon beside the name<\/td><td>The company name is empty (shown as -). Icons appear only for named companies.<\/td><\/tr><tr><td>A red message appears saying the search failed<\/td><td>Select the icon and try again. Messages include \"Company search failed. Please try again.\" and \"Company search timed out. Please try again.\"<\/td><\/tr><tr><td>The icon is greyed with a spinner<\/td><td>A search is still running. Wait for it to finish.<\/td><\/tr><tr><td>The window says \"No reliable results found for this company\"<\/td><td>See \"How to read company details\". Verify through official sources.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the company icon beside an ownership name on a vessel page to run a Beta AI search for that company's contact details. Before you begin Open a vessel page on the Overview tab and keep the left-hand vessel details panel open. The icon only appears beside a company name that is filled in. Rows showing a dash (-) have no icon. This is a Beta feature. Results are produced with AI and web search and may be incomplete or inaccurate. Steps In the vessel details panel, open the Ownership section. 📷 Screenshot 1: Ownership section expanded in the vessel details panel Find the company you want, listed under Operator , Registered owner , Technical manager , Ship manager or Group beneficial owner . Select the small icon to the right of the company name, next to the Beta tag. Its tooltip reads Search Company Details . 📷 Screenshot 2: Company icon and Beta tag beside an ownership name Wait while the search runs. The icon turns into a spinner and its tooltip reads \"AI searching ... \". The icon is disabled during this time. When the search finishes, the company details window opens by itself. 📷 Screenshot 3: Company details window after a completed search Select Close (the X at the top right) to return to the vessel page. Expected result A window opens with the company name, your chosen role for this vessel (for example \"Operator for <vessel name> (IMO ...)\"), and the details found. See \"How to read company details\". Good to know After a search is done, the icon changes to an eye. Its tooltip reads View company details , and selecting it reopens the result without a new search. If the same company appears in more than one ownership row on this vessel, the other rows switch to the eye icon when the first search finishes. Results are kept for the current browser session for up to 24 hours. Use Refresh inside the window to search again. If you closed the window while a search was running, the result is saved and the eye icon appears when it completes. [CONFIRM: whether the window then opens automatically or only the icon changes] A search that takes too long stops after about 2 and a half minutes. This search starts from a vessel's ownership rows only. The Search item in the main sidebar searches vessels, ports and zones, not companies. [CONFIRM: whether this feature is limited to certain accounts or subscriptions. Nothing in the page limits it.] Troubleshooting Problem What to do There is no icon beside the name The company name is empty (shown as -). Icons appear only for named companies. A red message appears saying the search failed Select the icon and try again. Messages include \"Company search failed. Please try again.\" and \"Company search timed out. Please try again.\" The icon is greyed with a spinner A search is still running. Wait for it to finish. The window says \"No reliable results found for this company\" See \"How to read company details\". Verify through official sources. "}, "04-Vessels/12-how-to-read-company-details": {"t": "How to read company details", "j": "04-Vessels", "h": "<p>Use the company details window to see the website, address, phone numbers, departments, contacts and sources found for a company.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Run a search from a vessel's <strong>Ownership<\/strong> section (see \"How to search for company details from a vessel page\").<\/li><li>Every section appears only if information was found for it.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Read the banner at the top: \"This AI contact search feature is currently in beta - results may be incomplete or inaccurate.\"<div class=\"shot\"><b>Screenshot 1<\/b> – Company details window with Beta banner<\/div><\/li><li>Check the heading. It shows the company name and a line such as \"Operator for &lt;vessel name&gt; (IMO ...)\".<\/li><li>Look at the confidence badge under the heading: <strong>High Confidence<\/strong>, <strong>Medium Confidence<\/strong> or <strong>Low Confidence<\/strong>.<\/li><li>Read the contact block: website (opens in a new tab), headquarters address with a small map, and main phone number.<div class=\"shot\"><b>Screenshot 2<\/b> – Website, address, map and phone<\/div><\/li><li>Read the blue box, if shown. It can contain <strong>Match Type<\/strong>, <strong>Warning: Shell Company / SPV<\/strong> and <strong>Parent Company<\/strong>.<\/li><li>Read <strong>Departments &amp; Contacts<\/strong>. Each card shows the department name, its relevance to maritime, a phone number and an email. A card without details says \"No direct contact details.\"<\/li><li>Read <strong>Alternative Contacts<\/strong>. Each card shows the type, location, address, phone and email.<\/li><li>Open <strong>Sources<\/strong> to see where the information came from. They are grouped as <strong>Tier 1 - Official Sources<\/strong>, <strong>Tier 2 - Verified Directories<\/strong>, <strong>Tier 3 - Secondary Sources<\/strong> and <strong>Tier 4 - Other Sources<\/strong>. Select a source to open it in a new tab.<\/li><li>Read <strong>Confidence Assessment<\/strong> for the reason behind the confidence level.<\/li><li>Read <strong>AI-Generated Content Disclaimer<\/strong> at the bottom and verify key details before acting on them.<\/li><\/ol>\n<h2>Good to know<\/h2>\n<ul><li>To search again, select <strong>Refresh<\/strong>. It shows \"Refreshing...\" while it runs.<\/li><li>To save the contacts, select <strong>Export<\/strong> and choose <strong>vCard (.vcf)<\/strong> or <strong>CSV (.csv)<\/strong>. The CSV has the columns Type, Name, Phone, Email and Website.<\/li><li><strong>Export<\/strong> is hidden when no results were found.<\/li><li>The map is hidden if the address cannot be located.<\/li><li>This window does not list the company's other vessels or fleet.<\/li><li>Email addresses open your mail program when selected.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>\"No reliable results found for this company\" and \"Please verify via official sources\"<\/td><td>The search found nothing dependable. Try <strong>Refresh<\/strong>, or check the company's official sources.<\/td><\/tr><tr><td>No <strong>Export<\/strong> button<\/td><td>Export is available only when results exist.<\/td><\/tr><tr><td>No map under the address<\/td><td>The address could not be located. Use the address text.<\/td><\/tr><tr><td>Results look wrong<\/td><td>Check <strong>Confidence Assessment<\/strong> and <strong>Sources<\/strong>, then verify with the company.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the company details window to see the website, address, phone numbers, departments, contacts and sources found for a company. Before you begin Run a search from a vessel's Ownership section (see \"How to search for company details from a vessel page\"). Every section appears only if information was found for it. Steps Read the banner at the top: \"This AI contact search feature is currently in beta - results may be incomplete or inaccurate.\" 📷 Screenshot 1: Company details window with Beta banner Check the heading. It shows the company name and a line such as \"Operator for <vessel name> (IMO ...)\". Look at the confidence badge under the heading: High Confidence , Medium Confidence or Low Confidence . Read the contact block: website (opens in a new tab), headquarters address with a small map, and main phone number. 📷 Screenshot 2: Website, address, map and phone Read the blue box, if shown. It can contain Match Type , Warning: Shell Company / SPV and Parent Company . Read Departments & Contacts . Each card shows the department name, its relevance to maritime, a phone number and an email. A card without details says \"No direct contact details.\" Read Alternative Contacts . Each card shows the type, location, address, phone and email. Open Sources to see where the information came from. They are grouped as Tier 1 - Official Sources , Tier 2 - Verified Directories , Tier 3 - Secondary Sources and Tier 4 - Other Sources . Select a source to open it in a new tab. Read Confidence Assessment for the reason behind the confidence level. Read AI-Generated Content Disclaimer at the bottom and verify key details before acting on them. Good to know To search again, select Refresh . It shows \"Refreshing...\" while it runs. To save the contacts, select Export and choose vCard (.vcf) or CSV (.csv) . The CSV has the columns Type, Name, Phone, Email and Website. Export is hidden when no results were found. The map is hidden if the address cannot be located. This window does not list the company's other vessels or fleet. Email addresses open your mail program when selected. Troubleshooting Problem What to do \"No reliable results found for this company\" and \"Please verify via official sources\" The search found nothing dependable. Try Refresh , or check the company's official sources. No Export button Export is available only when results exist. No map under the address The address could not be located. Use the address text. Results look wrong Check Confidence Assessment and Sources , then verify with the company. "}, "05-Ports/01-how-to-open-and-read-a-port-page": {"t": "How to open and read a port page", "j": "05-Ports", "h": "<p>Open a port in Meridia to see its live vessel activity, congestion analytics, berths and events.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>The port must be findable through <strong>Library<\/strong> or <strong>Search<\/strong>, or already be in your Library.<\/li><li>Some header features (for example <strong>Ask IQ<\/strong> and PurpleTRAC auto-screening in notifications) depend on your access. See Good to know.<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Open <strong>Library<\/strong> from the main navigation.<\/li><li>Select the <strong>Ports<\/strong> tab.<div class=\"shot\"><b>Screenshot 1<\/b> – Library page with the Ports tab selected<\/div><\/li><li>Select the port you want. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how a port is located on this tab (search box, list rows, add button) because that screen is outside this page's code. You can also use <strong>Search<\/strong> in the main navigation and pick a port from the results.<\/li><li>The port page opens (its address ends with the port's ID).<div class=\"shot\"><b>Screenshot 2<\/b> – Port page showing the header, tabs and Overview<\/div><\/li><li>Check the header. It shows the country flag, the port name, and a subtitle in the form \"Port, [country name]\".<\/li><li>Use the breadcrumbs <strong>Library<\/strong> &gt; <strong>Ports<\/strong> above the name to go back to your Library.<\/li><li>Select a tab to change what you see: <strong>Overview<\/strong>, <strong>Congestion and Utilisation<\/strong>, <strong>Berths<\/strong> or <strong>Events<\/strong>.<div class=\"shot\"><b>Screenshot 3<\/b> – The four port tabs<\/div><\/li><li>On <strong>Overview<\/strong>, read the vessel counts, the map and the charts. See \"How to view live port traffic on the map\".<\/li><li>On <strong>Congestion and Utilisation<\/strong>, review the port's congestion analytics. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> the content of this tab, which is covered in a separate article.<\/li><li>On <strong>Berths<\/strong>, browse the port's berths. Select a berth to open its details, then select the back control to return to <strong>Congestion and Utilisation<\/strong>.<\/li><li>On <strong>Events<\/strong>, choose <strong>Historic<\/strong> or <strong>Inbound Vessels<\/strong>. Under <strong>Historic<\/strong>, the event types are <strong>Area Arrivals<\/strong>, <strong>Arrivals<\/strong>, <strong>Berth Arrivals<\/strong>, <strong>Berth Departures<\/strong>, <strong>Departures<\/strong> and <strong>Area Departures<\/strong>.<div class=\"shot\"><b>Screenshot 4<\/b> – Events tab with event type options<\/div><\/li><li>To add the port to your Library, open the three-dot menu in the header and select <strong>Add to Library<\/strong>.<\/li><li>To remove it, open the same menu and select <strong>Remove from Library<\/strong>. If you have notifications on for the port, a <strong>Remove from Library?<\/strong> confirmation appears.<div class=\"shot\"><b>Screenshot 5<\/b> – Three-dot menu showing Add to Library<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You see the port's name and country, and can move between its Overview, Congestion and Utilisation, Berths and Events tabs.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>A confirmation message (\"added to bookmarks\" or \"removed from bookmarks\") appears after you add or remove the port.<\/li><li>The notification (bell-style) control in the header is labelled <strong>Manage Notifications<\/strong>. Switch on <strong>Enable Live Notifications<\/strong> to choose the events to be notified about: <strong>Area Arrivals<\/strong>, <strong>Arrivals<\/strong>, <strong>Departures<\/strong> and <strong>Area Departures<\/strong>. Enabling notifications adds the port to your Library.<\/li><li><strong>Auto-Screen Vessels<\/strong> and the <strong>SEVERITY<\/strong> options (<strong>Critical<\/strong>, <strong>OK<\/strong>, <strong>Warning<\/strong>, <strong>Unscored<\/strong>) in notifications need PurpleTRAC Auto-Screening. If it is not enabled for you, the tooltip says to contact your account manager. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exact email behaviour.<\/li><li><strong>Ask IQ<\/strong> appears next to the tabs only if your account or user is entitled to it. Selecting it opens Ask IQ with a prompt about this port.<\/li><li>The header has no date range picker for ports.<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> There is no port switcher on the page. To change port, use <strong>Search<\/strong>, <strong>Library<\/strong>, or select a vessel's port link elsewhere in the app.<\/li><li>A <strong>Details<\/strong> tab exists in the code but is switched off in the current build, so it is not shown.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A loading placeholder stays on screen<\/td><td>Wait a moment, then reload the page.<\/td><\/tr><tr><td>An error page appears instead of the port<\/td><td>Check the port ID in the address, then try again. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> exact error text.<\/td><\/tr><tr><td>You cannot find the port in Library<\/td><td>Use <strong>Search<\/strong> in the main navigation, or add it from the <strong>Ports<\/strong> tab.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Open a port in Meridia to see its live vessel activity, congestion analytics, berths and events. Before you begin The port must be findable through Library or Search , or already be in your Library. Some header features (for example Ask IQ and PurpleTRAC auto-screening in notifications) depend on your access. See Good to know. Steps Open Library from the main navigation. Select the Ports tab. 📷 Screenshot 1: Library page with the Ports tab selected Select the port you want. [CONFIRM] how a port is located on this tab (search box, list rows, add button) because that screen is outside this page's code. You can also use Search in the main navigation and pick a port from the results. The port page opens (its address ends with the port's ID). 📷 Screenshot 2: Port page showing the header, tabs and Overview Check the header. It shows the country flag, the port name, and a subtitle in the form \"Port, [country name]\". Use the breadcrumbs Library > Ports above the name to go back to your Library. Select a tab to change what you see: Overview , Congestion and Utilisation , Berths or Events . 📷 Screenshot 3: The four port tabs On Overview , read the vessel counts, the map and the charts. See \"How to view live port traffic on the map\". On Congestion and Utilisation , review the port's congestion analytics. [CONFIRM] the content of this tab, which is covered in a separate article. On Berths , browse the port's berths. Select a berth to open its details, then select the back control to return to Congestion and Utilisation . On Events , choose Historic or Inbound Vessels . Under Historic , the event types are Area Arrivals , Arrivals , Berth Arrivals , Berth Departures , Departures and Area Departures . 📷 Screenshot 4: Events tab with event type options To add the port to your Library, open the three-dot menu in the header and select Add to Library . To remove it, open the same menu and select Remove from Library . If you have notifications on for the port, a Remove from Library? confirmation appears. 📷 Screenshot 5: Three-dot menu showing Add to Library Expected result You see the port's name and country, and can move between its Overview, Congestion and Utilisation, Berths and Events tabs. Good to know A confirmation message (\"added to bookmarks\" or \"removed from bookmarks\") appears after you add or remove the port. The notification (bell-style) control in the header is labelled Manage Notifications . Switch on Enable Live Notifications to choose the events to be notified about: Area Arrivals , Arrivals , Departures and Area Departures . Enabling notifications adds the port to your Library. Auto-Screen Vessels and the SEVERITY options ( Critical , OK , Warning , Unscored ) in notifications need PurpleTRAC Auto-Screening. If it is not enabled for you, the tooltip says to contact your account manager. [CONFIRM] exact email behaviour. Ask IQ appears next to the tabs only if your account or user is entitled to it. Selecting it opens Ask IQ with a prompt about this port. The header has no date range picker for ports. [CONFIRM] There is no port switcher on the page. To change port, use Search , Library , or select a vessel's port link elsewhere in the app. A Details tab exists in the code but is switched off in the current build, so it is not shown. Troubleshooting Problem What to do A loading placeholder stays on screen Wait a moment, then reload the page. An error page appears instead of the port Check the port ID in the address, then try again. [CONFIRM] exact error text. You cannot find the port in Library Use Search in the main navigation, or add it from the Ports tab. "}, "05-Ports/02-how-to-view-live-port-traffic-on-the-map": {"t": "How to view live port traffic on the map", "j": "05-Ports", "h": "<p>Use the port Overview to see vessels in port and inbound, a live map, recent performance and the last 24 hours of arrivals and departures.<\/p>\n<h2>Before you begin<\/h2>\n<ul><li>Open a port page and select the <strong>Overview<\/strong> tab. See \"How to open and read a port page\".<\/li><\/ul>\n<h2>Steps<\/h2>\n<ol><li>Select the <strong>Overview<\/strong> tab.<\/li><li>Note the line \"Updated ... ago\" with a <strong>Refresh<\/strong> link at the top right. Select <strong>Refresh<\/strong> to reload all Overview data. Next to the tabs, the page also says \"Auto-updates every 5 minutes\".<div class=\"shot\"><b>Screenshot 1<\/b> – Overview tab with the Updated ago line and Refresh link<\/div><\/li><li>If a progress bar appears reading \"Loading ... vessels\", wait for it to finish. It shows how many vessels have loaded.<\/li><li>In the left column, read the <strong>Vessels In Port<\/strong> card. The number is the count of vessels currently in port.<\/li><li>Select <strong>Vessels In Port<\/strong> to open the list titled <strong>In Port<\/strong>. Each row shows the vessel name, type, IMO and <strong>ATA<\/strong> (a UTC date and time).<div class=\"shot\"><b>Screenshot 2<\/b> – In Port list expanded<\/div><\/li><li>Select a vessel row to open that vessel's page.<\/li><li>Select <strong>View all<\/strong> to open the <strong>Events<\/strong> tab on <strong>Historic<\/strong>, or <strong>Back<\/strong> to return to the cards.<\/li><li>Read the <strong>Vessels Inbound<\/strong> card. Its title shows the time frame, for example \"next 24h\", or \"All\".<\/li><li>Select <strong>Vessels Inbound<\/strong> to open the <strong>Inbound<\/strong> list. Each row shows name, type, IMO and <strong>ETA<\/strong>.<\/li><li>In the <strong>Inbound<\/strong> list, under <strong>Within next<\/strong>, choose <strong>24h<\/strong>, <strong>7d<\/strong>, <strong>30d<\/strong> or <strong>All<\/strong> to change the time frame.<div class=\"shot\"><b>Screenshot 3<\/b> – Inbound list with the Within next time frames<\/div><\/li><li>Select <strong>View all Events<\/strong> to open the <strong>Events<\/strong> tab on <strong>Inbound Vessels<\/strong>.<\/li><li>Read the <strong>Performance (Previous 30 days)<\/strong> card: <strong>Unique Arrivals per Day (avg)<\/strong>, <strong>Unique Arrivals per Day (max)<\/strong>, <strong>Dwell time at berth (avg)<\/strong> and <strong>Dwell time at berth (median)<\/strong> (in hrs).<\/li><li>Select <strong>View congestion and utilisation analytics<\/strong> to open that tab.<\/li><li>On the map, check the legend at top left. <strong>In Port<\/strong> (orange) marks vessels in port and <strong>Inbound<\/strong> (teal) marks inbound vessels. The port boundary is also drawn.<div class=\"shot\"><b>Screenshot 4<\/b> – Map with legend, port boundary and vessel markers<\/div><\/li><li>Select the map style button (tooltip <strong>Toggle Map Styles<\/strong>) at top right. In <strong>Map Style<\/strong>, choose <strong>Simple<\/strong>, <strong>Satellite<\/strong> or <strong>C-MAP<\/strong>, and switch <strong>Grid / Graticules<\/strong> on or off.<\/li><li>Use the zoom controls at bottom right. The map also shows cursor coordinates.<\/li><li>Scroll down to the charts <strong>Arrivals and Departures<\/strong> (<strong>Last 24 Hours<\/strong>) and <strong>Arrivals by Vessel Type<\/strong> (<strong>Last 24 Hours<\/strong>).<div class=\"shot\"><b>Screenshot 5<\/b> – Arrivals and Departures charts<\/div><\/li><\/ol>\n<h2>Expected result<\/h2>\n<p>You see current vessel counts, a map of vessels in and heading to the port, and charts for the last 24 hours.<\/p>\n<h2>Good to know<\/h2>\n<ul><li>The legend only lists a group (<strong>In Port<\/strong>, <strong>Inbound<\/strong>) when that group has vessels, and is hidden when there are none.<\/li><li>\"Commercial vessels only\" appears beside the charts. Its tooltip says all data uses commercial vessel data only and excludes passenger, fishing and tug vessels.<\/li><li>Empty states: \"No vessels currently in port\", \"No mappable vessels currently in port\" and \"No inbound vessels\".<\/li><li>The <strong>Inbound<\/strong> time frame you pick is remembered on your device.<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how \"in port\" and \"inbound\" are defined, and the data sources and freshness of ATA and ETA.<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> how the Performance figures and the arrival and departure counts are calculated.<\/li><li><strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> map marker interactions (hover or click) as they depend on shared map code.<\/li><\/ul>\n<h2>Troubleshooting<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Problem<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Charts or Performance show \"No data available\"<\/td><td>Select <strong>Refresh<\/strong>, or reload the page. The message suggests adjusting filters or refreshing.<\/td><\/tr><tr><td>The map is blank or shows a missing-token notice<\/td><td>Contact support. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong> wording and cause.<\/td><\/tr><tr><td>The vessel count differs from the markers on the map<\/td><td>The \"No mappable vessels\" message means some vessels have no usable position. <strong><mark class=\"confirm\">[CONFIRM]<\/mark><\/strong><\/td><\/tr><tr><td>Data looks old<\/td><td>Check the \"Updated ... ago\" time, then select <strong>Refresh<\/strong>.<\/td><\/tr><\/tbody><\/table><\/div>", "x": " Use the port Overview to see vessels in port and inbound, a live map, recent performance and the last 24 hours of arrivals and departures. Before you begin Open a port page and select the Overview tab. See \"How to open and read a port page\". Steps Select the Overview tab. Note the line \"Updated ... ago\" with a Refresh link at the top right. Select Refresh to reload all Overview data. Next to the tabs, the page also says \"Auto-updates every 5 minutes\". 📷 Screenshot 1: Overview tab with the Updated ago line and Refresh link If a progress bar appears reading \"Loading ... vessels\", wait for it to finish. It shows how many vessels have loaded. In the left column, read the Vessels In Port card. The number is the count of vessels currently in port. Select Vessels In Port to open the list titled In Port . Each row shows the vessel name, type, IMO and ATA (a UTC date and time). 📷 Screenshot 2: In Port list expanded Select a vessel row to open that vessel's page. Select View all to open the Events tab on Historic , or Back to return to the cards. Read the Vessels Inbound card. Its title shows the time frame, for example \"next 24h\", or \"All\". Select Vessels Inbound to open the Inbound list. Each row shows name, type, IMO and ETA . In the Inbound list, under Within next , choose 24h , 7d , 30d or All to change the time frame. 📷 Screenshot 3: Inbound list with the Within next time frames Select View all Events to open the Events tab on Inbound Vessels . Read the Performance (Previous 30 days) card: Unique Arrivals per Day (avg) , Unique Arrivals per Day (max) , Dwell time at berth (avg) and Dwell time at berth (median) (in hrs). Select View congestion and utilisation analytics to open that tab. On the map, check the legend at top left. In Port (orange) marks vessels in port and Inbound (teal) marks inbound vessels. The port boundary is also drawn.
